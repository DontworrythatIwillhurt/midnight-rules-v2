    /**
     * 30 秒左右的 Agent 闭环 Demo。
     *
     * 与侧栏 ▶ 的剧情巡览不同，本 Demo 必须由评委
     * 点击批准或拒绝，证明 Human-in-the-loop。
     */
    function runAgentClosureDemo() {
      if (demoRunning) {
        agentAppend(
          'agent',
          MidnightAgent.name,
          '已有演示正在运行。请先点击顶部“停止演示”。'
        );
        return;
      }
      clearDemoTimers();
      beginDemoIsolation();
      demoRunning = true;
      document.body.classList.add(
        'guide-mode',
        'demo-running'
      );
      if (!isPhoneLayout()) {
        document.body.classList.add('show-agent-trace');
      }
      if (demoBanner) {
        demoBanner.classList.add('on');
      }
      setDemoBanner(
        'Agent 闭环 Demo · 正在建立高危场景'
      );
      const traceButton =
        document.getElementById(
          'agent-trace-toggle'
        );
      if (traceButton) {
        traceButton.classList.toggle('on', !isPhoneLayout());
      }
      agentOpen();
      unlockAudio();
      try {
        if (!synth.isPlaying) {
          synth.start();
        }
        GhostBrideBGM.start();
        if (toggleAmbient) {
          toggleAmbient.innerText =
            '音频: 开';
        }
      } catch (e) {}
      /*
       * 建立只存在于 Demo 沙盒中的测试条件。
       * 纸条使“抱住红衣人”成为风险最低的行动。
       */
      gameState.has_note = true;
      gameState.has_badge = true;
      sanity = Math.min(
        sanityMax,
        Math.max(70, sanity)
      );
      renderInventory();
      updateSanityUI();
      currentScene = '';
      death.classList.remove('on');
      clearDeathFx();
      clearBlood();
      showScene('car3_init');
      /*
       * 立即完成正文，显示结构化选项；
       * demoRunning=true，因此不会启动 8 秒死亡倒计时。
       */
      if (isTyping) {
        skipTypewriter();
      }
      agentAppendDemoStep(
        '① 观察高危场景',
        [
          'observe_game',
          '上下文感知'
        ],
        '读取车厢三、阳气、纸条、已知守则和当前行动。'
      );
      const observed =
        MidnightSkills.invoke(
          'observe_game'
        );
      agentAppend(
        'skill',
        'Skill · observe_game',
        observed.text,
        {
          intent: 'observe_game',
          skill: 'observe_game',
          confidence: 1,
          at: currentScene,
          args: {}
        }
      );
      agentAppendDemoStep(
        '② 评估所有行动',
        [
          'assess_actions',
          '风险排序'
        ],
        '比较闭眼、看窗外和抱住红衣人的风险。'
      );
      const assessed =
        MidnightSkills.invoke(
          'assess_actions'
        );
      agentAppend(
        'skill',
        'Skill · assess_actions',
        assessed.text,
        {
          intent: 'assess_actions',
          skill: 'assess_actions',
          confidence: 1,
          at: currentScene,
          args: {}
        }
      );
      agentAppendDemoStep(
        '③ 提出行动方案',
        [
          'propose_action',
          'Human-in-the-loop'
        ],
        'Agent 只提出方案，不会未经批准执行。'
      );
      const proposal =
        MidnightSkills.invoke(
          'propose_action'
        );
      agentAppend(
        'skill',
        'Skill · propose_action',
        proposal.text,
        {
          intent: 'propose_action',
          skill: 'propose_action',
          confidence: 1,
          at: currentScene,
          args: {}
        }
      );
      if (
        !proposal.ok ||
        !proposal.data
      ) {
        agentAppend(
          'agent',
          MidnightAgent.name,
          '闭环 Demo 无法生成行动提案，已安全停止。'
        );
        stopProductDemo(false);
        return;
      }
      setDemoBanner(
        'Agent 闭环 Demo · 等待评委批准或拒绝'
      );
      agentAppendApproval(
        proposal.data,
        {
          onApproved(result, verify) {
            setDemoBanner(
              'Agent 闭环 Demo · 执行与验证成功'
            );
            agentAppendDemoStep(
              '④ 执行并验证',
              [
                'execute_action',
                'verify_result'
              ],
              '玩家明确批准后，Agent 改变游戏状态并验证存活结果。'
            );
            scheduleDemo(() => {
              stopProductDemo(true);
            }, 1800);
          },
          onRejected() {
            setDemoBanner(
              'Agent 闭环 Demo · 玩家拒绝，状态未改变'
            );
            agentAppendDemoStep(
              '④ 拒绝生效',
              [
                'Human-in-the-loop',
                '安全停止'
              ],
              '玩家拒绝后，Agent 没有改变游戏状态。'
            );
            scheduleDemo(() => {
              stopProductDemo(true);
            }, 1800);
          },
          onError() {
            setDemoBanner(
              'Agent 闭环 Demo · 执行失败，已安全停止'
            );
            scheduleDemo(() => {
              stopProductDemo(true);
            }, 1800);
          }
        }
      );
    }

    /** 停止演示并恢复正常游玩 */
    function stopProductDemo(silent) {
      clearDemoTimers();
      invalidatePendingApprovalCards(
        'Demo 已停止，必须重新观察和提案'
      );
      demoRunning = false;
      document.body.classList.remove(
        'guide-mode',
        'demo-running'
      );
      if (demoBanner) {
        demoBanner.classList.remove('on');
      }
      setDemoBanner('演示模式');
      /*
       * 恢复评委运行 Demo 前的真实状态。
       */
      restoreDemoIsolation();
      if (!silent) {
        agentAppend(
          'agent',
          MidnightAgent.name,
          '演示已停止，Demo 沙盒已经清除。你的真实存档、道具、成就与游戏进度均已恢复。'
        );
      } else {
        agentAppend(
          'agent',
          MidnightAgent.name,
          '—— 演示结束 ——\nDemo 状态已清除，真实存档没有被修改。你可以自由提问，或输入“替我选择”体验人机批准闭环。'
        );
      }
    }

    // 暴露给控制台 / 外部评测脚本
    /**
     * 自动评测与开发调试入口。
     *
     * 注意：
     * - 只用于 TESTING.md 和评审控制台；
     * - setSanity 不写入 localStorage；
     * - 正常玩家逻辑仍通过 MidnightSkills 操作。
     */
    const MidnightTest = {
      getState() {
        return {
          runMode: RUN_MODE,
          guestSessionId: guestSessionId,
          sceneKey: currentScene,
          sceneVersion,
          sanity: Math.round(sanity),
          sanityMax,
          items: ITEMS
            .filter(item => !!gameState[item.id])
            .map(item => item.id),
          rule5Known: !!gameState.rule5_known,
          pendingProposalId:
            MidnightAgent.pendingProposal
              ? MidnightAgent.pendingProposal.proposalId
              : null,
          lastExecutionId:
            MidnightAgent.lastExecution
              ? MidnightAgent.lastExecution.executionId
              : null,
          stateFingerprint:
            getAgentStateFingerprint()
        };
      },
      /**
       * 用于稳定测试 stale_state。
       * 直接修改内存阳气，不触发剧情、不写存档。
       */
      setSanity(value) {
        const next = Number(value);
        if (!Number.isFinite(next)) {
          throw new TypeError(
            'MidnightTest.setSanity(value) 要求传入有效数字'
          );
        }
        sanity = Math.max(
          0,
          Math.min(sanityMax, next)
        );
        updateSanityUI();
        return this.getState();
      },
      getStorageRaw() {
        try {
          return localStorage.getItem(SAVE_KEY);
        } catch (e) {
          return null;
        }
      }
    };
    window.MidnightTest =
      Object.freeze(MidnightTest);
    window.MidnightSkills = MidnightSkills;
    window.MidnightAgent = MidnightAgent;
    window.runProductDemo =
      runProductDemo;
    window.runAgentClosureDemo =
      runAgentClosureDemo;
    window.stopProductDemo =
      stopProductDemo;
    window.setReviewMode =
      setReviewMode;
    window.preloadCriticalAssets =
      preloadCriticalAssets;

    renderSkillChips();
    const btnAgent = document.getElementById('btn-agent');
    const btnDemo = document.getElementById('btn-demo');
    const btnReview = document.getElementById('btn-review');
    if (btnAgent) btnAgent.onclick = () => {
      if (agentPanel && agentPanel.classList.contains('open')) agentClose();
      else agentOpen();
    };
    const btnAwAsk = document.getElementById('agent-whisper-ask');
    const btnAwDismiss = document.getElementById('agent-whisper-dismiss');
    if (btnAwAsk) {
      btnAwAsk.onclick = (e) => {
        e.preventDefault();
        e.stopPropagation();
        hideAgentWhisper();
        agentOpen();
        try { agentHandle('下一步怎么选'); } catch (err) {}
      };
    }
    if (btnAwDismiss) {
      btnAwDismiss.onclick = (e) => {
        e.preventDefault();
        e.stopPropagation();
        hideAgentWhisper();
      };
    }
    // 低语气泡在手机上宽 calc(100%-16px)，.on 时 pointer-events:auto，
    // 会把下方的侧栏 🤖 按钮整个盖住最长 7.2s —— 实测 390×844 访客态
    // elementFromPoint(#btn-agent 中心) 命中的是 agent-whisper-text。
    // 与其调层叠去抢位置，不如让点气泡本体＝打开面板：想点 🤖 的人得到的正是面板。
    // （「问它」「知道了」两个按钮都已 stopPropagation，不会误触到这里。）
    {
      const aw = document.getElementById('agent-whisper');
      if (aw) aw.onclick = () => {
        hideAgentWhisper();
        agentOpen();
      };
    }
    if (btnDemo) btnDemo.onclick = () => {
      agentOpen();
      runProductDemo();
    };
    if (btnReview) btnReview.onclick = () => {
      const on = !document.body.classList.contains('review-mode');
      setReviewMode(on);
    };
    const btnAgentClose = document.getElementById('agent-close');
    const btnAgentDemo = document.getElementById('agent-demo-run');
    const btnAgentSend = document.getElementById('agent-send');
    const btnTrace = document.getElementById('agent-trace-toggle');
    if (btnAgentClose) btnAgentClose.onclick = agentClose;
    if (btnAgentDemo) {
      btnAgentDemo.onclick = () => {
        if (guideStep === 2) { guideStep = 3; setTimeout(showGuideStep, 400); }
        runAgentClosureDemo();
      };
    }
    if (demoBannerStop) demoBannerStop.onclick = () => stopProductDemo(false);
    if (btnTrace) {
      btnTrace.onclick = () => {
        document.body.classList.toggle('show-agent-trace');
        btnTrace.classList.toggle('on', document.body.classList.contains('show-agent-trace'));
      };
    }
    if (btnAgentSend) btnAgentSend.onclick = () => {
      const v = agentInput ? agentInput.value : '';
      if (agentInput) agentInput.value = '';
      agentHandle(v);
    };
    if (agentInput) {
      agentInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const v = agentInput.value;
          agentInput.value = '';
          agentHandle(v);
        }
      });
    }
    // 评审五按钮
    document
      .querySelectorAll('.agent-review-chip')
      .forEach(chip => {
        chip.addEventListener('click', () => {
          const id = chip.getAttribute('data-review');
          const labels = {
            observe_game: '状态观察',
            assess_actions: '行动评估',
            propose_action: '行动提案',
            rulebook: '规则检索',
            ending_check: '结局诊断'
          };
          agentAppend(
            'user',
            '评审点选',
            labels[id] || id
          );
          const result = MidnightSkills.invoke(id);
          const trace = {
            intent: id,
            skill: result.skill,
            confidence: 1,
            at: currentScene || '—',
            args: {}
          };
          agentAppend(
            'skill',
            'Skill · ' + result.skill,
            '评审模式 invoke("' + id + '")',
            trace
          );
          agentAppend(
            'agent',
            MidnightAgent.name,
            result.text,
            trace
          );
          if (
            result.skill === 'propose_action' &&
            result.ok &&
            result.data &&
            result.data.requiresApproval
          ) {
            agentAppendApproval(result.data);
          }
        });
      });

    // URL ?mode=review 或既有 ?review=1 自动进评审模式
    try {
      if (isReviewMode) {
        setTimeout(() => setReviewMode(true), 400);
      }
    } catch (e) {}

    // 欢迎页提示：访客只看游戏说明，评审才看开发入口
    const welcomeDesc = document.querySelector('.welcome-desc');
    if (welcomeDesc && !welcomeDesc.dataset.agentTip) {
      welcomeDesc.dataset.agentTip = '1';
      if (isReviewMode) {
        welcomeDesc.innerHTML +=
          '<br><span style="color:#c9a227;">🤖 智能体 · ▶ Demo · 审 评审模式</span>' +
          '<br><span style="color:#8a7d60;font-size:12px;">Trace 可观测 · 主动护航 · 结局诊断 Skill</span>';
      }
    }

    if (isGuestMode) {
      const agentSub = document.querySelector('#agent-head .ah-sub');
      if (agentSub) {
        agentSub.textContent = '守则向导 · 可随时问询';
      }
    }

    // ==========================================
    // 版本水印：现场评委常问「线上是不是最新版」，直接把版本印在角上
    // ==========================================
    const BUILD_VERSION = 'v2.1.1';
    (function stampBuild() {
      const el = document.getElementById('build-stamp');
      if (!el) return;
      const label =
        isReviewMode ? '评审模式' :
        isKioskMode ? '展板模式' : '访客体验版';
      el.textContent = label + ' · ' + BUILD_VERSION;
      el.title = '免登录 · 无需 API Key · 配乐全合成';
    })();

    // ==========================================
    // 展板闲置回收：3 分钟无操作 → 自动回到欢迎页
    // 保证下一位参观者拿到干净状态（访客局本就不落盘，这里只重置内存与画面）
    // 只在访客/展板模式启用；评审模式不打扰（评委可能在读 Trace）
    // ==========================================
    const IDLE_RESET_MS = RUN_FLAGS.idleSec * 1000;
    let idleTimer = null;
    let idleResetting = false;

    function performIdleReset() {
      if (idleResetting) return;
      idleResetting = true;
      const notice = document.getElementById('idle-notice');
      if (notice) notice.classList.add('on');
      try {
        // Demo 正在跑就先收干净，否则沙盒会被留在半途
        if (demoRunning) stopProductDemo(true);
      } catch (e) {}
      setTimeout(() => {
        try {
          startFreshGuestRun('idle');
          recomputeSanityMax();
          sanity = sanityMax;
          updateSanityUI();
          renderInventory();
          try { agentClose(); } catch (e) {}
          try { synth.stop(); } catch (e) {}
          try { GhostBrideBGM.stop(); } catch (e) {}
          if (toggleAmbient) toggleAmbient.innerText = '音频: 关';
          showScene('prologue_platform');
          // 回到欢迎页：重新解锁「上车」，等下一位乘客
          if (welcomeScreen) {
            welcomeScreen.style.display = 'flex';
            welcomeScreen.style.opacity = '1';
          }
          guestEnterLocked = false;
          if (btnEnter) { try { btnEnter.disabled = false; } catch (e) {} }
          console.info('[Midnight Rules] 闲置超时，已重置为干净访客局。');
        } catch (e) {
          console.warn('[Midnight Rules] 闲置重置失败，直接重载：', e);
          try { location.reload(); } catch (e2) {}
        } finally {
          if (notice) notice.classList.remove('on');
          idleResetting = false;
          armIdleTimer();
        }
      }, 900);
    }

    function armIdleTimer() {
      if (!isGuestMode) return;   // 评审模式不自动重置
      clearTimeout(idleTimer);
      idleTimer = setTimeout(performIdleReset, IDLE_RESET_MS);
    }

    if (isGuestMode) {
      ['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(ev => {
        document.addEventListener(ev, () => {
          if (!idleResetting) armIdleTimer();
        }, { passive: true });
      });
      armIdleTimer();
    }

    if (btnEnter) {
      btnEnter.addEventListener('click', () => {
        preloadCriticalAssets();
        try { GhostBrideBGM.start(); } catch (e) {}
        // ?demo=closure / ?demo=product：扫码直达演示
        // 展板评委只有几十秒，直达比让他自己找 🤖 更可能看完闭环
        if (AUTO_DEMO) {
          setTimeout(() => {
            try {
              agentOpen();
              if (AUTO_DEMO === 'product') runProductDemo();
              else runAgentClosureDemo();
            } catch (e) {
              console.warn('[Midnight Rules] 自动演示启动失败：', e);
            }
          }, 2600);   // 等章节卡与第一屏字幕落定，别打断开场
        }
      });
    }

    // 初始化：从站台开始，故事有始有终
    function bootGameSafely() {
      try {
        if (isGuestMode) {
          startFreshGuestRun('boot');
        }
        recomputeSanityMax();
        sanity = sanityMax;
        updateSanityUI();
        resetRunRandom();
        renderInventory();
        showScene('prologue_platform');
      } catch (e) {
        console.error('[Midnight Rules] 初始化失败，已回退到干净访客局：', e);
        try {
          startFreshGuestRun('boot_fail');
          recomputeSanityMax();
          sanity = sanityMax;
          updateSanityUI();
          renderInventory();
          showScene('prologue_platform');
        } catch (e2) {
          console.error('[Midnight Rules] 回退仍失败，保留欢迎界面：', e2);
        }
      }
    }
    bootGameSafely();
  })();
  </script>
</div>
