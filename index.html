  <script>
  (function(){
    // ==========================================
    // 0. 运行模式：访客（默认）/ 评审 / 展板 kiosk
    //
    //    ?review=1  ?mode=review      → 评审模式（Trace / Demo / 技能条全开）
    //    ?kiosk=1   ?mode=kiosk        → 展板模式（访客 + 隐藏开发者痕迹 + 闲置自动重置）
    //    ?guest=1   ?mode=guest  无参数 → 访客模式（免登录、不写真实存档）
    //    ?demo=closure                 → 进场后自动打开 Agent 并停在闭环批准 UI
    //    ?idle=<秒>                    → 覆盖闲置自动重置时长（展板现场调节，默认 180s）
    //
    //    注：此前只显式解析 review 系，其余一切地址都 fallthrough 到 guest。
    //    访客体验因此是真的，但文档里写的 ?guest=1 / ?kiosk=1 字面并不成立
    //    （评委照文档核验会露）。现在三者都真正解析，代码与文档对齐。
    // ==========================================
    const RUN_FLAGS = (function () {
      const out = { mode: 'guest', autoDemo: '', idleSec: 180 };
      try {
        const params = new URLSearchParams(location.search || '');
        const mode = String(params.get('mode') || '').toLowerCase();
        // 注意：缺省参数是 null，`?kiosk`（无值）才是 ''，所以把 '' 也算真
        const truthy = (v) => v === '1' || v === 'true' || v === 'yes' || v === '';

        if (mode === 'review' || mode === 'reviewer' || truthy(params.get('review'))) {
          out.mode = 'review';
        } else if (mode === 'kiosk' || mode === 'booth' || truthy(params.get('kiosk'))) {
          out.mode = 'kiosk';
        } else if (mode === 'guest' || mode === 'visitor' || truthy(params.get('guest'))) {
          out.mode = 'guest';
        }

        const demo = String(params.get('demo') || '').toLowerCase();
        if (demo === 'closure' || demo === 'agent' || demo === '1') {
          out.autoDemo = 'closure';
        } else if (demo === 'product' || demo === 'tour') {
          out.autoDemo = 'product';
        }

        // 闲置回收时长：展板现场可能想调更短（人流快）或更长（评委细看）
        const idle = Number(params.get('idle'));
        if (Number.isFinite(idle) && idle >= 10 && idle <= 3600) {
          out.idleSec = idle;
        }
      } catch (e) {}
      return out;
    })();

    const RUN_MODE = RUN_FLAGS.mode;
    // kiosk 是访客模式的一种（同样免登录、同样不落盘），额外加了展板专用行为
    const isKioskMode = RUN_MODE === 'kiosk';
    const isGuestMode = RUN_MODE === 'guest' || isKioskMode;
    const isReviewMode = RUN_MODE === 'review';
    const AUTO_DEMO = RUN_FLAGS.autoDemo;
    function isVisitorFacing() {
      try {
        return isGuestMode && !document.body.classList.contains('review-mode');
      } catch (e) {
        return isGuestMode;
      }
    }
    function isPhoneLayout() {
      try { return window.innerWidth <= 768; } catch (e) { return false; }
    }
    try {
      document.body.classList.toggle('visitor-mode', isGuestMode);
      document.documentElement.classList.toggle('visitor-mode', isGuestMode);
      document.body.classList.toggle('kiosk-mode', isKioskMode);
      document.documentElement.classList.toggle('kiosk-mode', isKioskMode);
    } catch (e) {}

    // ==========================================
    // 1. Web Audio API 轨道环境音合成器
    // ==========================================
    class MidnightSynth {
        constructor() {
            this.ctx = null;
            this.baseHum = [];
            this.baseHumGain = null;
            this.isPlaying = false;
            this.screechTimer = null;
            this.clickTimer = null;
            this.bellTimer = null;
            this.heartbeatTimer = null;
            this.heartbeatRate = 1500; // 动态心跳率 (单位: 毫秒)
            this.activeOscillators = [];
            this.windNode = null;
            this.windLfo = null;
            // 中式丧乐层
            this.funeralNodes = [];
            this.funeralMaster = null;
            this.atmosphere = 0.4; // 0~1 紧张度
            this.woodfishTimer = null;
            this.suonaTimer = null;
            this.gongTimer = null;
            this.wailTimer = null;
            this.brideDrumTimer = null;
            this.ghostBrideMode = false;
            // 中国五声音阶（偏低沉的羽调式，偏哀）——「鬼新娘」迎亲哀调
            // A2 羽 · C3 宫 · D3 商 · E3 角 · G3 徵 · A3 羽
            this.pentatonic = [110.00, 130.81, 146.83, 164.81, 196.00, 220.00, 261.63, 293.66];
        }

        init() {
            if (this.ctx) return;
            try {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.master = this.ctx.createGain();
                this.master.gain.setValueAtTime(0.9, this.ctx.currentTime);
                this.reverbWet = this.ctx.createGain();
                this.reverbWet.gain.setValueAtTime(0.08, this.ctx.currentTime);
                this.master.connect(this.ctx.destination);
                try {
                  const ir = this.ctx.createBuffer(2, this.ctx.sampleRate * 1.2, this.ctx.sampleRate);
                  for (let c = 0; c < 2; c++) {
                    const d = ir.getChannelData(c);
                    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.2);
                  }
                  this.convolver = this.ctx.createConvolver();
                  this.convolver.buffer = ir;
                  this.master.connect(this.convolver);
                  this.convolver.connect(this.reverbWet);
                  this.reverbWet.connect(this.ctx.destination);
                } catch (e) {}
            } catch (e) {
                console.warn("当前浏览器不支持 Web Audio API", e);
            }
        }
        out() {
            if (!this.ctx) return null;
            if (!this.master) this.init();
            return this.master || this.ctx.destination;
        }
        setReverb(wet) {
            if (!this.reverbWet || !this.ctx) return;
            const now = this.ctx.currentTime;
            try {
              this.reverbWet.gain.cancelScheduledValues(now);
              this.reverbWet.gain.linearRampToValueAtTime(Math.max(0, Math.min(0.45, wet)), now + 0.4);
            } catch (e) {}
        }

        start() {
            this.init();
            if (!this.ctx) return;
            if (this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
            try { if (this.master) this.master.gain.setValueAtTime(0.9, this.ctx.currentTime); } catch (e) {}
            if (this.isPlaying) return;

            // 1. 基准电机低鸣声（列车）
            const osc1 = this.ctx.createOscillator();
            const osc2 = this.ctx.createOscillator();
            const osc3 = this.ctx.createOscillator();
            const humGain = this.ctx.createGain();

            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(55, this.ctx.currentTime);
            osc2.type = 'sawtooth';
            osc2.frequency.setValueAtTime(77.78, this.ctx.currentTime);
            osc3.type = 'sine';
            osc3.frequency.setValueAtTime(38.89, this.ctx.currentTime);

            const filter = this.ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(65, this.ctx.currentTime);
            humGain.gain.setValueAtTime(0.04, this.ctx.currentTime);

            osc1.connect(filter);
            osc2.connect(filter);
            osc3.connect(filter);
            filter.connect(humGain);
            humGain.connect(this.out());

            osc1.start();
            osc2.start();
            osc3.start();

            const lfo = this.ctx.createOscillator();
            const lfoGain = this.ctx.createGain();
            lfo.frequency.setValueAtTime(0.4, this.ctx.currentTime);
            lfoGain.gain.setValueAtTime(0.008, this.ctx.currentTime);
            lfo.connect(lfoGain);
            lfoGain.connect(humGain.gain);
            lfo.start();

            this.baseHum = [osc1, osc2, osc3, lfo];
            this.baseHumGain = humGain;

            // 2. 恐怖幽灵冷风合成
            try {
                const bufferSize = this.ctx.sampleRate * 2;
                const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = noiseBuffer;
                noise.loop = true;

                const windFilter = this.ctx.createBiquadFilter();
                windFilter.type = 'bandpass';
                windFilter.Q.setValueAtTime(3.5, this.ctx.currentTime);

                const windLfo = this.ctx.createOscillator();
                windLfo.frequency.setValueAtTime(0.06, this.ctx.currentTime);
                const windLfoGain = this.ctx.createGain();
                windLfoGain.gain.setValueAtTime(200, this.ctx.currentTime);

                windFilter.frequency.setValueAtTime(380, this.ctx.currentTime);

                windLfo.connect(windLfoGain);
                windLfoGain.connect(windFilter.frequency);

                const windGain = this.ctx.createGain();
                windGain.gain.setValueAtTime(0.006, this.ctx.currentTime);

                noise.connect(windFilter);
                windFilter.connect(windGain);
                windGain.connect(this.out());

                noise.start();
                windLfo.start();

                this.windNode = noise;
                this.windLfo = windLfo;
            } catch(e) {
                console.warn("Wind synth failed", e);
            }

            // 3. 中式丧乐持续层：低沉宫商羽 drone + 木鱼/唢呐/锣
            this.startFuneralLayer();

            this.isPlaying = true;

            this.scheduleClickClack();
            this.scheduleScreech();
            this.scheduleBell();
            this.scheduleHeartbeat();
            this.scheduleWoodfish();
            this.scheduleSuonaPhrase();
            this.scheduleGong();
            this.scheduleWail();
            // 同步启动哀乐层 BGM（合成的红白喜事调，无音频文件）
            try { if (typeof GhostBrideBGM !== 'undefined') GhostBrideBGM.start(); } catch (e) {}
        }

        // —— 中式丧乐：持续低吟 drone ——
        startFuneralLayer() {
            if (!this.ctx) return;
            const master = this.ctx.createGain();
            master.gain.setValueAtTime(0.0, this.ctx.currentTime);
            master.gain.linearRampToValueAtTime(0.045, this.ctx.currentTime + 2.5);
            master.connect(this.out());
            this.funeralMaster = master;

            // 羽调式三音持续：A2 / E3 / C3（空灵哀沉）
            const drones = [
                { f: 55.00, type: 'sine', g: 0.55 },     // 低八度
                { f: 110.00, type: 'triangle', g: 0.35 }, // 羽
                { f: 164.81, type: 'sine', g: 0.18 },     // 角
                { f: 130.81, type: 'sine', g: 0.12 }      // 宫（微弱）
            ];
            drones.forEach(d => {
                const osc = this.ctx.createOscillator();
                const g = this.ctx.createGain();
                const f = this.ctx.createBiquadFilter();
                osc.type = d.type;
                osc.frequency.setValueAtTime(d.f, this.ctx.currentTime);
                // 轻微失准，像老旧唢呐/唢呐伴奏走音
                const detune = this.ctx.createOscillator();
                const dg = this.ctx.createGain();
                detune.frequency.setValueAtTime(0.05 + Math.random() * 0.08, this.ctx.currentTime);
                dg.gain.setValueAtTime(d.f * 0.004, this.ctx.currentTime);
                detune.connect(dg);
                dg.connect(osc.frequency);
                f.type = 'lowpass';
                f.frequency.setValueAtTime(420, this.ctx.currentTime);
                g.gain.setValueAtTime(d.g, this.ctx.currentTime);
                osc.connect(f);
                f.connect(g);
                g.connect(master);
                osc.start();
                detune.start();
                this.funeralNodes.push(osc, detune, g, f);
            });
        }

        // 紧张度：抬高丧乐音量、加快木鱼、唢呐更密
        setAtmosphere(level) {
            this.atmosphere = Math.max(0, Math.min(1, level));
            if (!this.funeralMaster || !this.ctx) return;
            const now = this.ctx.currentTime;
            // 配乐全合成，无外部成曲要避让，所以丧乐层直接随紧张度升高
            const gbBoost = this.ghostBrideMode ? 1.25 : 1;
            const vol = (0.028 + this.atmosphere * 0.07) * gbBoost;
            try {
                this.funeralMaster.gain.cancelScheduledValues(now);
                this.funeralMaster.gain.linearRampToValueAtTime(vol, now + 0.8);
            } catch (e) {}
            if (this.baseHumGain) {
                try {
                    this.baseHumGain.gain.cancelScheduledValues(now);
                    this.baseHumGain.gain.linearRampToValueAtTime(0.03 + this.atmosphere * 0.04, now + 0.6);
                } catch (e) {}
            }
        }

        // 「鬼新娘」模式：红喜事鼓点 + 白喜事哀调（无外部音频时的兜底 BGM 风格）
        setGhostBrideMode(on) {
            this.ghostBrideMode = !!on;
            if (!this.isPlaying) return;
            clearTimeout(this.brideDrumTimer);
            if (on) {
                this.scheduleBrideDrum();
                // 立刻来一句「迎亲」式唢呐哀句
                setTimeout(() => { try { this.playSuonaPhrase(); } catch (e) {} }, 400);
            }
        }

        scheduleBrideDrum() {
            if (!this.isPlaying || !this.ghostBrideMode) return;
            // 喜堂鼓点却节奏发虚、越来越慢——像一场走错的婚礼
            const gap = 520 + (1 - this.atmosphere) * 280 + Math.random() * 120;
            this.brideDrumTimer = setTimeout(() => {
                this.playBrideDrum();
                this.scheduleBrideDrum();
            }, gap);
        }

        playBrideDrum() {
            if (!this.ctx || this.ctx.state === 'suspended') return;
            const now = this.ctx.currentTime;
            // 两下鼓：咚 · 咚（喜事），但混进闷锣
            [0, 0.18].forEach((off, i) => {
                try {
                    const osc = this.ctx.createOscillator();
                    const g = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(i === 0 ? 95 : 72, now + off);
                    osc.frequency.exponentialRampToValueAtTime(28, now + off + 0.18);
                    g.gain.setValueAtTime(0.0001, now + off);
                    g.gain.linearRampToValueAtTime(0.04 + this.atmosphere * 0.03, now + off + 0.01);
                    g.gain.exponentialRampToValueAtTime(0.0001, now + off + 0.22);
                    osc.connect(g);
                    g.connect(this.ctx.destination);
                    this.activeOscillators.push(osc);
                    osc.start(now + off);
                    osc.stop(now + off + 0.25);
                } catch (e) {}
            });
            if (Math.random() < 0.35 + this.atmosphere * 0.3) {
                // 偶尔一声「喜铃」走音
                try {
                    const bell = this.ctx.createOscillator();
                    const bg = this.ctx.createGain();
                    bell.type = 'sine';
                    bell.frequency.setValueAtTime(880 + Math.random() * 40, now + 0.35);
                    bell.frequency.linearRampToValueAtTime(620, now + 1.2);
                    bg.gain.setValueAtTime(0.0001, now + 0.35);
                    bg.gain.linearRampToValueAtTime(0.018, now + 0.4);
                    bg.gain.exponentialRampToValueAtTime(0.0001, now + 1.4);
                    bell.connect(bg);
                    bg.connect(this.ctx.destination);
                    this.activeOscillators.push(bell);
                    bell.start(now + 0.35);
                    bell.stop(now + 1.45);
                } catch (e) {}
            }
        }

        // 木鱼：丧仪里不规则叩击
        scheduleWoodfish() {
            if (!this.isPlaying) return;
            const gap = (1400 - this.atmosphere * 700) + Math.random() * (900 - this.atmosphere * 400);
            this.woodfishTimer = setTimeout(() => {
                this.playWoodfish();
                this.scheduleWoodfish();
            }, Math.max(420, gap));
        }

        playWoodfish() {
            if (!this.ctx || this.ctx.state === 'suspended') return;
            const now = this.ctx.currentTime;
            try {
                const osc = this.ctx.createOscillator();
                const g = this.ctx.createGain();
                const f = this.ctx.createBiquadFilter();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(780 + Math.random() * 120, now);
                osc.frequency.exponentialRampToValueAtTime(180, now + 0.08);
                f.type = 'bandpass';
                f.frequency.setValueAtTime(900, now);
                f.Q.setValueAtTime(6, now);
                const vol = 0.012 + this.atmosphere * 0.018;
                g.gain.setValueAtTime(vol, now);
                g.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
                osc.connect(f);
                f.connect(g);
                g.connect(this.ctx.destination);
                this.activeOscillators.push(osc);
                osc.start(now);
                osc.stop(now + 0.14);
                // 偶发双击（更像仪式节奏）
                if (Math.random() < 0.35 + this.atmosphere * 0.2) {
                    const osc2 = this.ctx.createOscillator();
                    const g2 = this.ctx.createGain();
                    osc2.type = 'triangle';
                    osc2.frequency.setValueAtTime(720, now + 0.14);
                    osc2.frequency.exponentialRampToValueAtTime(160, now + 0.22);
                    g2.gain.setValueAtTime(vol * 0.75, now + 0.14);
                    g2.gain.exponentialRampToValueAtTime(0.0001, now + 0.26);
                    osc2.connect(g2);
                    g2.connect(this.ctx.destination);
                    this.activeOscillators.push(osc2);
                    osc2.start(now + 0.14);
                    osc2.stop(now + 0.28);
                }
            } catch (e) {}
        }

        // 唢呐式哀句：鼻音锯齿 + 滑音，走五声
        scheduleSuonaPhrase() {
            if (!this.isPlaying) return;
            const gap = (9000 - this.atmosphere * 4500) + Math.random() * 6000;
            this.suonaTimer = setTimeout(() => {
                this.playSuonaPhrase();
                this.scheduleSuonaPhrase();
            }, Math.max(3500, gap));
        }

        playSuonaPhrase() {
            if (!this.ctx || this.ctx.state === 'suspended') return;
            const now = this.ctx.currentTime;
            // 丧乐短句：下行哀音
            const scale = this.pentatonic;
            const startIdx = 3 + Math.floor(Math.random() * 3);
            const notes = [
                scale[startIdx],
                scale[Math.max(0, startIdx - 1)],
                scale[Math.max(0, startIdx - 2)],
                scale[Math.max(0, startIdx - 3)],
                scale[Math.max(0, startIdx - 2)] * 0.98
            ];
            const baseVol = 0.008 + this.atmosphere * 0.016;
            notes.forEach((freq, i) => {
                const t = now + i * (0.42 + Math.random() * 0.12);
                try {
                    const osc = this.ctx.createOscillator();
                    const osc2 = this.ctx.createOscillator();
                    const g = this.ctx.createGain();
                    const bp = this.ctx.createBiquadFilter();
                    // 唢呐：锯齿 + 五度泛音，带共振
                    osc.type = 'sawtooth';
                    osc2.type = 'square';
                    osc.frequency.setValueAtTime(freq, t);
                    osc2.frequency.setValueAtTime(freq * 2.01, t);
                    // 哭腔滑音
                    osc.frequency.linearRampToValueAtTime(freq * (0.96 + Math.random() * 0.03), t + 0.38);
                    bp.type = 'bandpass';
                    bp.frequency.setValueAtTime(freq * 2.2, t);
                    bp.Q.setValueAtTime(8 + this.atmosphere * 6, t);
                    g.gain.setValueAtTime(0.0001, t);
                    g.gain.linearRampToValueAtTime(baseVol, t + 0.08);
                    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
                    osc.connect(bp);
                    osc2.connect(bp);
                    bp.connect(g);
                    g.connect(this.ctx.destination);
                    this.activeOscillators.push(osc, osc2);
                    osc.start(t);
                    osc2.start(t);
                    osc.stop(t + 0.6);
                    osc2.stop(t + 0.6);
                } catch (e) {}
            });
        }

        // 铜锣：远处一声闷响
        scheduleGong() {
            if (!this.isPlaying) return;
            const gap = 14000 + Math.random() * 12000 - this.atmosphere * 4000;
            this.gongTimer = setTimeout(() => {
                this.playGong();
                this.scheduleGong();
            }, Math.max(7000, gap));
        }

        playGong() {
            if (!this.ctx || this.ctx.state === 'suspended') return;
            const now = this.ctx.currentTime;
            const fundamentals = [98, 147, 196, 246];
            const vol = 0.03 + this.atmosphere * 0.04;
            fundamentals.forEach((f, i) => {
                try {
                    const osc = this.ctx.createOscillator();
                    const g = this.ctx.createGain();
                    osc.type = i % 2 === 0 ? 'sine' : 'triangle';
                    osc.frequency.setValueAtTime(f * (1 + Math.random() * 0.01), now);
                    osc.frequency.linearRampToValueAtTime(f * 0.97, now + 3.5);
                    g.gain.setValueAtTime(0.0001, now);
                    g.gain.linearRampToValueAtTime(vol / (i + 1.5), now + 0.02);
                    g.gain.exponentialRampToValueAtTime(0.0001, now + 4.2);
                    osc.connect(g);
                    g.connect(this.ctx.destination);
                    this.activeOscillators.push(osc);
                    osc.start(now);
                    osc.stop(now + 4.3);
                } catch (e) {}
            });
        }

        // 远处哭腔 / 呜咽（噪声成形）
        scheduleWail() {
            if (!this.isPlaying) return;
            const gap = 16000 + Math.random() * 14000 - this.atmosphere * 5000;
            this.wailTimer = setTimeout(() => {
                if (this.atmosphere > 0.35) this.playWail();
                this.scheduleWail();
            }, Math.max(8000, gap));
        }

        playWail() {
            if (!this.ctx || this.ctx.state === 'suspended') return;
            const now = this.ctx.currentTime;
            const dur = 2.2 + Math.random() * 1.8;
            try {
                const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * dur, this.ctx.sampleRate);
                const d = buf.getChannelData(0);
                for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
                const src = this.ctx.createBufferSource();
                src.buffer = buf;
                const bp = this.ctx.createBiquadFilter();
                bp.type = 'bandpass';
                bp.Q.setValueAtTime(10, now);
                const f0 = 480 + Math.random() * 220;
                bp.frequency.setValueAtTime(f0, now);
                bp.frequency.linearRampToValueAtTime(f0 * 1.35, now + dur * 0.5);
                bp.frequency.linearRampToValueAtTime(f0 * 0.85, now + dur);
                const g = this.ctx.createGain();
                const vol = 0.01 + this.atmosphere * 0.02;
                g.gain.setValueAtTime(0.0001, now);
                g.gain.linearRampToValueAtTime(vol, now + 0.4);
                g.gain.linearRampToValueAtTime(vol * 0.6, now + dur * 0.7);
                g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
                src.connect(bp);
                bp.connect(g);
                g.connect(this.ctx.destination);
                src.start(now);
                src.stop(now + dur);
            } catch (e) {}
        }

        stop() {
            if (!this.isPlaying) return;
            if (this.master && this.ctx) {
                try {
                  const now = this.ctx.currentTime;
                  this.master.gain.cancelScheduledValues(now);
                  this.master.gain.linearRampToValueAtTime(0.0001, now + 0.15);
                } catch (e) {}
            }
            const halt = () => {
            if (this.baseHum.length) {
                this.baseHum.forEach(osc => { try { osc.stop(); } catch(e){} });
                this.baseHum = [];
            }
            if (this.windNode) {
                try { this.windNode.stop(); } catch(e){}
                this.windNode = null;
            }
            if (this.windLfo) {
                try { this.windLfo.stop(); } catch(e){}
                this.windLfo = null;
            }
            if (this.funeralNodes.length) {
                this.funeralNodes.forEach(n => { try { if (n.stop) n.stop(); } catch(e){} });
                this.funeralNodes = [];
            }
            if (this.funeralMaster) {
                try { this.funeralMaster.disconnect(); } catch(e){}
                this.funeralMaster = null;
            }
            if (this.activeOscillators.length) {
                this.activeOscillators.forEach(osc => { try { osc.stop(); } catch(e){} });
                this.activeOscillators = [];
            }
            clearTimeout(this.screechTimer);
            clearTimeout(this.clickTimer);
            clearTimeout(this.bellTimer);
            clearTimeout(this.heartbeatTimer);
            clearTimeout(this.woodfishTimer);
            clearTimeout(this.suonaTimer);
            clearTimeout(this.gongTimer);
            clearTimeout(this.wailTimer);
            clearTimeout(this.brideDrumTimer);
            this.ghostBrideMode = false;
            this.isPlaying = false;
            try { if (typeof GhostBrideBGM !== 'undefined') GhostBrideBGM.stop(); } catch (e) {}
            try { if (this.master && this.ctx) this.master.gain.setValueAtTime(0.9, this.ctx.currentTime + 0.02); } catch (e) {}
            };
            setTimeout(halt, 160);
        }

        playUiClick(danger) {
            this.init();
            if (!this.ctx) return;
            try {
              const now = this.ctx.currentTime;
              const o = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              o.type = danger ? 'square' : 'triangle';
              o.frequency.setValueAtTime(danger ? 180 : 520, now);
              o.frequency.exponentialRampToValueAtTime(danger ? 90 : 240, now + 0.08);
              g.gain.setValueAtTime(danger ? 0.04 : 0.025, now);
              g.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
              o.connect(g);
              g.connect(this.out());
              o.start(now);
              o.stop(now + 0.13);
            } catch (e) {}
        }

        playPA() {
            this.init();
            if (!this.ctx) return;
            try {
              const now = this.ctx.currentTime;
              const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 1.4, this.ctx.sampleRate);
              const d = buf.getChannelData(0);
              for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (i < 2000 ? i / 2000 : 1);
              const src = this.ctx.createBufferSource();
              src.buffer = buf;
              const bp = this.ctx.createBiquadFilter();
              bp.type = 'bandpass';
              bp.frequency.setValueAtTime(1800, now);
              bp.Q.setValueAtTime(6, now);
              const dist = this.ctx.createWaveShaper();
              const curve = new Float32Array(256);
              for (let i = 0; i < 256; i++) { const x = i / 128 - 1; curve[i] = Math.tanh(x * 2.2); }
              dist.curve = curve;
              const g = this.ctx.createGain();
              g.gain.setValueAtTime(0.0001, now);
              g.gain.linearRampToValueAtTime(0.045, now + 0.08);
              g.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);
              src.connect(bp); bp.connect(dist); dist.connect(g); g.connect(this.out());
              src.start(now); src.stop(now + 1.3);
            } catch (e) {}
        }

        scheduleClickClack() {
            if (!this.isPlaying) return;
            this.clickTimer = setTimeout(() => {
                this.playClickClackSound();
                this.scheduleClickClack();
            }, 2500 + Math.random() * 2000);
        }

        playClickClackSound() {
            if (!this.ctx || this.ctx.state === 'suspended') return;
            const now = this.ctx.currentTime;
            this.triggerClick(now, 0.03);
            this.triggerClick(now + 0.12, 0.02);
            this.triggerClick(now + 0.35, 0.02);
        }

        triggerClick(time, volume) {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(60, time);
            osc.frequency.exponentialRampToValueAtTime(10, time + 0.06);
            gain.gain.setValueAtTime(volume, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.06);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            this.activeOscillators.push(osc);
            osc.start(time);
            osc.stop(time + 0.07);
        }

        scheduleScreech() {
            if (!this.isPlaying) return;
            this.screechTimer = setTimeout(() => {
                this.playScreechSound();
                this.scheduleScreech();
            }, 16000 + Math.random() * 12000);
        }

        playScreechSound() {
            if (!this.ctx || this.ctx.state === 'suspended') return;
            const now = this.ctx.currentTime;
            const duration = 1.2 + Math.random() * 1.0;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const filter = this.ctx.createBiquadFilter();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(880, now);
            osc.frequency.linearRampToValueAtTime(520, now + duration);
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(700, now);
            filter.Q.setValueAtTime(5, now);

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(this.ctx.destination);
            this.activeOscillators.push(osc);
            osc.start(now);
            osc.stop(now + duration);
        }

        scheduleBell() {
            if (!this.isPlaying) return;
            this.bellTimer = setTimeout(() => {
                this.playHauntingBell();
                this.scheduleBell();
            }, 8000 + Math.random() * 8000);
        }

        playHauntingBell() {
            if (!this.ctx || this.ctx.state === 'suspended') return;
            const now = this.ctx.currentTime;
            const freq = 110 + Math.random() * 60;

            const osc1 = this.ctx.createOscillator();
            const osc2 = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(freq, now);
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(freq * 1.618, now);

            gain.gain.setValueAtTime(0.0, now);
            gain.gain.linearRampToValueAtTime(0.015, now + 0.15);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 6.0);

            const filter = this.ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(350, now);

            osc1.connect(filter);
            osc2.connect(filter);
            filter.connect(gain);
            gain.connect(this.ctx.destination);

            this.activeOscillators.push(osc1, osc2);
            osc1.start(now);
            osc2.start(now);
            osc1.stop(now + 6.1);
            osc2.stop(now + 6.1);
        }

        scheduleHeartbeat() {
            if (!this.isPlaying) return;
            this.heartbeatTimer = setTimeout(() => {
                this.playHeartbeat();
                this.scheduleHeartbeat();
            }, this.heartbeatRate);
        }

        playHeartbeat() {
            if (!this.ctx || this.ctx.state === 'suspended') return;
            const now = this.ctx.currentTime;

            const playPulse = (delay, volume) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(45, now + delay);
                osc.frequency.exponentialRampToValueAtTime(25, now + delay + 0.25);

                gain.gain.setValueAtTime(0.0, now + delay);
                gain.gain.linearRampToValueAtTime(volume, now + delay + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + delay + 0.25);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                this.activeOscillators.push(osc);
                osc.start(now + delay);
                osc.stop(now + delay + 0.26);
            };

            playPulse(0, 0.07);
            playPulse(0.24, 0.05);
        }

        // 贴耳低语合成
        playWhisper() {
            if (!this.ctx || this.ctx.state === 'suspended') return;
            const now = this.ctx.currentTime;
            try {
                const dur = 1.4;
                const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * dur, this.ctx.sampleRate);
                const d = buf.getChannelData(0);
                for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
                const src = this.ctx.createBufferSource();
                src.buffer = buf;

                const bp = this.ctx.createBiquadFilter();
                bp.type = 'bandpass';
                bp.Q.setValueAtTime(8, now);
                bp.frequency.setValueAtTime(600 + Math.random() * 600, now);
                bp.frequency.linearRampToValueAtTime(1400 + Math.random() * 800, now + dur);

                const g = this.ctx.createGain();
                g.gain.setValueAtTime(0, now);
                [0, 0.35, 0.8].forEach((t) => {
                    g.gain.linearRampToValueAtTime(0.02 + Math.random() * 0.015, now + t + 0.1);
                    g.gain.exponentialRampToValueAtTime(0.001, now + t + 0.3);
                });

                let pan = null;
                if (this.ctx.createStereoPanner) {
                    pan = this.ctx.createStereoPanner();
                    pan.pan.setValueAtTime(Math.random() * 1.6 - 0.8, now);
                }

                src.connect(bp);
                bp.connect(g);
                if (pan) {
                    g.connect(pan);
                    pan.connect(this.ctx.destination);
                } else {
                    g.connect(this.ctx.destination);
                }
                src.start(now);
                src.stop(now + dur);
            } catch (e) {}
        }

        // 📻 对讲机雪花噪声 (新增)
        playStatic(dur) {
            if (!this.ctx || this.ctx.state === 'suspended') return;
            dur = dur || 1.6;
            const now = this.ctx.currentTime;
            try {
                const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * dur, this.ctx.sampleRate);
                const d = buf.getChannelData(0);
                for (let i = 0; i < d.length; i++) {
                    d[i] = (Math.random() * 2 - 1) * (Math.random() < 0.08 ? 1 : 0.25);
                }
                const src = this.ctx.createBufferSource();
                src.buffer = buf;
                const bp = this.ctx.createBiquadFilter();
                bp.type = 'bandpass';
                bp.Q.setValueAtTime(1.2, now);
                bp.frequency.setValueAtTime(900, now);
                bp.frequency.linearRampToValueAtTime(1800, now + dur);
                const g = this.ctx.createGain();
                g.gain.setValueAtTime(0.045, now);
                g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
                src.connect(bp);
                bp.connect(g);
                g.connect(this.ctx.destination);
                src.start(now);
                src.stop(now + dur);
            } catch (e) {}
        }

        // 🆕 打字机笔画音（极轻，毛笔沙沙感）
        playTick() {
            if (!this.ctx || this.ctx.state === 'suspended') return;
            const now = this.ctx.currentTime;
            try {
                const osc = this.ctx.createOscillator();
                const g = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(1800 + Math.random() * 600, now);
                g.gain.setValueAtTime(0.004, now);
                g.gain.exponentialRampToValueAtTime(0.0001, now + 0.03);
                osc.connect(g);
                g.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.035);
            } catch (e) {}
        }

        playScream(now) {
            const freqs = [780, 810, 850, 920, 1150, 1200, 1310];
            const vibratoFreq = 22;

            freqs.forEach((f) => {
                const osc = this.ctx.createOscillator();
                const oscGain = this.ctx.createGain();
                const vib = this.ctx.createOscillator();
                const vibGain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(f, now);
                osc.frequency.exponentialRampToValueAtTime(f * 0.65, now + 1.5);

                vib.type = 'sine';
                vib.frequency.setValueAtTime(vibratoFreq, now);
                vibGain.gain.setValueAtTime(f * 0.08, now);

                vib.connect(vibGain);
                vibGain.connect(osc.frequency);

                oscGain.gain.setValueAtTime(0, now);
                oscGain.gain.linearRampToValueAtTime(0.04, now + 0.05);
                oscGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.8);

                osc.connect(oscGain);
                oscGain.connect(this.ctx.destination);

                this.activeOscillators.push(osc, vib);
                osc.start(now);
                vib.start(now);
                osc.stop(now + 1.9);
                vib.stop(now + 1.9);
            });

            try {
                const bufferSize = this.ctx.sampleRate * 1.5;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noiseNode = this.ctx.createBufferSource();
                noiseNode.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(1200, now);
                filter.frequency.exponentialRampToValueAtTime(600, now + 1.5);
                filter.Q.setValueAtTime(2.0, now);

                const noiseGain = this.ctx.createGain();
                noiseGain.gain.setValueAtTime(0, now);
                noiseGain.gain.linearRampToValueAtTime(0.06, now + 0.05);
                noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.5);

                noiseNode.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(this.ctx.destination);

                noiseNode.start(now);
                noiseNode.stop(now + 1.6);
            } catch (e) {}
        }

        playDeathSound(deathType) {
            this.stop();
            this.init();
            if (!this.ctx) return;
            if (this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
            this.isPlaying = true;
            const now = this.ctx.currentTime;

            this.playScream(now);

            if (deathType === 'death_red') {
                const freqs = [1500, 1800, 2200, 2600];
                freqs.forEach((f) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(f, now);

                    const lfo = this.ctx.createOscillator();
                    const lfoGain = this.ctx.createGain();
                    lfo.frequency.setValueAtTime(15, now);
                    lfoGain.gain.setValueAtTime(0.005, now);

                    gain.gain.setValueAtTime(0.0, now);
                    gain.gain.linearRampToValueAtTime(0.02, now + 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 4.0);

                    lfo.connect(lfoGain);
                    lfoGain.connect(gain.gain);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    this.activeOscillators.push(osc, lfo);
                    osc.start(now);
                    lfo.start(now);
                    osc.stop(now + 4.1);
                    lfo.stop(now + 4.1);
                });
            } else if (deathType === 'death_seller' || deathType === 'death_seller_face') {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(30, now + 3.0);

                const bufferSize = this.ctx.sampleRate * 3;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() > 0.985 ? (Math.random() * 2 - 1) * 0.4 : 0;
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const noiseGain = this.ctx.createGain();
                noiseGain.gain.setValueAtTime(0.03, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 3.0);

                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 3.0);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                noise.connect(noiseGain);
                noiseGain.connect(this.ctx.destination);

                this.activeOscillators.push(osc);
                osc.start(now);
                osc.stop(now + 3.1);
                noise.start(now);
                noise.stop(now + 3.1);
            } else if (deathType === 'death_window') {
                const bufferSize = this.ctx.sampleRate * 0.5;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.setValueAtTime(3200, now);

                const noiseGain = this.ctx.createGain();
                noiseGain.gain.setValueAtTime(0.12, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);

                noise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(this.ctx.destination);

                const rumble = this.ctx.createOscillator();
                const rumbleGain = this.ctx.createGain();
                rumble.type = 'triangle';
                rumble.frequency.setValueAtTime(80, now);
                rumble.frequency.linearRampToValueAtTime(35, now + 2.5);

                rumbleGain.gain.setValueAtTime(0.15, now);
                rumbleGain.gain.exponentialRampToValueAtTime(0.0001, now + 2.5);

                rumble.connect(rumbleGain);
                rumbleGain.connect(this.ctx.destination);

                this.activeOscillators.push(rumble);
                noise.start(now);
                noise.stop(now + 0.6);
                rumble.start(now);
                rumble.stop(now + 2.6);
            } else if (deathType === 'death_insanity') {
                const freqs = [220, 233, 311, 466];
                freqs.forEach((f) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(f, now);
                    osc.frequency.linearRampToValueAtTime(f * 0.5, now + 4.5);

                    gain.gain.setValueAtTime(0.0, now);
                    gain.gain.linearRampToValueAtTime(0.03, now + 0.8);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 5.0);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    this.activeOscillators.push(osc);
                    osc.start(now);
                    osc.stop(now + 5.1);
                });
            } else if (deathType === 'death_dark') {
                // 🆕 引火烧身：密集爬行声 + 低音压迫
                try {
                    const dur2 = 3.0;
                    const buf2 = this.ctx.createBuffer(1, this.ctx.sampleRate * dur2, this.ctx.sampleRate);
                    const dd = buf2.getChannelData(0);
                    for (let i = 0; i < dd.length; i++) {
                        dd[i] = (Math.random() * 2 - 1) * (Math.random() < 0.3 ? 0.7 : 0.08);
                    }
                    const src2 = this.ctx.createBufferSource();
                    src2.buffer = buf2;
                    const bp2 = this.ctx.createBiquadFilter();
                    bp2.type = 'highpass';
                    bp2.frequency.setValueAtTime(2000, now);
                    const g2 = this.ctx.createGain();
                    g2.gain.setValueAtTime(0.05, now);
                    g2.gain.exponentialRampToValueAtTime(0.0001, now + dur2);
                    src2.connect(bp2);
                    bp2.connect(g2);
                    g2.connect(this.ctx.destination);
                    src2.start(now);
                    src2.stop(now + dur2);
                } catch (e) {}
                const osc5 = this.ctx.createOscillator();
                const gain5 = this.ctx.createGain();
                osc5.type = 'sine';
                osc5.frequency.setValueAtTime(50, now);
                osc5.frequency.linearRampToValueAtTime(28, now + 3.0);
                gain5.gain.setValueAtTime(0.14, now);
                gain5.gain.exponentialRampToValueAtTime(0.0001, now + 3.0);
                osc5.connect(gain5);
                gain5.connect(this.ctx.destination);
                this.activeOscillators.push(osc5);
                osc5.start(now);
                osc5.stop(now + 3.1);
            } else {
                const freqs = [650, 780, 910, 1050];
                freqs.forEach((f) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';

                    const lfo = this.ctx.createOscillator();
                    const lfoGain = this.ctx.createGain();
                    lfo.frequency.setValueAtTime(30, now);
                    lfoGain.gain.setValueAtTime(50, now);

                    osc.frequency.setValueAtTime(f, now);
                    osc.frequency.exponentialRampToValueAtTime(f * 1.4, now + 0.35);

                    gain.gain.setValueAtTime(0.0, now);
                    gain.gain.linearRampToValueAtTime(0.05, now + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.5);

                    lfo.connect(lfoGain);
                    lfoGain.connect(osc.frequency);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    this.activeOscillators.push(osc, lfo);
                    osc.start(now);
                    lfo.start(now);
                    osc.stop(now + 2.6);
                    lfo.stop(now + 2.6);
                });
            }
        }

        playTrueWinBGM() {
            this.stop();
            this.init();
            if (!this.ctx) return;
            if (this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
            this.isPlaying = true;
            const now = this.ctx.currentTime;

            const notes = [
                { freq: 392.00, time: 0.0 },
                { freq: 493.88, time: 0.25 },
                { freq: 587.33, time: 0.5 },
                { freq: 783.99, time: 0.75 },

                { freq: 523.25, time: 1.5 },
                { freq: 659.25, time: 1.75 },
                { freq: 783.99, time: 2.0 },
                { freq: 1046.50, time: 2.25 },

                { freq: 587.33, time: 3.5 },
                { freq: 783.99, time: 3.75 },
                { freq: 880.00, time: 4.0 },
                { freq: 1174.66, time: 4.25 },

                { freq: 783.99, time: 5.5 }
            ];

            notes.forEach(n => {
                const osc1 = this.ctx.createOscillator();
                const osc2 = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(n.freq, now + n.time);
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(n.freq * 2.0, now + n.time);

                gain.gain.setValueAtTime(0.0, now + n.time);
                gain.gain.linearRampToValueAtTime(0.025, now + n.time + 0.15);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + n.time + 4.5);

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, now + n.time);

                osc1.connect(filter);
                osc2.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                this.activeOscillators.push(osc1, osc2);
                osc1.start(now + n.time);
                osc2.start(now + n.time);
                osc1.stop(now + n.time + 4.6);
                osc2.stop(now + n.time + 4.6);
            });

        playNormalWinBGM() {
            this.stop();
            this.init();
            if (!this.ctx) return;
            if (this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
            this.isPlaying = true;
            const now = this.ctx.currentTime;

            const notes = [
                { freq: 392.00, time: 0.0 },
                { freq: 493.88, time: 0.25 },
                { freq: 587.33, time: 0.5 },
                { freq: 783.99, time: 0.75 },

                { freq: 523.25, time: 1.5 },
                { freq: 659.25, time: 1.75 },
                { freq: 783.99, time: 2.0 },
                { freq: 1046.50, time: 2.25 },

                { freq: 554.37, time: 3.5, dissonant: true },
                { freq: 698.46, time: 3.8, dissonant: true }
            ];

            notes.forEach(n => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = n.dissonant ? 'sawtooth' : 'sine';
                osc.frequency.setValueAtTime(n.freq, now + n.time);

                gain.gain.setValueAtTime(0.0, now + n.time);
                gain.gain.linearRampToValueAtTime(n.dissonant ? 0.035 : 0.02, now + n.time + 0.1);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + n.time + 4.0);

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(n.dissonant ? 250 : 800, now + n.time);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                this.activeOscillators.push(osc);
                osc.start(now + n.time);
                osc.stop(now + n.time + 4.1);
            });
        }

        localStorage.setItem(SAVE_KEY, JSON.stringify(gameState));

    function unlockAchievement(id) {
      /*
       * Demo 中不解锁真实成就。
       * demoAchievementBlockUntil 用于拦截 Demo 停止后才到达的延迟回调。
       */
      if (
        demoIsolationActive ||
        Date.now() < demoAchievementBlockUntil
      ) {
        console.info('[Midnight Rules] Demo 沙盒忽略成就：', id);
        return false;
      }
      if (!ACHIEVEMENT_LIST[id]) {
        console.warn('[Midnight Rules] 未知成就：', id);
        return false;
      }
      if (!Array.isArray(gameState.achievements)) {
        gameState.achievements = [];
      }
      if (!gameState.achievements.includes(id)) {
        gameState.achievements.push(id);
        saveGame();
        const toast = document.getElementById('achievement-toast');
        const nameEl = document.getElementById('achievement-name');
        if (nameEl) {
          nameEl.innerText = ACHIEVEMENT_LIST[id].name;
        }
        if (toast) {
          toast.classList.add('show');
        }
        const vnRoot = document.getElementById('vn');
        if (vnRoot && typeof vnRoot.animate === 'function') {
          vnRoot.animate([
            { transform: 'translate(1px, 1px) rotate(0deg)' },
            { transform: 'translate(-1px, -2px) rotate(-1deg)' },
            { transform: 'translate(-3px, 0px) rotate(1deg)' },
            { transform: 'translate(0px, 2px) rotate(0deg)' }
          ], {
            duration: 150
          });
        }
        setTimeout(() => {
          if (toast) {
            toast.classList.remove('show');
          }
        }, 4000);
        return true;
      }
      return false;
    }

    // 每局独立随机种子 (mulberry32，可保存/恢复内部状态)
    /**
     * 可保存、可恢复内部状态的伪随机生成器。
     */
    function mulberry32(seed) {
      let state = seed | 0;
      const rng = function() {
        state =
          (state + 0x6D2B79F5) | 0;
        let t = Math.imul(
          state ^ (state >>> 15),
          1 | state
        );
        t =
          (
            t +
            Math.imul(
              t ^ (t >>> 7),
              61 | t
            )
          ) ^ t;
        return (
          (t ^ (t >>> 14)) >>> 0
        ) / 4294967296;
      };
      rng.getState = function() {
        return state | 0;
      };
      rng.setState = function(nextState) {
        state = Number(nextState) | 0;
      };
      return rng;
    }
    let runRNG = mulberry32(Date.now() % 2147483647);
    let usedInterludes = new Set();
    let glitchedRuleId = null;

    function resetRunRandom() {
      runRNG = mulberry32((Date.now() ^ (Math.random() * 0xffffffff)) % 2147483647);
      usedInterludes = new Set();
      const ids = RULES.map(r => r.id);
      glitchedRuleId = ids[Math.floor(runRNG() * ids.length)];
    }

      return d >= 5 ? 3 : (d >= 3 ? 2 : (d >= 1 ? 1 : 0));

        : `阳气 ${delta} → ${Math.round(sanity)} · ${sanityTierName()}`;
      el.classList.remove('show', 'good', 'bad');
      void el.offsetWidth;
      el.classList.add('show', delta > 0 ? 'good' : 'bad');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 1600);

    function applySanity(delta, opts) {
      /*
       * Demo 恢复原场景时只重新绘制，不重复扣除/增加阳气。
       */
      if (suppressSceneStateEffects) {
        return 0;
      }
      // 已在死亡/结局结算中，不再改心神
      if (!currentScene && !(opts && opts.force)) return;
      if (currentScene && (currentScene.startsWith('death') || currentScene.startsWith('win') || currentScene === 'credits')) return;
      if (!delta) return;
      // 持有红绳时，负面心神损耗减轻
      let d = delta;
      if (d < 0 && gameState.has_charm) d = Math.ceil(d * 0.7);
      // 持有白烛时，烛光场景外的微弱庇护
      if (d < 0 && gameState.has_candle && currentScene && currentScene.includes('dark')) d = Math.ceil(d * 0.85);

      const before = sanity;
      sanity = Math.max(0, Math.min(sanityMax, sanity + d));
      updateSanityUI();
      if (!(opts && opts.silent) && Math.round(sanity) !== Math.round(before)) {
        showSanityToast(Math.round(sanity - before));
      }
      if (sanity <= 0) {
        setTimeout(() => {
          if (!currentScene || !currentScene.startsWith('death')) showScene('death_insanity');
        }, 60);
      }
      return d;
    }

    // 心神档位：影响选项与文本
    function sanityTier() {
      if (sanity <= 15) return 0; // 崩溃边缘
      if (sanity <= 35) return 1; // 恍惚
      if (sanity <= 60) return 2; // 紧绷
      return 3; // 清醒
    }

    function sanityTierName() {
      return ['将散', '恍惚', '紧绷', '清醒'][sanityTier()] || '清醒';
    }

    function yangShaken() {
      return sanityTier() <= 2;
    }

    function orderByYang(opts) {
      if (!Array.isArray(opts) || opts.length < 2 || !yangShaken()) return opts;
      const lure = [];
      const rest = [];
      opts.forEach(o => {
        if (o && (o.safe === false || o.haunted)) lure.push(o);
        else rest.push(o);
      });
      return lure.length ? lure.concat(rest) : opts;
    }

    function sanityHintText() {
      const t = sanityTier();
      const n = Math.round(sanity);
      if (t === 0) return `\n\n<span class="r">（阳气 ${n} · 将散。耳边有人在念你的名字——你几乎想答应。）</span>`;
      if (t === 1) return `\n\n<span class="r">（阳气 ${n} · 恍惚。危险的选项会挤到前面来。）</span>`;
      if (t === 2) return `\n\n<span class="g">（阳气 ${n} · 紧绷。守住已确认的规则，可以回一点阳气。）</span>`;
      return `\n\n<span class="g">（阳气 ${n} · 清醒。规则还听得见。）</span>`;

    // F：默认关闭正文污染（避免像字体乱码）；仅显式关闭评审洁净时才启用极轻污染
    let reviewCleanMode = true;
    function glitchify(text, intensity) {
      if (reviewCleanMode || demoRunning || document.body.classList.contains('review-mode')) return text;
      const maxI = Math.min(intensity || 0, 0.02);
      if (maxI <= 0) return text;
      const chars = '囗乂厶彡';
      let out = '';
      let inTag = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '<') { inTag = true; out += c; continue; }
        if (c === '>') { inTag = false; out += c; continue; }
        if (inTag || c === '\n' || c === ' ' || c === '　') { out += c; continue; }
        const code = c.charCodeAt(0);
        if (code >= 0x4e00 && code <= 0x9fff && Math.random() < maxI) {
          out += chars[Math.floor(Math.random() * chars.length)];
          continue;
        }
        out += c;
      }
      return out;
    }

      const prevPos = sceneEl.style.backgroundPosition;

      // 背景切到特写构图并放大
      if (conf.closeBg) {
        sceneEl.style.backgroundImage = `url('${conf.closeBg}?v=item')`;
        sceneEl.style.backgroundPosition = conf.pos || 'center center';
      }
      sceneEl.classList.remove('item-zoom');
      void sceneEl.offsetWidth;
      sceneEl.classList.add('item-zoom');

      img.src = it.icon;
      name.textContent = '获得 · ' + (conf.title || it.name);
      desc.textContent = it.desc;
      san.textContent = conf.sanity > 0 ? `阳气 +${conf.sanity}` : '';
      layer.classList.add('on');
      if (synth.isPlaying) {
        try { synth.playGong(); } catch (e) {}
      }
      clearTimeout(layer._t);
      layer._t = setTimeout(() => {
        layer.classList.remove('on');
        sceneEl.classList.remove('item-zoom');
        // 恢复本节点背景（若仍在同一场景）
        if (prevBg) sceneEl.style.backgroundImage = prevBg;
        if (prevPos) sceneEl.style.backgroundPosition = prevPos;
      }, 2800);
    }

    function gainItem(id) {
      /*
       * Demo 恢复原场景时不重新授予遗物。
       */
      if (suppressSceneStateEffects) {
        return false;
      }
      if (gameState[id]) return false;
      gameState[id] = true;
      saveGame();
      renderInventory(id);
      const conf = ITEM_SHOWCASE[id];
      if (conf && conf.sanity) {
        // 强制允许在 text() 回调里回心神
        applySanity(conf.sanity, { force: true });
      }
      // 关键道具特写（蜡烛/工牌等）
      setTimeout(() => playItemShowcase(id), 80);
      setTimeout(() => renderInventory(), 2800);
      if (ITEMS.every(it => gameState[it.id])) {
        setTimeout(() => unlockAchievement('HOARDER'), 1800);
      }
      return true;
    }

    function showItemTip(it) {
      const tip = document.getElementById('item-tip');
      tip.innerHTML = `<div class="tip-name">${it.name}</div><div class="tip-desc">${it.desc}</div>`;
      tip.classList.add('show');
      clearTimeout(tip._t);
      tip._t = setTimeout(() => tip.classList.remove('show'), 3200);
    }

    function markStoryEnding(type) {
      if (suppressSceneStateEffects) return;
      gameState.endingType = type || gameState.endingType || '';
      unlockEndingCard(type);
      if (type === 'safe') unlockEndingCard('loop');
      const endingAch = {
        safe: 'SEVENTH_STOP',
        replace: 'WINDOW_SELF',
        together: 'FOLLOW_HER',
        takeover: 'TAKE_WHEEL'
      };

        saveGame();

    };
    const ENDING_KEY = 'midnight_rules_endings_v1';
    function loadEndingCards() {
      try {
        const raw = localStorage.getItem(ENDING_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed.filter(id => ENDING_ATLAS[id]) : [];
      } catch (e) {
        return [];
      }
    }
    function unlockEndingCard(id) {
      if (!id || !ENDING_ATLAS[id]) return;
      const have = loadEndingCards();
      if (have.includes(id)) return;
      have.push(id);
      try {
        localStorage.setItem(ENDING_KEY, JSON.stringify(have));
      } catch (e) {}
    }
    function renderEndingAtlas() {
      const grid = document.getElementById('ending-atlas-grid');
      if (!grid) return;
      const have = loadEndingCards();
      grid.innerHTML = Object.keys(ENDING_ATLAS).map(id => {
        const item = ENDING_ATLAS[id];
        const on = have.includes(id);
        return (
          '<div class="ending-card' + (on ? '' : ' lock') + '">' +
          '<div class="ec-name">' + (on ? item.name : '？？') + '</div>' +
          '<div class="ec-desc">' + (on ? item.desc : '尚未抵达') + '</div>' +
          '</div>'
        );
      }).join('');
    }

    function typeWriter(element, text, speed, callback) {
      clearTimeout(textTimer);
      element.innerHTML = "";
      let i = 0;
      isTyping = true;
      currentFullText = text;
      currentCallback = callback;
      currentElement = element;
      // Demo：略快于正常，但仍可读（勿跳字）
      if (demoRunning) speed = Math.max(10, Math.min(speed || 15, 12));

      const panel = document.getElementById('vn-panel');
      if (panel) panel.style.cursor = 'pointer';
      if (typeHint) typeHint.style.display = 'block';

      function type() {
        if (i < text.length) {
          // Demo：小段吐出，兼顾节奏与可读
          const chunk = demoRunning ? Math.min(4, text.length - i) : 1;
          if (text.charAt(i) === '<' || chunk === 1) {
            if (text.charAt(i) === '<') {
              let tagEnd = text.indexOf('>', i);
              if (tagEnd !== -1) {
                element.innerHTML += text.substring(i, tagEnd + 1);
                i = tagEnd + 1;
              } else {
                element.innerHTML += text.charAt(i);
                i++;
              }
            } else {
              element.innerHTML += text.charAt(i);
              i++;
              if (synth.isPlaying && i % 3 === 0) synth.playTick();
            }
          } else {
            let end = i + chunk;
            // 不把标签切断
            const lt = text.indexOf('<', i);
            if (lt !== -1 && lt < end) end = lt;
            element.innerHTML += text.substring(i, end);
            i = end;
          }
          keepDialogueVisible(element);
          textTimer = setTimeout(type, speed);
        } else {
          isTyping = false;
          if (panel) panel.style.cursor = 'default';
          if (typeHint) typeHint.style.display = 'none';
          const cb = currentCallback;
          currentCallback = null;
          if (cb) cb();
        }
      }
      type();
    }

    function skipTypewriter() {

    function maybeScare() {
      /*
       * Demo、评审模式与状态恢复期间禁止随机惊吓。
       * 否则耳语事件会调用 applySanity(-3)，使行动提案在等待批准时失效。
       */
      if (
        demoRunning ||
        demoIsolationActive ||
        suppressSceneStateEffects ||
        document.body.classList.contains('review-mode')
      ) {
        return;
      }
      if (
        !currentScene ||
        currentScene.startsWith('death') ||
        currentScene.startsWith('win') ||
        currentScene.startsWith('epilogue') ||
        currentScene === 'credits'
      ) {
        return;
      }
      if (
        document
          .getElementById('rulebook')
          .classList.contains('open')
      ) {
        return;
      }
      if (
        welcomeScreen.style.display !== 'none' &&
        welcomeScreen.style.opacity !== '0'
      ) {
        return;
      }
      const lvl = erosionLevel();
      const pool = ['whisper'];
      if (lvl >= 1) {
        pool.push('face');
      }
      if (lvl >= 2) {
        pool.push('blackout', 'face');
      }
      if (lvl >= 3) {
        pool.push('blackout', 'whisper');
      }
      const pick =
        pool[Math.floor(Math.random() * pool.length)];
      if (pick === 'face') {
        faceFlash();
      } else if (pick === 'blackout') {
        blackoutPulse();
      } else {
        whisperScare();
      }
    }

    // ⏱️ 限时抉择
    function startTimed(t) {
      clearInterval(timedTimer);
      timedTimer = null;
      document.body.classList.add('timed-on');
      document.body.classList.remove('timed-crit');
      const wrap = document.createElement('div');
      wrap.id = 'timed-wrap';
      wrap.innerHTML = `<div id="timed-label">⚠️ 阴风刺骨——速做决断！<span id="timed-num">${t.seconds}</span></div><div id="timed-bar"><div id="timed-fill"></div></div>`;
      optsBox.prepend(wrap);
      const fill = wrap.querySelector('#timed-fill');
      const num = wrap.querySelector('#timed-num');
      const total = t.seconds * 1000;
      const startT = Date.now();
      const boundScene = currentScene;
      const prevHb = synth.heartbeatRate;
      timedTimer = setInterval(() => {
        if (currentScene !== boundScene) {
          clearInterval(timedTimer);
          timedTimer = null;
          document.body.classList.remove('timed-on', 'timed-crit');
          return;
        }
        const left = total - (Date.now() - startT);
        if (left <= 0) {
          clearInterval(timedTimer);
          timedTimer = null;
          document.body.classList.remove('timed-on', 'timed-crit');
          if (t.act) { try { t.act(); } catch (e) {} }
          showScene(t.to);
          return;
        }
        fill.style.width = (left / total * 100) + '%';
        num.innerText = Math.ceil(left / 1000);
        if (left < 3000) {
          fill.classList.add('critical');
          document.body.classList.add('timed-crit');
          synth.heartbeatRate = Math.max(320, (prevHb || 900) * 0.45);
        }
      }, 100);
    }

    // 应用场景元数据：腐化滤镜 / 运镜 / 雾 / 镜像 / 微粒 / 时钟 / 氛围罩 / 丧乐
    function applyMeta(sceneKey) {
      const meta = SCENE_META[sceneKey] || { name: '车厢连接 · 异响', p: 0.3, hb: 900, fx: 'dust', mood: 'car', atm: 0.5 };

      nameTag.innerText = meta.name;

      // 剧情时钟
      if (meta.time) {
        clockEl.innerText = '🕰 ' + meta.time;
        clockEl.classList.remove('tick');
        void clockEl.offsetWidth;
        clockEl.classList.add('tick');
      }

      // 画面腐化滤镜（随剧情推进变暗、去饱和、偏色）+ 场景专属 filter
      const p = meta.p || 0;
      const dim = meta.dim || 0;
      let baseFilter;
      if (meta.warm) {
        baseFilter = 'sepia(.32) brightness(1.05) contrast(1.03)';
      } else {
        baseFilter =
          `brightness(${(1 - p * 0.3 - dim).toFixed(2)}) ` +
          `contrast(${(1 + p * 0.18).toFixed(2)}) ` +
          `saturate(${(1 - p * 0.35).toFixed(2)}) ` +
          `hue-rotate(${(-10 * p).toFixed(1)}deg)`;
      }
      if (meta.filter) baseFilter += ' ' + meta.filter;
      sceneWrap.style.filter = baseFilter;

      // 背景焦点差异：同一素材也通过取景制造不同构图
      scene.style.backgroundPosition = meta.pos || 'center center';
      scene.style.backgroundSize = meta.bgs || 'cover';

      // 中式恐怖氛围罩层
      const moodEl = document.getElementById('vn-mood');
      if (moodEl) {
        moodEl.className = '';
        if (meta.mood) {
          moodEl.classList.add('on', 'mood-' + meta.mood);
        }
      }

      // 运镜：按场景指定一次性镜头；无 cam 时 fallback 旧 Ken Burns
      sceneWrap.classList.remove('kb-a', 'kb-b', 'still-scene', 'cam-push', 'cam-pull', 'cam-panL', 'cam-panR', 'cam-fast');
      scene.classList.remove('still-scene');
      if (meta.still || meta.warm || meta.cam === 'still') {
        sceneWrap.classList.add('still-scene');
        scene.classList.add('still-scene');
      } else if (meta.cam && ['push', 'pull', 'panL', 'panR', 'fast'].indexOf(meta.cam) >= 0) {
        void sceneWrap.offsetWidth;
        sceneWrap.classList.add('cam-' + meta.cam);
      } else {
        void sceneWrap.offsetWidth;
        sceneWrap.classList.add(Math.random() < 0.5 ? 'kb-a' : 'kb-b');
      }
      try {
        if (synth.isPlaying) {
          synth.setReverb(meta.tunnel ? 0.32 : (meta.fog ? 0.16 : 0.07));
          if (meta.pa && typeof synth.playPA === 'function') synth.playPA();
        }
      } catch (e) {}
      try { renderHotspots(sceneKey); } catch (e) {}
      try { refreshRuleChip(sceneKey); } catch (e) {}
      try { markUsableItems(sceneKey); } catch (e) {}

      const lampEl = document.getElementById('vn-lamp-spot');
      if (lampEl) lampEl.classList.toggle('on', !!meta.lamp);

      // 镜像 / 雾 / 无光之眼 / 微粒 / 隧道 / 顶灯
      mirrorWrap.classList.toggle('mirrored', !!meta.mirror);
      fogEl.classList.toggle('on', !!meta.fog);
      darkEyes.classList.toggle('on', !!meta.dark);
      document.getElementById('vn-tunnel').classList.toggle('on', !!meta.tunnel);
      document.getElementById('vn-light').classList.toggle('on', !!meta.light);
      setFx(meta.fx);

      // 心跳 + 中式丧乐紧张度
      if (synth.isPlaying) {
        if (meta.hb) {
          let base = Math.max(380, meta.hb - erosionLevel() * 120);
          if (sanity <= 30) base = Math.max(350, Math.round(base * 0.8));
          synth.heartbeatRate = base;
        }
        const atm = typeof meta.atm === 'number' ? meta.atm : p;
        synth.setAtmosphere(Math.min(1, atm + erosionLevel() * 0.08 + (sanity <= 30 ? 0.12 : 0)));
      }

      return meta;
    }

    const CINE_CHAPTERS = {

      train_arrival: ['第一章', '末 班 车'],
      rule_444: ['第二章', '4 : 4 4'],

    let cineFadeTimer = null;
    let cineCardTimer = null;
    let cineBodyTimer = null;   // 章节卡结束后开始打正文的延时器
    let cineBodyRun = null;     // 该延时器要跑的正文动作（跳过时提前执行它）
    let cineSkipCard = null;    // 收起当前章节卡的动作（无卡时为 null）
    function liftCineFade(delay) {
      const f = document.getElementById('cine-fade');
      if (!f) return;
      clearTimeout(cineFadeTimer);
      const go = () => {
        f.classList.remove('on');
        f.style.background = '';
        f.style.transition = '';
      };
      if (!delay) go();
      else cineFadeTimer = setTimeout(go, delay);
    }

    function holdCineFade() {
      const f = document.getElementById('cine-fade');
      if (!f) return;
      clearTimeout(cineFadeTimer);
      f.style.transition = 'none';
      f.style.background = '#000';
      f.classList.add('on');
      void f.offsetWidth;
      f.style.transition = '';
    }

    /** 语义转场：普通溶解由 A/B 层承担；隧道/闪回/结局才压黑或白场 */
    function cineFadePulse(kind) {
      const f = document.getElementById('cine-fade');
      if (!f) return;
      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const k = kind || 'dissolve';
      if (reduce) {
        liftCineFade(0);
        return;
      }
      if (k === 'dissolve') {
        // 不在这里揭黑场。有章节卡时由片名结束再揭，避免片名淡入时空出一帧背景。
        return;
      }
      if (k === 'cut') {
        f.classList.add('on');
        liftCineFade(180);
        return;
      }
      f.style.background = (k === 'memory') ? '#f2e6c9' : '#000';
      f.classList.add('on');
      const ms = k === 'ending' ? 900 : (k === 'wipe' ? 520 : 280);
      liftCineFade(ms);
    }

    function reducedMotion() {
      try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; }
    }

    function setSceneBg(url, trans) {
      const incoming = bgFrontIsA ? bgB : bgA;
      const outgoing = bgFrontIsA ? bgA : bgB;
      if (!incoming || !outgoing) {
        if (scene) scene.style.backgroundImage = url ? `url('${url}')` : 'none';
        return;
      }
      const meta = SCENE_META[currentScene] || {};
      incoming.style.backgroundPosition = meta.pos || 'center center';
      incoming.style.backgroundSize = meta.bgs || 'cover';
      if (!url || url === 'none') {
        incoming.style.backgroundImage = 'none';
        incoming.style.backgroundColor = '#000';
      } else {
        incoming.style.backgroundColor = '';
        incoming.style.backgroundImage = `url('${url}')`;
      }
      const swap = () => {
        incoming.classList.add('is-front');
        outgoing.classList.remove('is-front');
        bgFrontIsA = !bgFrontIsA;
        try { scene.style.backgroundImage = incoming.style.backgroundImage; } catch (e) {}
      };
      const frontEmpty = !outgoing.style.backgroundImage || outgoing.style.backgroundImage === 'none';
      if (reducedMotion() || trans === 'cut' || !url || url === 'none' || frontEmpty) {
        incoming.style.transition = 'none';
        const paint = () => {
          swap();
          requestAnimationFrame(() => { incoming.style.transition = ''; });
        };
        if (!url || url === 'none' || reducedMotion() || trans === 'cut') {
          paint();
          return;
        }
        let painted = false;
        const paintOnce = () => { if (painted) return; painted = true; paint(); };
        const img0 = new Image();
        img0.onload = () => { if (img0.decode) img0.decode().then(paintOnce).catch(paintOnce); else paintOnce(); };
        img0.onerror = paintOnce;
        img0.src = url;
        setTimeout(paintOnce, 500);
        return;
      }
      const img = new Image();
      const done = () => swap();
      img.onload = () => {
        if (img.decode) img.decode().then(done).catch(done);
        else done();
      };
      img.onerror = done;
      img.src = url;
    }

    function renderHotspots(sceneKey) {
      const layer = document.getElementById('vn-hotspots');
      const toast = document.getElementById('vn-hs-toast');
      if (!layer) return;
      layer.innerHTML = '';
      layer.classList.remove('hs-hint');
      if (toast) toast.classList.remove('on');
      const list = SCENE_HOTSPOTS[sceneKey];
      if (!list || demoRunning || demoIsolationActive) return;
      if (!gameState.hotspotsUsed) gameState.hotspotsUsed = {};
      list.forEach(hs => {
        const usedKey = sceneKey + ':' + hs.id;
        if (hs.once && gameState.hotspotsUsed[usedKey]) return;
        const el = document.createElement('button');
        el.type = 'button';
        el.className = 'hs';
        el.style.left = hs.x + '%';
        el.style.top = hs.y + '%';
        el.style.width = hs.w + '%';
        el.style.height = hs.h + '%';
        el.setAttribute('aria-label', hs.hint || '查看');
        el.onclick = (ev) => {
          ev.stopPropagation();
          if (hs.once) gameState.hotspotsUsed[usedKey] = 1;
          if (hs.act) { try { hs.act(); } catch (e) {} }
          if (toast && hs.reveal) {
            toast.textContent = hs.reveal;
            toast.classList.add('on');
            clearTimeout(toast._t);
            toast._t = setTimeout(() => toast.classList.remove('on'), 3200);
          }
          try { if (synth.isPlaying) synth.playUiClick(!!hs.danger); } catch (e) {}
          try { if (hs.danger && navigator.vibrate) navigator.vibrate([30, 40, 30]); } catch (e) {}
          el.classList.add('used');
        };
        layer.appendChild(el);
      });
      if (layer.children.length) {
        layer.classList.add('hs-hint');
        setTimeout(() => layer.classList.remove('hs-hint'), 1200);
      }
    }

    function refreshRuleChip(sceneKey) {
      const chip = document.getElementById('rule-chip');

      if (!chip || typeof RULES === 'undefined') return;
      const known = RULES.filter(r => r.unlocked());

      flt.innerHTML = known.map(r => {

      const spec = SCENE_ITEM_USE[sceneKey];
      document.querySelectorAll('.inv-slot').forEach(el => el.classList.remove('can-use'));
      if (!spec || demoRunning) return;

    /**
     * 章节卡：进入章首场景时压黑场 + 打字机片名。
     * 返回正文打字需延迟的毫秒数（无章节卡或演示中返回 0）。
     */
    function cinePlayChapter(sceneKey) {
      const ch = CINE_CHAPTERS[sceneKey];
      const card = document.getElementById('cine-chapter');
      if (!ch || !card) return 0;
      if (typeof demoRunning !== 'undefined' && demoRunning) return 0;
      if (typeof demoIsolationActive !== 'undefined' && demoIsolationActive) return 0;
      // 评审模式同样跳过：它已禁用随机惊吓/黑场，取向是「让评委快速看到内容」，
      // 再压 2.45s 黑场片名与这一取向相反。
      if (typeof isReviewMode !== 'undefined' && isReviewMode) return 0;
      // 首屏欢迎页仍遮挡时跳过（加载预渲染的序章卡由「上车」入场时补播）
      const welcome = document.getElementById('vn-welcome');
      if (welcome && welcome.style.display !== 'none') return 0;
      // 先瞬间压黑，再叠片名。否则章节卡 opacity 0→1 的 0.45s 会漏出已铺好的背景。
      holdCineFade();
      document.getElementById('cine-chapter-no').textContent = ch[0];
      const titleEl = document.getElementById('cine-chapter-title');
      titleEl.textContent = '';
      card.style.transition = 'none';
      card.classList.add('on');
      void card.offsetWidth;
      card.style.transition = '';
      let i = 0;
      const iv = setInterval(() => {
        i += 1;
        titleEl.textContent = ch[1].slice(0, i);
        if (i >= ch[1].length) clearInterval(iv);
      }, 130);
      clearTimeout(cineCardTimer);
      cineCardTimer = setTimeout(() => {
        card.classList.remove('on');
        liftCineFade(0);
      }, 2300);
      // 点击跳过：把片名补全、收卡，并立刻执行本该延后的正文打字
      cineSkipCard = () => {
        clearInterval(iv);
        titleEl.textContent = ch[1];
        clearTimeout(cineCardTimer);
        card.classList.remove('on');
        liftCineFade(0);
      };
      return 2450;
    }

    // 章节卡点击跳过（只绑一次；无卡可跳时 cineSkipCard 为 null）
    (function bindChapterSkip() {
      const card = document.getElementById('cine-chapter');
      if (!card) return;
      const skip = () => {
        if (!cineSkipCard) return;
        cineSkipCard();
        cineSkipCard = null;
        // 正文本来要等 2450ms 才开打，跳过后立即补上，否则会出现空白对白框
        if (cineBodyRun) {
          clearTimeout(cineBodyTimer);
          const run = cineBodyRun;
          cineBodyRun = null;
          try { run(); } catch (e) { console.warn('[Midnight Rules] 章节卡跳过失败：', e); }
        }
      };
      // 不要在这里写 card.style.pointerEvents='auto'：这层是 inset:0 的全屏黑幕，
      // 常开吃点击会永久挡住选项。命中区交给 CSS 的 #cine-chapter.on 只在亮着时开。
      card.addEventListener('click', skip);
      card.addEventListener('touchend', skip, { passive: true });
    })();
