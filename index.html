<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#050302" />
  <title>午夜规则 (Midnight Rules) - 完整版 · 规则怪谈</title>
  <!-- 内联 favicon：省掉一次必然 404 的 /favicon.ico 请求 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050302'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23c8a86a' font-family='serif'%3E%E5%8D%88%3C/text%3E%3C/svg%3E">
  <!--
    字体策略（防乱码/方框 + 不阻塞首绘）：
    1) 国内镜像加载 Noto Serif SC（googleapis 在国内常失败）
    2) 失败时回退系统中文字体，绝不落到只含拉丁字形的 Georgia
    3) 三个 CDN 请求全部异步化：实测 fonts.loli.net 单独就要 2.75 s，
       原先它们排在首绘之前，等于展板扫码的人先盯着白屏近 3 秒。
       用 media="print" + onload 切回 all 的写法让它们不再阻塞渲染；
       字栈里的系统中文字体已足够完备，字体晚到只是「字形微调」，不会乱码。
  -->
  <link rel="preconnect" href="https://fonts.loli.net" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all';this.onload=null;">
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/400.css" rel="stylesheet" media="print" onload="this.media='all';this.onload=null;">
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.2.5/700.css" rel="stylesheet" media="print" onload="this.media='all';this.onload=null;">
  <noscript>
    <link href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet">
  </noscript>
  <style>
    :root {
      /* 中文优先字栈：避免 Google 字体失败后变成乱码方框 */
      --font-zh: "Noto Serif SC", "Source Han Serif SC", "Source Han Serif CN",
        "Songti SC", "STSong", "SimSun", "Microsoft YaHei", "PingFang SC",
        "Hiragino Sans GB", "Noto Sans SC", "WenQuanYi Micro Hei",
        "Segoe UI", system-ui, sans-serif;
    }
    html, body {
      margin: 0; padding: 0;
      background: #000;
      overflow: hidden;
      width: 100%;
      height: 100%;
      height: 100dvh;
      max-width: 100vw;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
      font-family: var(--font-zh);
      color: #e8dcc0;
    }
    button, input, textarea {
      font-family: inherit;
    }
  </style>
</head>
<body>

<!-- 🎫 首屏交互声效解锁遮罩层 -->
<div id="vn-welcome">
  <div class="couplet couplet-l">阴司借道</div>
  <div class="couplet couplet-r">生人回避</div>
  <div class="welcome-title">午 夜 规 则</div>
  <div class="welcome-subtitle">4:41</div>
  <div class="welcome-desc">末班车即将进站。<br>请戴上耳机。<br><span id="welcome-loop" style="color:#ff5555;"></span></div>
  <button id="btn-enter">● 上 车 · 即 是 入 局</button>
</div>

<div id="vn">
  <style>
    #vn *{box-sizing:border-box;}
    #vn{
      position:relative;
      width:100%;
      height:100%;
      height:100dvh;
      overflow:hidden;
      font-family: var(--font-zh);
      user-select:none;
      color:#e8dcc0;
      background:#050302;
    }

    /* 欢迎屏 */
    #vn-welcome{
      position:fixed; inset:0; z-index:9999;
      background:radial-gradient(circle at 50% 40%, #1a0f08, #050302 72%);
      display:flex; flex-direction:column; justify-content:center; align-items:center;
      font-family: var(--font-zh); color:#e8dcc0; text-align:center;
      padding: max(24px, env(safe-area-inset-top)) 22px max(24px, env(safe-area-inset-bottom));
      transition: opacity 0.8s ease;
      overflow:auto; -webkit-overflow-scrolling:touch;
      overflow-x:hidden;
      max-width:100vw;
    }
    #btn-enter{
      background: linear-gradient(135deg, #420a0a, #1a0505);
      border: 1.5px solid #ff3333; color: #ffcccc;
      padding: 15px 40px; font-size: 16px; font-weight: bold;
      border-radius: 30px; cursor: pointer;
      box-shadow: 0 0 20px rgba(255,51,51,0.4);
      transition: 0.3s; letter-spacing: 0.15em;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    #btn-enter:active{ transform: scale(.97); }
    #btn-enter:disabled{
      opacity: .72;
      pointer-events: none;
      cursor: default;
    }

    .welcome-title {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 0.2em;
      color: #ff3333;
      text-shadow: 0 0 15px rgba(255,51,51,0.5);
      margin-bottom: 10px;
      animation: titleFlicker 4s infinite;
    }
    @keyframes titleFlicker {
      0%, 88%, 92%, 100% { opacity: 1; }
      90% { opacity: 0.35; }
    }
    .welcome-desc {
      font-size: 14px;
      letter-spacing: 0.1em;
      color: #8a7d60;
      margin-bottom: 40px;
      max-width: 400px;
      line-height: 1.6;
    }

    /* ===== 场景图层结构：包装(运镜+腐化滤镜) > 镜像层 > 场景(震动+频闪) ===== */
    #vn-scene-wrap{
      position:absolute;
      inset:0;
      z-index: 1;
    }
    /* 🎬 肯·伯恩斯运镜：画面随剧情缓慢推移，如同有生命的注视 */
    #vn-scene-wrap.kb-a{animation:kbA 38s ease-in-out infinite alternate;}
    #vn-scene-wrap.kb-b{animation:kbB 44s ease-in-out infinite alternate;}
    @keyframes kbA{from{transform:scale(1.03) translate(0,0);}to{transform:scale(1.13) translate(-1.6%,1%);}}
    @keyframes kbB{from{transform:scale(1.13) translate(1.6%,-1%);}to{transform:scale(1.03) translate(0,0);}}

    #vn-mirror-wrap{
      position:absolute;
      inset:0;
      transition:transform .8s ease;
    }
    #vn-mirror-wrap.mirrored{transform:scaleX(-1);}

    /* 动态背景大图层 + 🚂 车厢晃动震荡动效
     * 背景图画在 A/B 子层上做交叉溶解；#vn-scene 自己不再设 background-image
     * （CSS 对 background-image 的 transition 在 Chrome/Safari 上不生效） */
    #vn-scene{
      position:absolute;
      inset:0;
      animation: trainVibrate 6s infinite ease-in-out;
      will-change: transform;
    }
    .vn-bg-layer{
      position:absolute; inset:0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity .6s ease;
      z-index: 0;
    }
    .vn-bg-layer.is-front{ opacity: 1; z-index: 1; }
    #vn-hotspots{
      position:absolute; inset:0; z-index:4;
      pointer-events:none;
    }
    #vn-hotspots .hs{
      position:absolute;
      pointer-events:auto;
      border:1px solid rgba(212,175,55,.18);
      border-radius:50%;
      background: radial-gradient(circle, rgba(212,175,55,.22), transparent 70%);
      cursor:pointer;
      opacity:.2;
      animation: hsPulse 2.4s ease-in-out infinite;
    }
    #vn-hotspots .hs:hover,
    #vn-hotspots .hs:focus-visible{ opacity:.7; outline:none; }
    #vn-hotspots.hs-hint .hs{ opacity:.45; }
    #vn-hotspots .hs.used{ display:none; }
    @keyframes hsPulse{
      0%,100%{ transform:scale(1); box-shadow:0 0 0 0 rgba(212,175,55,.2); }
      50%{ transform:scale(1.08); box-shadow:0 0 14px 4px rgba(212,175,55,.18); }
    }
    #vn-hs-toast{
      position:absolute; left:50%; bottom:38%;
      transform:translateX(-50%);
      max-width:78%;
      padding:10px 14px;
      background:rgba(8,6,4,.82);
      border:1px solid rgba(212,175,55,.4);
      color:#f4ead0;
      font-size:14px;
      line-height:1.55;
      border-radius:6px;
      opacity:0;
      pointer-events:none;
      z-index:5;
      transition:opacity .25s ease;
    }
    #vn-hs-toast.on{ opacity:1; }
    /* 导演化运镜：一次性 ease-out，推到位就停 */
    #vn-scene-wrap.cam-push{ animation: camPush 7.5s ease-out forwards; }
    #vn-scene-wrap.cam-pull{ animation: camPull 6.5s ease-out forwards; }
    #vn-scene-wrap.cam-panL{ animation: camPanL 8s ease-out forwards; }
    #vn-scene-wrap.cam-panR{ animation: camPanR 8s ease-out forwards; }
    #vn-scene-wrap.cam-fast{ animation: camFast 2.2s ease-in forwards; }
    @keyframes camPush{ from{transform:scale(1.02) translate(0,0);} to{transform:scale(1.12) translate(-1%,.6%);} }
    @keyframes camPull{ from{transform:scale(1.12);} to{transform:scale(1.02);} }
    @keyframes camPanL{ from{transform:scale(1.08) translate(2%,0);} to{transform:scale(1.08) translate(-2%,0);} }
    @keyframes camPanR{ from{transform:scale(1.08) translate(-2%,0);} to{transform:scale(1.08) translate(2%,0);} }
    @keyframes camFast{ from{transform:scale(1.04);} to{transform:scale(1.18) translate(0,1%);} }
    /* 限时抉择：屏幕边缘收缩暗角 */
    #timed-vig{
      position:absolute; inset:0; z-index:6; pointer-events:none;
      opacity:0; transition:opacity .4s ease;
      background: radial-gradient(ellipse at center, transparent 42%, rgba(90,0,0,.55) 100%);
    }
    body.timed-on #timed-vig{ opacity:1; }
    body.timed-crit #timed-vig{ animation: timedPulse .45s infinite alternate; }
    @keyframes timedPulse{ from{opacity:.7;} to{opacity:1;} }
    /* 守则常驻角标 */
    body:not(.cine-on) #rule-chip,
    body:not(.cine-on) #rule-float { display: none; }
    #rule-chip{
      position:absolute; right:10px; top:54px; z-index:28;
      min-width:42px; padding:6px 10px;
      background:rgba(10,8,6,.72);
      border:1px solid rgba(212,175,55,.35);
      color:#e8dcc0; font-size:12px; letter-spacing:.06em;
      border-radius:4px; cursor:pointer;
    }
    #rule-chip b{ color:#d4af37; }
    #rule-float{
      display:none; position:absolute; right:10px; top:88px; z-index:29;
      width:min(280px,78vw); max-height:42vh; overflow:auto;
      background:rgba(8,6,4,.9); border:1px solid rgba(212,175,55,.35);
      padding:10px 12px; color:#e8dcc0; font-size:13px; line-height:1.55;
    }
    #rule-float.on{ display:block; }
    #rule-float .rf-hit{ color:#ffb08a; border-left:2px solid #c03030; padding-left:8px; margin:6px 0; }
    /* 道具可主动使用 */
    .inv-slot.can-use{
      box-shadow:0 0 10px rgba(212,175,55,.55);
      outline:1px solid #d4af37;
    }
    /* 3 步新手引导 */
    #vn-guide{
      display:none; position:fixed; inset:0; z-index:80; pointer-events:none;
    }
    #vn-guide.on{ display:block; }
    #vn-guide .g-spot{
      position:absolute; pointer-events:auto;
      padding:8px 12px; max-width:220px;
      background:rgba(8,6,4,.92); border:1px solid #d4af37;
      color:#f4ead0; font-size:13px; line-height:1.5; border-radius:6px;
    }
    #vn-guide .g-spot button{
      margin-top:8px; background:transparent; border:1px solid #d4af37;
      color:#d4af37; padding:4px 10px; cursor:pointer; font-family:inherit;
    }

    /* 🎭 中式恐怖氛围罩层：每场景切换 mood 类，叠色/纸纹/朱砂/墨渍 */
    #vn-mood{
      position:absolute; inset:0; z-index:2;
      pointer-events:none;
      opacity:0;
      transition: opacity .9s ease, background .9s ease, filter .9s ease;
      mix-blend-mode: multiply;
    }
    #vn-mood.on{opacity:1;}
    #vn-mood.mood-platform{
      background:
        radial-gradient(ellipse 90% 60% at 50% 100%, rgba(20,12,8,.55), transparent 70%),
        linear-gradient(180deg, rgba(8,10,14,.35), transparent 40%, rgba(0,0,0,.45));
      mix-blend-mode: normal;
    }
    #vn-mood.mood-notice{
      background:
        radial-gradient(circle at 50% 45%, rgba(90,40,20,.18), transparent 55%),
        linear-gradient(180deg, rgba(40,22,10,.25), rgba(10,6,4,.5));
      mix-blend-mode: soft-light;
    }
    #vn-mood.mood-tunnel{
      background:
        repeating-linear-gradient(90deg, rgba(0,0,0,.15) 0 8px, transparent 8px 28px),
        radial-gradient(ellipse at center, transparent 20%, rgba(0,0,0,.72) 100%);
      mix-blend-mode: normal;
      animation: tunnelPulse 3.5s ease-in-out infinite alternate;
    }
    @keyframes tunnelPulse{from{opacity:.75}to{opacity:1}}
    #vn-mood.mood-car{
      background:
        radial-gradient(ellipse 70% 50% at 50% 0%, rgba(160,120,50,.12), transparent 55%),
        radial-gradient(circle at 80% 70%, rgba(80,10,15,.2), transparent 45%);
      mix-blend-mode: soft-light;
    }
    #vn-mood.mood-seller{
      background:
        radial-gradient(circle at 50% 55%, rgba(30,90,45,.22), transparent 50%),
        linear-gradient(180deg, rgba(5,20,10,.2), rgba(0,0,0,.55));
      mix-blend-mode: normal;
    }
    #vn-mood.mood-ash{
      background: radial-gradient(circle at 50% 40%, rgba(30,30,30,.1), rgba(0,0,0,.55));
      mix-blend-mode: multiply;
    }
    #vn-mood.mood-window{
      background:
        radial-gradient(ellipse 80% 55% at 50% 45%, rgba(40,50,90,.15), transparent 60%),
        linear-gradient(180deg, rgba(0,0,0,.1), rgba(10,5,15,.5));
      mix-blend-mode: normal;
      animation: windowThrob 2.2s ease-in-out infinite alternate;
    }
    @keyframes windowThrob{from{opacity:.7}to{opacity:1}}
    #vn-mood.mood-red{
      background:
        radial-gradient(circle at 70% 55%, rgba(140,10,20,.35), transparent 45%),
        linear-gradient(180deg, rgba(40,0,5,.2), rgba(10,0,0,.55));
      mix-blend-mode: normal;
    }
    #vn-mood.mood-heaven{
      background:
        radial-gradient(circle at 50% 40%, rgba(255,250,230,.35), transparent 50%),
        linear-gradient(180deg, rgba(255,240,200,.15), rgba(40,20,10,.45));
      mix-blend-mode: soft-light;
      animation: heavenPulse 2.8s ease-in-out infinite alternate;
    }
    @keyframes heavenPulse{from{filter:brightness(1)}to{filter:brightness(1.25)}}
    #vn-mood.mood-dark{
      background: radial-gradient(circle at 50% 50%, rgba(0,0,0,.35), rgba(0,0,0,.92));
      mix-blend-mode: normal;
    }
    #vn-mood.mood-candle{
      background:
        radial-gradient(circle at 48% 62%, rgba(255,180,80,.28), transparent 28%),
        radial-gradient(circle at 50% 55%, transparent 15%, rgba(0,0,0,.88) 70%);
      mix-blend-mode: normal;
      animation: candleWaver 3s ease-in-out infinite alternate;
    }
    @keyframes candleWaver{
      from{background:
        radial-gradient(circle at 47% 63%, rgba(255,180,80,.26), transparent 26%),
        radial-gradient(circle at 50% 55%, transparent 14%, rgba(0,0,0,.9) 72%);}
      to{background:
        radial-gradient(circle at 50% 60%, rgba(255,200,100,.32), transparent 30%),
        radial-gradient(circle at 50% 55%, transparent 16%, rgba(0,0,0,.86) 68%);}
    }
    #vn-mood.mood-mirror{
      background:
        linear-gradient(105deg, rgba(120,140,160,.12) 0%, transparent 40%, rgba(80,20,30,.18) 100%);
      mix-blend-mode: soft-light;
    }
    #vn-mood.mood-brake{
      background:
        radial-gradient(circle at 55% 48%, rgba(120,20,20,.25), transparent 40%),
        linear-gradient(180deg, rgba(10,0,0,.2), rgba(0,0,0,.6));
      mix-blend-mode: normal;
    }
    #vn-mood.mood-memory{
      background:
        radial-gradient(circle at 50% 45%, rgba(180,140,80,.2), transparent 55%),
        linear-gradient(180deg, rgba(40,30,15,.15), rgba(0,0,0,.4));
      mix-blend-mode: soft-light;
      filter: sepia(.25);
    }
    #vn-mood.mood-qinghuai{
      background:
        radial-gradient(ellipse 85% 55% at 50% 100%, rgba(6,10,16,.78), transparent 72%),
        linear-gradient(180deg, rgba(18,22,30,.5), rgba(0,0,0,.66));
      mix-blend-mode: normal;
    }
    #vn-mood.mood-win{
      background: radial-gradient(circle at 50% 40%, rgba(200,180,120,.18), transparent 60%);
      mix-blend-mode: soft-light;
    }
    #vn-lamp-spot{
      position:absolute; inset:0; z-index:3; pointer-events:none; opacity:0;
      background:
        radial-gradient(ellipse 26% 30% at 50% 74%, rgba(255,196,110,.4), transparent 64%),
        radial-gradient(ellipse 95% 85% at 50% 38%, transparent 18%, rgba(0,0,0,.74) 100%);
      transition: opacity .9s ease;
    }
    #vn-lamp-spot.on{ opacity:1; }
    #vn-scene.still-scene,
    #vn-scene-wrap.still-scene{
      animation: none !important;
    }
    #vn-mood.mood-false{
      background:
        radial-gradient(circle at 50% 50%, rgba(180,40,40,.15), transparent 50%),
        linear-gradient(180deg, transparent, rgba(20,0,0,.55));
      mix-blend-mode: normal;
    }
    #vn-mood.mood-credits{
      background:
        radial-gradient(ellipse 70% 55% at 50% 42%, transparent 18%, rgba(6,4,2,.55) 100%),
        linear-gradient(180deg, rgba(0,0,0,.28), rgba(0,0,0,.12) 38%, rgba(0,0,0,.62));
      mix-blend-mode: normal;
    }

    /* 🎞️ 胶片噪点 + 朱砂雾感 */
    #vn-film{
      position:absolute; inset:0; z-index:7;
      pointer-events:none;
      opacity:.18;
      background-image:
        radial-gradient(circle, rgba(220,200,160,.45) 0.6px, transparent 0.7px);
      background-size: 3px 3px;
      animation: filmGrain .35s steps(2) infinite;
      mix-blend-mode: overlay;
    }
    @keyframes filmGrain{
      0%{transform:translate(0,0)}
      50%{transform:translate(-1px,1px)}
      100%{transform:translate(1px,-1px)}
    }
    /* 中式水墨竖纹 / 符纸边 */
    #vn-ink{
      position:absolute; inset:0; z-index:6;
      pointer-events:none;
      opacity:.22;
      background:
        linear-gradient(90deg, rgba(0,0,0,.55) 0, transparent 8%, transparent 92%, rgba(0,0,0,.55) 100%),
        linear-gradient(180deg, rgba(90,15,15,.18) 0, transparent 12%, transparent 88%, rgba(0,0,0,.35) 100%);
    }
    @keyframes trainVibrate {
      0%, 100% { transform: translate(0, 0); }
      10% { transform: translate(-0.3px, 0.4px) rotate(0.05deg); }
      20% { transform: translate(0.4px, -0.3px) rotate(-0.05deg); }
      30% { transform: translate(-0.5px, -0.2px) rotate(0.02deg); }
      40% { transform: translate(0.3px, 0.3px) rotate(-0.02deg); }
      50% { transform: translate(-0.2px, -0.4px) rotate(0.05deg); }
      60% { transform: translate(0.5px, 0.2px) rotate(-0.05deg); }
      70% { transform: translate(-0.4px, 0.4px) rotate(0.02deg); }
      80% { transform: translate(0.2px, -0.2px) rotate(-0.02deg); }
      90% { transform: translate(-0.3px, -0.3px) rotate(0.03deg); }
    }

    /* 😱 死亡跳跃惊吓放大 (Jumpscare Zoom) */
    .jumpscare-zoom {
      animation: jumpscareZoom 0.9s forwards ease-out !important;
    }
    @keyframes jumpscareZoom {
      0%   { transform: translate(0, 0) scale(1); }
      8%   { transform: translate(15px, -15px) scale(1.7) rotate(1deg); }
      16%  { transform: translate(-15px, 15px) scale(1.6) rotate(-1deg); }
      24%  { transform: translate(10px, 10px) scale(1.7) rotate(1.5deg); }
      32%  { transform: translate(-10px, -5px) scale(1.6) rotate(-1deg); }
      40%  { transform: translate(5px, 5px) scale(1.65) rotate(0.5deg); }
      100% { transform: translate(0, 0) scale(1.45) rotate(0deg); }
    }

    /* 📺 死亡场景负片频闪：如同坏掉的诅咒录像带 */
    #vn-scene.death-strobe{
      animation: trainVibrate 6s infinite ease-in-out, deathStrobe .45s steps(2) infinite;
    }
    @keyframes deathStrobe{
      0%,100%{filter:none;}
      50%{filter:invert(.9) hue-rotate(300deg) brightness(1.35);}
    }

    /* 🩸 全屏惊吓闪现层 (死亡瞬间贴脸) —— 盖住场景，但低于对话/按钮 UI(40)，避免「UI不显示」 */
    #vn-jumpscare{
      position:absolute;
      inset:0;
      z-index:25;
      background:#000;
      opacity:0;
      pointer-events:none;
      transition:opacity .15s ease-out;
      display:flex;
    }
    #vn-jumpscare img{
      width:100%;
      height:100%;
      object-fit:cover;
      filter:grayscale(.4) contrast(1.7) brightness(.72);
    }
    #vn-jumpscare.on{opacity:1;animation:jsshake .09s infinite;}
    @keyframes jsshake{
      0%{transform:translate(3px,2px)}
      25%{transform:translate(-3px,-2px)}
      50%{transform:translate(2px,-3px)}
      75%{transform:translate(-2px,3px)}
      100%{transform:translate(3px,-2px)}
    }

    /* 👤 窗外白脸随机闪现 */
    #mr-face{
      position:absolute;
      width:150px;
      height:190px;
      z-index:6;
      pointer-events:none;
      opacity:0;
      transition:opacity .15s;
      overflow:hidden;
      border-radius:48%;
    }
    #mr-face img{
      width:100%;
      height:100%;
      object-fit:cover;
      filter:blur(4px) brightness(.5) contrast(1.5) grayscale(.5);
    }
    #mr-face.show{opacity:.75;}

    /* ⚫ 随机断电瞬间 */
    #vn-blackout{
      position:absolute;
      inset:0;
      background:#000;
      opacity:0;
      pointer-events:none;
      transition:opacity .15s;
      z-index:7;
    }
    #vn-blackout.on{opacity:.97;}

    /* 👻 高侵蚀度下：红衣人浮现层，越来越近 */
    #red-wrap{
      position:absolute;
      right:3%;
      bottom:10%;
      height:52%;
      z-index:3;
      pointer-events:none;
      opacity:0;
      transition:opacity 2.5s ease-in-out;
      animation:redSway 7s ease-in-out infinite;
    }
    #red-overlay{
      height:100%;
      filter:brightness(.5) contrast(1.25) drop-shadow(0 0 12px rgba(128,17,31,.35));
      mask-image:linear-gradient(to top,transparent 2%,black 30%);
      -webkit-mask-image:linear-gradient(to top,transparent 2%,black 30%);
    }
    @keyframes redSway{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-6px) rotate(.4deg)}
    }
    /* 侵蚀MAX时红衣人转过头的双眼 */
    #red-eyes{
      position:absolute;
      top:9%;
      left:44%;
      display:flex;
      gap:8px;
      opacity:0;
      transition:opacity 3s;
      pointer-events:none;
    }
    #red-eyes i{
      width:5px;height:6px;border-radius:50%;
      background:radial-gradient(circle,#ffdddd,#cc1a1a 60%,transparent);
      box-shadow:0 0 7px 2px rgba(255,40,40,.5);
      animation:eyeBlink 4.5s infinite;
    }
    #red-eyes.on{opacity:.9;}

    /* 👀 无光车厢中的眼睛 */
    #dark-eyes{
      position:absolute;
      top:38%;
      left:58%;
      z-index:5;
      display:flex;
      gap:14px;
      opacity:0;
      transition:opacity 2.5s;
      pointer-events:none;
    }
    #dark-eyes i{
      width:7px;height:9px;border-radius:50%;
      background:radial-gradient(circle,#ffdddd,#cc1a1a 60%,transparent);
      box-shadow:0 0 8px 2px rgba(255,40,40,.55);
      animation:eyeBlink 4.5s infinite;
    }
    #dark-eyes.on{opacity:.85;}
    @keyframes eyeBlink{0%,92%,100%{transform:scaleY(1);}95%{transform:scaleY(.1);}}

    /* 🌫️ 站台/隧道雾气压境 */
    #vn-fog{
      position:absolute;
      inset:-10%;
      z-index:4;
      pointer-events:none;
      opacity:0;
      transition:opacity 2s;
      background:
        radial-gradient(ellipse 60% 40% at 20% 80%, rgba(160,160,170,.08), transparent 70%),
        radial-gradient(ellipse 50% 35% at 80% 30%, rgba(160,160,170,.07), transparent 70%);
      animation:fogDrift 26s ease-in-out infinite alternate;
    }
    #vn-fog.on{opacity:1;}
    @keyframes fogDrift{from{transform:translateX(-4%) translateY(0);}to{transform:translateX(4%) translateY(-2%);}}

    /* ✨ 漂浮微粒层：尘埃/火星 */
    #vn-particles{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden;}
    .vn-p{position:absolute;bottom:-10px;border-radius:50%;opacity:0;animation:pRise linear forwards;}
    .vn-p.dust{background:rgba(210,200,170,.35);box-shadow:0 0 4px rgba(210,200,170,.3);}
    .vn-p.ember{background:rgba(255,140,60,.7);box-shadow:0 0 6px rgba(255,120,40,.6);}
    @keyframes pRise{
      0%{transform:translateY(0) translateX(0);opacity:0;}
      12%{opacity:.8;}
      100%{transform:translateY(-105vh) translateX(40px);opacity:0;}
    }

    /* 🩸 血滴滑落层 (死亡场景) */
    #vn-blood{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden;}
    .vn-drip{
      position:absolute;
      top:-15%;
      width:3px;
      border-radius:2px;
      background:linear-gradient(180deg, rgba(120,10,15,.1), rgba(140,12,18,.85) 60%, rgba(90,5,10,.95));
      filter:blur(.4px);
      animation:dripFall linear forwards;
    }
    @keyframes dripFall{to{transform:translateY(130vh);}}

    /* 电影级四周暗角 */
    #vn-vig{
      position:absolute;
      inset:0;
      box-shadow:inset 0 0 180px 60px #000;
      pointer-events:none;
      z-index: 8;
    }

    /* 💡 灯光爆闪/电磁干扰 */
    #vn-flick{
      position:absolute;
      inset:0;
      background:rgba(190,150,80,.03);
      animation:vnf 6s infinite;
      pointer-events:none;
      z-index: 9;
    }
    @keyframes vnf{0%,46%,52%,100%{opacity:1}48%{opacity:.2}50%{opacity:.7}}

    #vn-flick.spooky-flicker {
      animation: electricityFlicker 3s infinite linear;
    }
    @keyframes electricityFlicker {
      0%, 100% { background: rgba(0, 0, 0, 0); }
      18% { background: rgba(0, 0, 0, 0); }
      19% { background: rgba(0, 0, 0, 0.9); }
      20% { background: rgba(0, 0, 0, 0); }
      21% { background: rgba(0, 0, 0, 0.7); }
      22% { background: rgba(0, 0, 0, 0); }
      50% { background: rgba(0, 0, 0, 0); }
      51% { background: rgba(0, 0, 0, 0.95); }
      53% { background: rgba(0, 0, 0, 0); }
      54% { background: rgba(0, 0, 0, 0.8); }
      55% { background: rgba(0, 0, 0, 0); }
      82% { background: rgba(0, 0, 0, 0); }
      83% { background: rgba(0, 0, 0, 0.85); }
      84% { background: rgba(0, 0, 0, 0); }
    }

    /* 顶部UI —— z-index 必须高于死亡/特效层，否则会出现「UI不显示」 */
    #vn-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:20px 30px;z-index:40;}
    #vn-status{font-size:13px;letter-spacing:.1em;color:#8a7d60;text-shadow: 0 2px 4px #000;display:flex;align-items:center;}
    #vn-status b{color:#5a9a5a;}
    #vn-skip{font-size:14px;letter-spacing:.15em;color:#c8b488;border:1px solid #4a3f28;border-radius:20px;padding:6px 20px;cursor:pointer;background:rgba(0,0,0,.6);backdrop-filter: blur(4px);}

    /* 🕰️ 剧情时钟：随章节推进走向 4:55 */
    #vn-clock{
      margin-left:14px;
      color:#c96a6a;
      font-size:12px;
      letter-spacing:.15em;
      text-shadow:0 0 6px rgba(200,60,60,.4);
    }
    #vn-clock.tick{animation:clockTick .5s;}
    @keyframes clockTick{0%{opacity:.2;transform:translateY(-2px);}100%{opacity:1;transform:none;}}

    /* 🧠 心神值条 */
    #sanity-wrap{display:flex;align-items:center;gap:6px;margin-left:16px;font-size:12px;color:#a89670;}
    #sanity-bar{width:70px;height:6px;border:1px solid #4a3f28;border-radius:3px;background:rgba(0,0,0,.5);overflow:hidden;}
    #sanity-fill{height:100%;width:100%;background:linear-gradient(90deg,#7a5a2a,#d4af37);transition:width .4s;}
    #sanity-num{font-size:11px;color:#8a7d60;min-width:24px;}
    #sanity-tier{font-size:10px;letter-spacing:.12em;color:#8a7d60;min-width:2em;}
    #sanity-tier.st-3{color:#c9b184;}
    #sanity-tier.st-2{color:#e8c878;}
    #sanity-tier.st-1{color:#ff9a6a;}
    #sanity-tier.st-0{color:#ff5555;}
    body.low-sanity #sanity-fill{background:linear-gradient(90deg,#80111f,#ff3333);}
    body.low-sanity #sanity-num{color:#ff5555;}

    /* 低心神时暗角呼吸收缩 + 噪点加重 */
    body.low-sanity #vn-vig{animation:vigPulse 1.8s infinite ease-in-out;}
    body.low-sanity #vn-film{opacity:.32; animation-duration:.22s;}
    body.low-sanity #vn-ink{opacity:.38;}
    body.low-sanity #vn-mood{filter:saturate(1.2) contrast(1.05);}
    @keyframes vigPulse{
      0%,100%{box-shadow:inset 0 0 180px 60px #000;}
      50%{box-shadow:inset 0 0 230px 120px #140000;}
    }

    #vn-side{position:absolute;left:30px;top:85px;z-index:40;display:flex;flex-direction:column;gap:14px;}
    .vn-ic {
      width: 44px;
      height: 44px;
      padding: 0;
      border-radius: 8px;
      border: 1px solid #4a3f28;
      background: rgba(10,8,5,.6);
      color: #b8a678;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      backdrop-filter: blur(2px);
      font-family: inherit;
      appearance: none;
    }

    /* 🏆 动态成就弹出提示框 🏆 */
    #achievement-toast{
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      z-index: 50;
      background: linear-gradient(135deg, #1f170f, #0d0a07);
      border: 1.5px solid #d4af37;
      border-radius: 10px;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px rgba(212,175,55,0.3);
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }
    #achievement-toast.show { transform: translateX(-50%) translateY(0); }
    #achievement-icon { font-size: 24px; }
    #achievement-title { color: #d4af37; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 2px;}
    #achievement-name { color: #fff; font-size: 14px; font-weight: bold; }

    /* 对话框整体外容器 —— 必须高于 #vn-death(20) / #vn-jumpscare(25) 之后的常驻特效，保证死亡后仍可见 */
    #vn-box{
      position:absolute;
      left:30px;
      right:30px;
      bottom:30px;
      height: 38%;
      max-height: 420px;
      z-index:40;
      display:flex;
      flex-direction:column;
      overflow: visible; /* 名称标签/符幡不可被裁切 */
    }
    #vn-line, #vn-opts {
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    #vn-name{
      display:inline-block;
      align-self: flex-start;
      background:linear-gradient(90deg,#2a1c0c,#4a2a10);
      border:1px solid #7a5a2a;
      color:#e8c878;
      font-size:14px;
      letter-spacing:.12em;
      padding:7px 18px 8px;
      border-radius:12px 12px 0 0;
      margin-bottom:-1px;
      margin-left:16px;
      position:relative;
      z-index:15;
      box-shadow:0 -4px 10px rgba(0,0,0,0.5);
      max-width: calc(100% - 100px);
      box-sizing: border-box;
      white-space: nowrap;
      overflow: visible; /* 不用 ellipsis 裁字，避免「显示不全」 */
      line-height: 1.35;
    }

    /* 横向通栏面板 */
    #vn-panel{
      flex: 1;
      min-height: 0;
      background:linear-gradient(180deg,rgba(14,11,8,.93),rgba(6,5,4,.97));
      border:1px solid #5a4a2a;
      border-radius:14px;
      padding:24px 30px;
      backdrop-filter:blur(5px);
      box-shadow:0 15px 50px rgba(0,0,0,0.9),inset 0 0 25px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: row;
      gap: 20px;
      position: relative;
      overflow: hidden; /* 仅裁切面板内部，不波及 #vn-name */
    }

    /* 剧情文本区 */
    #vn-line{
      flex: 1.3;
      color:#e2d5b5;
      font-size:16px;
      line-height: 1.55;
      text-shadow:0 1px 5px #000;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 12px;
      min-height: 0;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    #vn-line::-webkit-scrollbar { width: 4px; }
    #vn-line::-webkit-scrollbar-thumb { background: #5a4a2a; border-radius: 2px; }
    #vn-line .r { color:#ff6b6b; font-weight: bold; }
    #vn-line .g { color:#64dfdf; font-weight: bold; }
    #vn-line .gold { color:#ffdf00; font-weight: bold; text-shadow: 0 0 8px rgba(255,223,0,0.5); }

    /* 打字中跳过提示 */
    #type-hint{
      position:absolute;
      right:28px;
      bottom:10px;
      font-size:10px;
      color:rgba(200,180,120,.35);
      z-index:11;
      animation:hintBlink 1.6s infinite;
      pointer-events:none;
      display:none;
      letter-spacing:.1em;
    }
    @keyframes hintBlink{0%,100%{opacity:.12}50%{opacity:.6}}

    /* 选项动作区 */
    #vn-opts{
      flex: 1;
      display:flex;
      flex-direction:column;
      justify-content: flex-start;
      gap:10px;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 4px;
      min-height: 0;
    }
    #vn-opts::-webkit-scrollbar { width: 0px; }

    .vn-opt{
      background:linear-gradient(90deg,rgba(35,26,15,.85),rgba(20,15,10,.85));
      border:1px solid #4a3a20;
      border-radius:8px;
      padding:12px 18px;
      color:#cbb98a;
      font-family:inherit;
      font-size:14px;
      cursor:pointer;
      transition:.2s;
      text-align:left;
      width:100%;
      line-height: 1.4;
      flex-shrink: 0;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .vn-opt:hover{border-color:#c8a24d;color:#f4e8c8;box-shadow:0 0 12px rgba(200,160,80,.25);transform: translateX(3px);}
    .vn-opt:active{transform:scale(.98); box-shadow:inset 0 0 12px rgba(212,175,55,.35);}
    .vn-opt.danger:active{box-shadow:inset 0 0 14px rgba(192,48,48,.45);}
    .vn-opt.danger:hover{border-color:#b52626;color:#ff7a7a;box-shadow:0 0 12px rgba(180,30,30,.35);}
    /* 键盘可达：选项是游戏的主交互，此前只有 Agent 系按钮有焦点环，
     * 靠 Tab 走的人在正文里完全看不出焦点在哪一项。 */
    .vn-opt:focus-visible{
      outline: 2px solid #64dfdf;
      outline-offset: 2px;
      border-color: #c8a24d;
      color: #f4e8c8;
    }

    /* ⏱️ 限时抉择倒计时条 */
    #timed-wrap{margin-bottom:2px;flex-shrink:0;}
    #timed-label{font-size:12px;color:#ff9a5a;letter-spacing:.08em;margin-bottom:4px;text-shadow:0 0 8px rgba(255,80,0,.4);}
    #timed-num{color:#ffd27a;font-weight:bold;margin-left:6px;}
    #timed-bar{height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;border:1px solid #4a3f28;}
    #timed-fill{height:100%;width:100%;background:linear-gradient(90deg,#d4af37,#ff5533);transition:width .1s linear;}
    #timed-fill.critical{animation:critBlink .3s infinite alternate;}
    @keyframes critBlink{from{filter:brightness(1)}to{filter:brightness(2.2)}}

    /* 死亡/通关重置键特效 */
    .vn-opt.ultimate-restart {
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      background: linear-gradient(180deg, #420a0a, #1a0505) !important;
      border: 2px solid #ff3333 !important;
      color: #ffcccc !important;
      padding: 18px !important;
      border-radius: 12px !important;
      box-shadow: 0 0 30px rgba(255, 51, 51, 0.6) !important;
      animation: bloodPulse 1.6s infinite alternate;
    }
    @keyframes bloodPulse {
      0% { box-shadow: 0 0 15px rgba(255, 51, 51, 0.4); border-color: #cc2222; }
      100% { box-shadow: 0 0 35px rgba(255, 51, 51, 0.8); border-color: #ff5555; }
    }

    /* 🗺️ 剧情分支树/回溯节点排版 */
    .tree-title {
      font-size: 12px;
      color: #8a7d60;
      letter-spacing: 0.1em;
      margin-top: 15px;
      margin-bottom: 5px;
      text-transform: uppercase;
      border-bottom: 1px dashed #4a3f28;
      padding-bottom: 3px;
    }
    .tree-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 10px;
    }
    .tree-btn {
      background: rgba(10, 8, 5, 0.6);
      border: 1px solid #4a3f28;
      color: #a89670;
      padding: 6px 10px;
      font-size: 11px;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
      transition: 0.2s;
    }
    .tree-btn:hover {
      border-color: #c8b488;
      color: #fff;
      background: rgba(40, 30, 20, 0.8);
    }

    /* 🎬 片尾字幕统计 */
    .credits-title{text-align:center;color:#8a7d60;font-size:12px;letter-spacing:.4em;margin-bottom:12px;}
    .credits-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
    .credit-item{background:rgba(10,8,5,.6);border:1px solid #4a3f28;border-radius:6px;padding:10px;text-align:center;font-size:12px;color:#a89670;}
    .credit-item b{display:block;font-size:20px;color:#e8c878;margin-bottom:2px;}

    #vn-auto{position:absolute;right:30px;bottom:100%;margin-bottom:6px;display:flex;gap:8px;}
    .vn-mini{font-size:11px;color:#a89670;border:1px solid #4a3f28;border-radius:14px;padding:4px 14px;background:rgba(0,0,0,.5);cursor:pointer;}

    /* 🌫️ 漫天灰烬飘散动效 🌫️ */
    #ash-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
    }
    .ash-particle {
      position: absolute;
      background: rgba(50, 45, 40, 0.85);
      border-radius: 2px;
      box-shadow: 0 0 3px rgba(0,0,0,0.6);
      pointer-events: none;
      animation: floatUpAsh 5s linear infinite;
    }
    @keyframes floatUpAsh {
      0% {
        transform: translateY(105vh) translateX(0) rotate(0deg);
        opacity: 0;
      }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% {
        transform: translateY(-5vh) translateX(120px) rotate(360deg);
        opacity: 0;
      }
    }

    /* 死亡爆发层：只覆盖场景，不盖住对话/按钮 UI（UI 层 z-index:40） */
    #vn-death{position:absolute;inset:0;z-index:20;opacity:0;pointer-events:none;transition:opacity .1s;
      background:radial-gradient(circle at 50% 42%,rgba(170,15,15,.28),rgba(15,0,0,.88) 62%,rgba(8,0,0,.55) 100%);}
    #vn-death.on{opacity:1;animation:vns .5s;}
    @keyframes vns{0%,100%{transform:translate(0,0)}25%{transform:translate(-4px,2px)}50%{transform:translate(3px,-3px)}75%{transform:translate(-2px,-1px)}}

    /* 📜 守则本 - 竖排黄纸符箓弹窗 */
    .modal-overlay{
      position:fixed;
      inset:0;
      z-index:200;
      background:rgba(0,0,0,.85);
      backdrop-filter:blur(8px);
      display:none;
      justify-content:center;
      align-items:center;
      font-family: var(--font-zh);
    }
    .modal-overlay.open{display:flex;}
    .modal-content{
      width:92%;
      max-width:620px;
      background-color:#dcd1ba;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(128,17,31,.06) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(26,56,33,.05) 0%, transparent 60%),
        linear-gradient(rgba(220,209,186,.96), rgba(220,209,186,.99));
      border:3px double #80111f;
      box-shadow:0 20px 60px rgba(0,0,0,.95), inset 0 0 35px rgba(128,17,31,.08);
      padding:26px;
      color:#261611;
      animation:paperIn .4s cubic-bezier(.19,1,.22,1);
    }
    @keyframes paperIn{from{transform:scale(.92) rotate(-1deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
    .atlas-content{ max-width: 560px; }
    #ending-atlas-grid{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 8px;
    }
    .ending-card{
      border: 1px solid rgba(128,17,31,.35);
      background: rgba(255,255,255,.28);
      padding: 10px 12px;
      min-height: 78px;
    }
    .ending-card.lock{
      opacity: .48;
      filter: grayscale(1);
    }
    .ending-card .ec-name{
      font-weight: 900;
      letter-spacing: .12em;
      color: #80111f;
      margin-bottom: 4px;
    }
    .ending-card .ec-desc{
      font-size: 12px;
      line-height: 1.5;
      color: #3a2418;
    }
    .ending-card.lock .ec-name{ color: #5a4030; }
    .ending-card.lock .ec-desc{ color: #6a5648; }
    .atlas-group{ margin-bottom: 12px; }
    .atlas-group-title{
      font-size: 12px;
      letter-spacing: .18em;
      color: #80111f;
      margin: 4px 0 8px;
      border-bottom: 1px dashed rgba(128,17,31,.35);
      padding-bottom: 4px;
    }
    .atlas-group-grid{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    #achievement-atlas-foot{
      text-align: center;
      font-size: 12px;
      color: #5a4030;
      margin: 8px 0 4px;
    }
    .modal-title{
      color:#80111f;
      font-size:1.25rem;
      font-weight:900;
      text-align:center;
      letter-spacing:.35em;
      border-bottom:2px solid #80111f;
      padding-bottom:12px;
      margin-bottom:16px;
    }
    .modal-body{
      writing-mode:vertical-rl;
      text-orientation:mixed;
      display:flex;
      flex-direction:row;
      gap:18px;
      height:300px;
      max-height:52vh;
      overflow-x:auto;
      overflow-y:hidden;
      padding:10px 14px;
      border:1px dashed rgba(128,17,31,.25);
      margin-bottom:14px;
      background:rgba(0,0,0,.02);
    }
    .modal-body::-webkit-scrollbar{height:6px;}
    .modal-body::-webkit-scrollbar-track{background:rgba(38,22,17,.05);}
    .modal-body::-webkit-scrollbar-thumb{background:rgba(128,17,31,.4);border-radius:3px;}
    .rule-entry{
      writing-mode:vertical-rl;
      border-left:2px dashed rgba(128,17,31,.3);
      padding:0 14px;
      height:100%;
      flex-shrink:0;
      font-size:14px;
    }
    .rule-entry:last-child{border-left:none;}
    .rule-entry h3{
      font-size:15px;
      font-weight:700;
      color:#80111f;
      margin-left:10px;
      letter-spacing:2px;
      line-height:1.2;
    }
    .rule-entry p{line-height:1.9;letter-spacing:1px;margin:0;}
    .rule-entry.locked{color:rgba(38,22,17,.45);}
    .rule-censor{
      display:inline-block;
      width:1.15em;
      height:4.6em;
      background:#261611;
      border:1px solid #80111f;
      vertical-align:middle;
      margin:2px 0;
    }
    #rulebook-items{display:flex;gap:10px;justify-content:center;margin-bottom:14px;flex-wrap:wrap;}
    .item-chip{
      font-size:12px;
      padding:4px 14px;
      border:1px solid rgba(128,17,31,.4);
      border-radius:14px;
      color:rgba(38,22,17,.35);
      letter-spacing:.05em;
    }
    .item-chip.on{color:#261611;background:rgba(128,17,31,.12);font-weight:bold;}
    .modal-actions{display:flex;justify-content:center;}
    #rulebook-close{
      background:#1a1206;
      border:1px solid #80111f;
      color:#d8b24d;
      padding:8px 34px;
      border-radius:20px;
      cursor:pointer;
      font-family:inherit;
      font-size:14px;
      letter-spacing:.25em;
      transition:.2s;
    }
    #rulebook-close:hover{background:#2a1c08;box-shadow:0 0 12px rgba(216,178,77,.25);}

    /* ==========================================
       中式恐怖 UI 重构 + 死亡专属演出层
       ========================================== */

    /* 欢迎屏对联 */
    .couplet{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      writing-mode:vertical-rl;
      letter-spacing:.5em;
      font-size:22px;
      font-weight:900;
      color:#8b1a1a;
      background:linear-gradient(180deg,#d8c49a,#c9b184);
      padding:22px 8px;
      box-shadow:0 6px 24px rgba(0,0,0,.7), inset 0 0 12px rgba(122,26,26,.25);
      border:1px solid rgba(122,26,26,.6);
      animation:coupletSway 5s ease-in-out infinite;
    }
    .couplet-l{left:8%;}
    .couplet-r{right:8%;animation-delay:1.2s;}
    @keyframes coupletSway{0%,100%{transform:translateY(-50%) rotate(-1deg);}50%{transform:translateY(-52%) rotate(1deg);}}
    .welcome-subtitle{color:#6a5d45;font-size:13px;letter-spacing:.5em;margin:6px 0 18px;}
    .welcome-title{animation:titleFlicker 3.2s infinite;}
    @keyframes titleFlicker{0%,92%,94%,96%,100%{opacity:1;}93%{opacity:.3;}95%{opacity:.55;}}

    /* 对话框：墨底朱砂双线 + 印章角 */
    #vn-panel{
      background:linear-gradient(180deg,rgba(12,9,7,.95),rgba(5,4,3,.98)) !important;
      border:2px solid #7a1f1f !important;
      border-radius:3px !important;
      outline:1px solid rgba(216,178,77,.22);
      outline-offset:3px;
      box-shadow:0 15px 50px rgba(0,0,0,.92), inset 0 0 40px rgba(122,31,31,.1), 0 0 24px rgba(122,31,31,.16) !important;
      /* 给角落印章留空，避免压住剧情字 / 选项 */
      padding-top: 28px !important;
      padding-left: 28px !important;
      padding-right: 28px !important;
    }
    #vn-panel::before,#vn-panel::after{
      content:'封';
      position:absolute;
      top:6px;
      font-size:9px;
      color:#a83226;
      border:1px solid #a83226;
      padding:1px 2px;
      line-height:1;
      opacity:.75;
      transform:rotate(-6deg);
      z-index: 1;
      pointer-events: none;
    }
    #vn-panel::before{left:8px;}
    #vn-panel::after{content:'敕';right:8px;transform:rotate(5deg);}

    /* 名字标签：朱砂匾额（不用 clip-path 裁字，尖角改伪元素） */
    #vn-name{
      background:linear-gradient(180deg,#6d1414,#3d0a0a) !important;
      border:1px solid rgba(168,50,38,.65) !important;
      color:#f0d6c0 !important;
      border-radius:2px 2px 0 0 !important;
      clip-path: none !important; /* 关键：旧 clip-path 会切掉场景名 */
      padding:7px 16px 9px !important;
      letter-spacing:.14em !important;
      box-shadow:0 -3px 12px rgba(0,0,0,.55) !important;
      margin-bottom:-2px !important;
      text-overflow: clip;
      overflow: visible !important;
    }
    /* 符幡尖角装饰，不影响文字区域 */
    #vn-name::after{
      content:'';
      position:absolute;
      left:50%;
      bottom:-7px;
      transform:translateX(-50%);
      width:0; height:0;
      border-left:7px solid transparent;
      border-right:7px solid transparent;
      border-top:7px solid #3d0a0a;
      pointer-events:none;
    }

    /* 选项：灵位牌式 */
    .vn-opt{
      background:linear-gradient(90deg,rgba(26,18,12,.92),rgba(13,9,6,.92)) !important;
      border:1px solid #452c20 !important;
      border-left:3px solid #7a1f1f !important;
      border-radius:0 6px 6px 0 !important;
      color:#d0bd92 !important;
    }
    .vn-opt:hover{
      border-color:#a83226 !important;
      border-left-color:#d4af37 !important;
      color:#f4e8c8 !important;
      box-shadow:inset 0 0 22px rgba(122,31,31,.28), 0 0 12px rgba(168,50,38,.3) !important;
      transform:translateX(4px);
    }
    .vn-opt.danger:hover{border-color:#b52626 !important;color:#ff7a7a !important;}

    /* 顶部状态：黑底横匾 */
    #vn-status{
      background:linear-gradient(180deg,rgba(22,9,9,.88),rgba(10,5,5,.88));
      border:1px solid rgba(122,31,31,.55);
      padding:6px 14px;
      border-radius:2px;
      box-shadow:0 4px 18px rgba(0,0,0,.6);
    }
    #vn-skip{border-color:#7a1f1f !important;color:#d6b48a !important;border-radius:2px !important;}

    /* 黄符贴纸（随风微摆） */
    #talisman{
      position:absolute;
      top:-36px;
      right:38px;
      z-index:12;
      writing-mode:vertical-rl;
      background:linear-gradient(180deg,#dcb85f,#c29434);
      color:#8b1a1a;
      font-weight:900;
      font-size:12px;
      letter-spacing:3px;
      padding:10px 5px;
      border-radius:0 0 3px 3px;
      box-shadow:0 3px 10px rgba(0,0,0,.65);
      transform-origin:top center;
      animation:talismanSway 4.2s ease-in-out infinite;
      pointer-events:none;
    }
    @keyframes talismanSway{0%,100%{transform:rotate(2.5deg);}50%{transform:rotate(-2.5deg);}}

    /* ===== 死亡专属演出层 ===== */
    #death-tint{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;transition:opacity 1.2s;}
    #death-tint.on{opacity:1;}

    /* 碎裂车窗 */
    #vn-crack{position:absolute;inset:0;z-index:6;pointer-events:none;opacity:0;transition:opacity .2s;
      background:
        repeating-conic-gradient(from 10deg at 68% 42%, transparent 0deg 11deg, rgba(255,255,255,.22) 11deg 11.6deg),
        repeating-conic-gradient(from 70deg at 30% 60%, transparent 0deg 16deg, rgba(255,255,255,.14) 16deg 16.5deg);
      mask-image:radial-gradient(circle at 60% 50%, black 0%, transparent 72%);
      -webkit-mask-image:radial-gradient(circle at 60% 50%, black 0%, transparent 72%);}
    #vn-crack.on{opacity:.9;animation:crackShake .12s 6;}
    @keyframes crackShake{0%,100%{transform:translate(0,0);}50%{transform:translate(2px,-1px);}}

    /* 手电筒光圈（逐渐收缩） */
    #vn-flashlight{position:absolute;inset:0;z-index:8;pointer-events:none;opacity:0;transition:opacity .3s;
      background:radial-gradient(circle at 50% 55%, transparent 0, transparent 120px, rgba(0,0,0,.985) 240px);}
    #vn-flashlight.on{opacity:1;animation:torchShrink 7s ease-in forwards;}
    @keyframes torchShrink{
      0%{background:radial-gradient(circle at 50% 55%, transparent 0, transparent 150px, rgba(0,0,0,.985) 280px);}
      60%{background:radial-gradient(circle at 50% 55%, transparent 0, transparent 70px, rgba(0,0,0,.985) 150px);}
      100%{background:radial-gradient(circle at 50% 55%, transparent 0, transparent 24px, rgba(0,0,0,.99) 70px);}
    }

    /* 群眼浮现 */
    #vn-eyes-swarm{position:absolute;inset:0;z-index:7;pointer-events:none;}
    .eye-pair{position:absolute;display:flex;gap:10px;opacity:0;transition:opacity 1.6s;}
    .eye-pair i{width:6px;height:8px;border-radius:50%;background:radial-gradient(circle,#ffdddd,#cc1a1a 60%,transparent);box-shadow:0 0 7px 2px rgba(255,40,40,.5);animation:eyeBlink 4s infinite;}
    #vn-eyes-swarm.on .eye-pair{opacity:.85;}

    /* 隧道流动（转场场景） */
    #vn-tunnel{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity 1.5s;
      background:repeating-linear-gradient(90deg, #05060a 0 60px, #0a0d14 60px 62px, #05060a 62px 124px);
      background-size:220px 100%;
      animation:mrMove 1.1s linear infinite;}
    #vn-tunnel.on{opacity:.45;}
    @keyframes mrMove{from{background-position:0 0;}to{background-position:-220px 0;}}

    /* 顶灯光晕（车厢场景） */
    #vn-light{position:absolute;top:0;left:50%;transform:translateX(-50%);width:55%;height:34%;z-index:3;pointer-events:none;opacity:0;transition:opacity 1.5s;
      background:radial-gradient(ellipse at center top, rgba(200,165,95,.22), transparent 70%);
      animation:mrFlick 6s infinite;}
    #vn-light.on{opacity:1;}
    @keyframes mrFlick{0%,100%,47%,51%,82%,84%{opacity:1;}48%{opacity:.25;}50%{opacity:.3;}83%{opacity:.4;}}

    /* 死亡频闪变体 */
    #vn-scene.strobe-red{animation:trainVibrate 6s infinite ease-in-out,strobeRed .5s steps(2) infinite;}
    @keyframes strobeRed{0%,100%{filter:none;}50%{filter:brightness(1.7) saturate(2.2) hue-rotate(-30deg);}}
    #vn-scene.strobe-green{animation:trainVibrate 6s infinite ease-in-out,strobeGreen .55s steps(2) infinite;}
    @keyframes strobeGreen{0%,100%{filter:none;}50%{filter:brightness(1.6) saturate(2) hue-rotate(85deg);}}
    #vn-scene.strobe-blue{animation:trainVibrate 6s infinite ease-in-out,strobeBlue .45s steps(2) infinite;}
    @keyframes strobeBlue{0%,100%{filter:none;}50%{filter:brightness(1.8) saturate(1.6) hue-rotate(190deg);}}
    #vn-scene.strobe-white{animation:trainVibrate 6s infinite ease-in-out,strobeWhite .6s steps(2) infinite;}
    @keyframes strobeWhite{0%,100%{filter:none;}50%{filter:invert(.85) brightness(1.2);}}

    /* 心神俱灭：画面倾斜飘摇 */
    #vn-scene-wrap.death-tilt{animation:deathTilt 9s ease-in-out infinite !important;}
    @keyframes deathTilt{0%,100%{transform:rotate(-1.6deg) scale(1.08);}50%{transform:rotate(1.6deg) scale(1.1);}}

    /* 冥火绿粒子 / 血雨粒子 */
    .vn-p.hellfire{background:rgba(80,255,140,.65);box-shadow:0 0 7px rgba(60,230,120,.7);}
    .vn-p.rain{top:-20px;bottom:auto;border-radius:2px;background:linear-gradient(180deg, rgba(180,20,25,.1), rgba(160,15,20,.85));animation:pFall linear forwards;}
    @keyframes pFall{0%{transform:translateY(0);opacity:0;}10%{opacity:.9;}100%{transform:translateY(108vh);opacity:.85;}}

    /* 🔧 UI 修复：面板印章定位锚点（否则伪元素跑位到容器角落被符幡遮挡） */
    #vn-panel{position:relative;}

    /* 🎒 道具栏（支线触发物品）—— 与顶部/侧栏同层，避免被灯光闪烁/死亡层遮挡 */
    #vn-inventory{position:absolute;top:85px;right:30px;z-index:40;display:flex;flex-direction:column;gap:8px;}
    .inv-slot{width:40px;height:40px;border-radius:9px;overflow:hidden;opacity:.26;filter:grayscale(1);transition:all .3s;border:1px solid transparent;}
    .inv-slot img{width:100%;height:100%;display:block;}
    .inv-slot.owned{opacity:1;filter:none;cursor:pointer;border-color:rgba(216,178,77,.45);box-shadow:0 0 10px rgba(0,0,0,.6);}
    .inv-slot.owned:hover{transform:scale(1.12);border-color:#d4af37;}
    .inv-slot.new{animation:invPulse .6s 4;}
    @keyframes invPulse{0%,100%{box-shadow:0 0 6px rgba(216,178,77,.3);}50%{box-shadow:0 0 24px rgba(216,178,77,.95);}}
    #item-tip{position:absolute;top:85px;right:84px;z-index:41;width:190px;background:linear-gradient(180deg,#e0d2ae,#d3c29a);border:1.5px solid #7a1f1f;padding:10px 12px;color:#2a1a12;font-size:12px;line-height:1.6;box-shadow:0 8px 24px rgba(0,0,0,.75);opacity:0;pointer-events:none;transform:translateX(8px);transition:all .25s;}
    #item-tip.show{opacity:1;transform:translateX(0);}
    #item-tip .tip-name{color:#8b1a1a;font-weight:900;letter-spacing:.1em;margin-bottom:4px;border-bottom:1px dashed rgba(122,31,31,.4);padding-bottom:3px;}

    /* 📱 移动端竖屏优先 · 完整可见布局 📱 */
    @media (max-width: 768px) {
      #vn-top {
        padding: max(8px, env(safe-area-inset-top)) 10px 6px;
        flex-wrap: wrap;
        row-gap: 6px;
        align-items: flex-start;
        gap: 8px;
      }
      #vn-status {
        font-size: 10px;
        padding: 4px 8px;
        flex-wrap: wrap;
        max-width: calc(100% - 88px);
        row-gap: 3px;
        column-gap: 4px;
      }
      #sanity-bar { width: 40px; }
      #sanity-wrap { margin-left: 6px; font-size: 10px; }
      #vn-skip {
        font-size: 10px;
        padding: 5px 10px;
        flex-shrink: 0;
        white-space: nowrap;
      }
      #vn-clock { font-size: 10px; margin-left: 6px; }
      #vn-side {
        left: 10px;
        top: auto;
        bottom: calc(48dvh + 12px);
        flex-direction: row;
        gap: 8px;
        z-index: 40;
      }
      .vn-ic {
        width: 34px; height: 34px; font-size: 15px;
        border-radius: 6px;
        background: rgba(10,8,5,.78);
      }

      /* 对话框：固定在底部安全区，内部双滚动，选项不被裁切 */
      #vn-box {
        left: 8px;
        right: 8px;
        bottom: max(6px, env(safe-area-inset-bottom));
        height: auto;
        max-height: min(52dvh, 420px);
        min-height: min(38dvh, 280px);
        display: flex;
        flex-direction: column;
        overflow: visible; /* 场景名标签完整显示 */
      }
      #vn-name {
        font-size: 11px;
        padding: 5px 12px 7px !important;
        margin-left: 6px;
        margin-right: 4px;
        letter-spacing: .08em !important;
        max-width: calc(100% - 24px);
        white-space: nowrap;
        overflow: hidden !important; /* 过长时安全截断，但不 clip-path 乱切 */
        text-overflow: ellipsis;
        flex-shrink: 0;
      }
      #vn-name::after {
        border-left-width: 5px;
        border-right-width: 5px;
        border-top-width: 5px;
        bottom: -5px;
      }
      #vn-panel {
        flex: 1 1 auto;
        min-height: 0;
        flex-direction: column;
        gap: 10px;
        /* 上/左/右为印章与音频钮留空，避免左上角 UI 被挡 */
        padding: 26px 14px 12px 14px !important;
        overflow: hidden;
        position: relative;
      }
      #vn-panel::before, #vn-panel::after {
        top: 5px;
        font-size: 8px;
        padding: 1px 2px;
        opacity: .65;
      }
      #vn-auto {
        position: absolute;
        right: 10px;
        top: 4px;
        bottom: auto;
        margin: 0;
        z-index: 3;
      }
      .vn-mini { font-size: 10px; padding: 3px 10px; }
      #vn-line {
        font-size: 13px;
        line-height: 1.65;
        flex: 0 1 auto;
        max-height: 42%;
        min-height: 64px;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding-right: 6px;
        padding-top: 2px;
        /* 避开左上角「封」印 */
        padding-left: 2px;
      }
      #vn-opts {
        flex: 1 1 auto;
        min-height: 72px;
        max-height: 58%;
        gap: 7px;
        padding-right: 2px;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
      }
      .vn-opt {
        padding: 10px 12px;
        font-size: 12px;
        line-height: 1.35;
        min-height: 40px;
        -webkit-tap-highlight-color: transparent;
      }
      .vn-opt.ultimate-restart { padding: 12px !important; font-size: 13px !important; }
      .tree-grid { grid-template-columns: 1fr; }
      .credits-stats { grid-template-columns: 1fr 1fr; gap: 6px; }
      .credit-item { padding: 8px 6px; font-size: 11px; }
      .credit-item b { font-size: 16px; }
      #type-hint { right: 12px; bottom: 4px; font-size: 9px; }

      .welcome-title { font-size: 22px !important; }
      .welcome-subtitle { font-size: 11px; letter-spacing: .3em; }
      .welcome-desc { font-size: 12px !important; margin-bottom: 22px !important; max-width: 92vw; }
      #btn-enter { padding: 12px 28px !important; font-size: 14px !important; width: min(86vw, 320px); }

      #mr-face { width: 100px; height: 130px; }
      .modal-body { height: 220px; writing-mode: horizontal-tb; flex-direction: column; overflow-y: auto; overflow-x: hidden; }
      .rule-entry { writing-mode: horizontal-tb; border-left: none; border-bottom: 1px dashed rgba(128,17,31,.3); padding: 8px 0; height: auto; }
      .rule-entry h3 { margin: 0 0 4px; }
      .couplet { display: none; }
      #talisman { display: none; }
      #dark-eyes { left: 52%; top: 32%; }

      /* 道具栏：仅显示已拥有，横条置于对话框上方，避免遮挡 */
      #vn-inventory {
        top: auto;
        bottom: calc(min(52dvh, 420px) + 14px);
        right: 10px;
        left: auto;
        flex-direction: row;
        gap: 5px;
        max-width: 55vw;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .inv-slot { width: 30px; height: 30px; border-radius: 6px; }
      .inv-slot:not(.owned) { display: none; }
      #item-tip {
        top: auto;
        bottom: calc(min(52dvh, 420px) + 50px);
        right: 10px;
        width: min(70vw, 220px);
      }
      #achievement-toast { max-width: 92vw; padding: 10px 14px; top: max(12px, env(safe-area-inset-top)); }
      .modal-content { max-height: min(88dvh, 640px); overflow-y: auto; padding: 16px; width: 94%; }
      #ending-atlas-grid { grid-template-columns: 1fr; }
      .atlas-group-grid { grid-template-columns: 1fr; }
      #vn-vig { box-shadow: inset 0 0 100px 36px #000; }
      #red-wrap { height: 40%; bottom: 42%; }
    }

    /* 极窄竖屏（小屏手机） */
    @media (max-width: 380px) {
      #vn-box { max-height: 56dvh; min-height: 40dvh; }
      #vn-line { font-size: 12px; max-height: 38%; }
      .vn-opt { font-size: 11.5px; padding: 9px 10px; }
      #vn-status { font-size: 9px; max-width: 68%; }
      #vn-skip { font-size: 9px; padding: 4px 8px; }
    }

    /* 矮屏 PC/笔记本 */
    @media (max-height: 700px) and (min-width: 769px) {
      #vn-inventory { gap: 5px; }
      .inv-slot { width: 34px; height: 34px; }
      #vn-box { height: 42%; }
    }
    /* 横屏手机（矮视口） */
    @media (max-height: 480px) {
      #vn-box {
        max-height: 72dvh;
        min-height: 58dvh;
        height: auto;
      }
      #vn-line { font-size: 12px; max-height: 36%; min-height: 48px; }

    /* 安全区通用 */

    /* ===== 🎒 关键道具特写 ===== */
    #item-showcase{
      position:absolute; inset:0; z-index:42;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:radial-gradient(circle at 50% 42%, rgba(40,18,10,.55), rgba(0,0,0,.92));
      opacity:0; pointer-events:none;
      transition:opacity .45s ease;
    }
    #item-showcase.on{ opacity:1; pointer-events:none; }
    #item-showcase .isc-glow{
      position:absolute; width:220px; height:220px; border-radius:50%;
      background:radial-gradient(circle, rgba(212,175,55,.35), transparent 70%);
      filter:blur(6px);
      animation:iscPulse 1.6s ease-in-out infinite alternate;
    }
    @keyframes iscPulse{ from{ transform:scale(.9); opacity:.6;} to{ transform:scale(1.15); opacity:1;} }
    #isc-img{
      width:min(42vw, 180px); height:min(42vw, 180px);
      object-fit:contain;
      border:2px solid #d4af37;
      border-radius:14px;
      background:linear-gradient(180deg,#1a1208,#0a0704);
      box-shadow:0 0 40px rgba(212,175,55,.45), 0 12px 40px rgba(0,0,0,.8);
      transform:scale(.4) translateY(30px);
      opacity:0;
      transition:transform .7s cubic-bezier(.16,1.2,.3,1), opacity .5s ease;
      z-index:1;
    }
    #item-showcase.on #isc-img{ transform:scale(1) translateY(0); opacity:1; }
    #isc-name{
      margin-top:18px; color:#f0d78c; font-size:18px; font-weight:900;
      letter-spacing:.35em; text-shadow:0 0 12px rgba(212,175,55,.5);
      z-index:1; opacity:0; transform:translateY(10px);
      transition:all .5s .2s ease;
    }
    #item-showcase.on #isc-name{ opacity:1; transform:none; }
    #isc-desc{
      margin-top:8px; max-width:min(80vw, 360px); text-align:center;
      color:#c9b184; font-size:13px; line-height:1.7; letter-spacing:.06em;
      z-index:1; opacity:0; transition:opacity .5s .35s ease;
    }
    #item-showcase.on #isc-desc{ opacity:1; }
    #isc-sanity{
      margin-top:12px; color:#7dcea0; font-size:12px; letter-spacing:.12em;
      z-index:1; opacity:0; transition:opacity .4s .45s ease;
    }
    #item-showcase.on #isc-sanity{ opacity:1; }
    #vn-scene.item-zoom{
      animation:itemBgZoom 2.4s ease-out forwards !important;
    }
    @keyframes itemBgZoom{
      0%{ transform:scale(1); filter:brightness(1); }
      35%{ transform:scale(1.22); filter:brightness(1.15) contrast(1.1); }
      100%{ transform:scale(1.08); filter:brightness(.85) contrast(1.05); }
    }

    /* 心神浮动提示 */
    #sanity-toast{

  <!-- 🏷️ 版本水印（由脚本填文案，区分访客/展板/评审） -->

  <!-- ⏳ 展板闲置回收提示 -->
  <div id="idle-notice">
    <div>
      末班车已驶离。<br>
      <b>正在为下一位乘客重置……</b>
