      /** 统一调用入口（支持参数，体现可组合性） */
      invoke(skillId, args) {
        const id = (skillId || '').toLowerCase();
        try {
          if (id === 'rulebook' || id === 'rules') return this.rulebook(args);
          if (id === 'inventory' || id === 'items') return this.inventory(args);
          if (id === 'sanity' || id === 'hp') return this.sanity(args);
          if (id === 'branch_hint' || id === 'hint') return this.branch_hint(args);
          if (id === 'risk_assess' || id === 'risk') return this.risk_assess(args);
          if (id === 'item_advice' || id === 'item') return this.item_advice(args);
          if (id === 'ending_check' || id === 'ending') return this.ending_check(args);
          if (id === 'scene_narrate' || id === 'narrate') return this.scene_narrate(args);
          if (id === 'status') return this.status(args);
          if (id === 'help' || id === 'skills') return this.help(args);
          return { ok: false, skill: id, text: `未知 Skill：${skillId}。请发送「帮助」查看列表。` };
        } catch (e) {
          return { ok: false, skill: id, text: `Skill「${id}」执行失败：${e.message || e}` };

    const MidnightAgent = {
      name: '检票口·守则智能体',
      version: '1.2.1',
      history: [],
      proactiveCooldown: {},

      /** 意图路由 → Skill（可解析简单参数） */
      route(userText) {
        const t = (userText || '').trim();
        if (!t) return { skill: 'help', confidence: 1, args: {} };

        const rules = [
          { skill: 'help', re: /帮助|怎么用|你会什么|技能|skill|help/i },
          { skill: 'ending_check', re: /真结局|结局|还差|缺什么|能通关|ending/i },
          { skill: 'risk_assess', re: /危险|风险|评估|会不会死|risk/i },
          { skill: 'item_advice', re: /蜡烛|工牌|纸条|红绳|碎镜|冥票|道具有什么用|item/i },
          { skill: 'rulebook', re: /规则|守则|条例|禁忌|rule/i },
          { skill: 'inventory', re: /道具|物品|遗物|背包|inventory/i },
          { skill: 'sanity', re: /阳气|心神|sanity|血量|还清醒|疯/i },
          { skill: 'branch_hint', re: /提示|怎么选|怎么办|下一步|求生|hint|抉择/i },
          { skill: 'scene_narrate', re: /旁白|描述|这里是哪|场景|氛围|narrat/i },
          { skill: 'status', re: /进度|死亡|成就|状态|黑匣|status/i }
        ];

        let args = {};
        // 道具参数解析
        if (/蜡烛|白烛/.test(t)) args.itemId = 'has_candle';
        else if (/工牌/.test(t)) args.itemId = 'has_badge';
        else if (/纸条/.test(t)) args.itemId = 'has_note';
        else if (/红绳|红绳结/.test(t)) args.itemId = 'has_charm';
        else if (/碎镜|镜片/.test(t)) args.itemId = 'has_shard';
        else if (/冥票|残票/.test(t)) args.itemId = 'has_ticket';

        for (let i = 0; i < rules.length; i++) {
          if (rules[i].re.test(t)) {
            return { skill: rules[i].skill, confidence: 0.9, args };
          }
        }
        return { skill: 'branch_hint', confidence: 0.5, fallback: true, args };
      },

      ask(userText) {
        const route = this.route(userText);
        // 可组合：结局诊断 = ending_check；若问「危险且结局」可二次调用
        let result = MidnightSkills.invoke(route.skill, route.args || {});
        let combo = null;
        if (/真结局|结局/.test(userText || '') && /危险|风险|阳气/.test(userText || '')) {
          combo = MidnightSkills.invoke('risk_assess');
        }

        const trace = {
          agent: this.name,
          input: userText,
          intent: route.skill,
          skill: route.skill,
          confidence: route.confidence,
          args: route.args || {},
          at: currentScene || '（未发车）',
          ts: Date.now()
        };
        this.history.push(trace);
        if (this.history.length > 50) this.history.shift();

        let reply = result.text;
        if (combo) reply += '\n\n—— 组合调用 risk_assess ——\n' + combo.text;
        if (route.fallback) {
          reply =
            '（意图未精确匹配，已调用 branch_hint）\n' +
            reply +
            '\n\n也可问：结局差什么 / 现在危险吗 / 蜡烛有什么用';
        }
        return { reply, skillResult: result, trace, combo, route };
      },

      /** 主动提示（节流，避免刷屏） */
      proactive(kind, message, skillId) {
        if (demoRunning) return; // Demo 自带话术
        const now = Date.now();
        const cd = this.proactiveCooldown[kind] || 0;
        if (now - cd < 12000) return; // 同类 12s 冷却
        this.proactiveCooldown[kind] = now;
        if (typeof agentProactivePush === 'function') {
          agentProactivePush(message, skillId || kind);
        }
      }
    };

      if (!trace) return '';
      return (
        `命中意图：${trace.intent || trace.skill || '—'}  ·  ` +
        `调用技能：${trace.skill || '—'}  ·  ` +
        `场景：${trace.at || '—'}  ·  ` +
        `信心：${trace.confidence != null ? trace.confidence : '—'}`
      );
    }

    function agentAppend(role, who, text, trace) {
      if (!agentLog) return;
      const div = document.createElement('div');
      div.className = 'ag-msg ' + role;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      div.innerHTML = `<div class="who"></div>`;
      div.querySelector('.who').textContent = who;
      div.appendChild(bubble);
      if (trace) {
        const tr = document.createElement('div');
        tr.className = 'trace';
        tr.textContent = formatTrace(trace);
        div.appendChild(tr);
      }
      agentLog.appendChild(div);
      agentLog.scrollTop = agentLog.scrollHeight;
    }

    function agentAppendDemoStep(title, caps, body) {
      if (!agentLog) return;
      const div = document.createElement('div');
      div.className = 'ag-msg demo-step';
      const tags = (caps || []).map(c => `<span class="demo-cap-tag">${c}</span>`).join('');
      div.innerHTML =
        `<div class="who">演示步骤 · Specs 锚点</div>` +
        `<div class="bubble"><div style="margin-bottom:4px;font-weight:700;color:#e8c878;">${title}</div>` +
        `<div style="margin-bottom:6px;">${tags}</div>` +
        `<div></div></div>`;
      div.querySelector('.bubble div:last-child').textContent = body || '';
      agentLog.appendChild(div);
      agentLog.scrollTop = agentLog.scrollHeight;
    }

    function agentProactivePush(message, skillHint) {
      // 面板已开时直接追加；未开时只闪烁角标，不遮挡正文
      const isOpen = agentPanel && agentPanel.classList.contains('open');
      if (!isOpen) {
        // 缓存最近一条主动消息，用户打开面板时可见
        if (!agentLog.dataset.greeted) {
          // 面板从未打开过——不自动展开，仅闪烁侧栏按钮
          const btn = document.getElementById('btn-agent');
          if (btn) {
            btn.classList.add('agent-badge-pulse');
            btn.dataset.pendingMsg = message;
          }
          return;
        }
        // 面板之前打开过——追加到日志但不自动弹出
      }
      agentAppend(
        'proactive',
        '主动护航 · ' + MidnightAgent.name,
        message + (skillHint ? `\n（可点技能「${skillHint}」深入）` : ''),
        {
          intent: 'proactive',
          skill: skillHint || 'proactive',
          confidence: 0.85,
          at: currentScene || '—'
        }
      );
      if (!isOpen) {
        const btn = document.getElementById('btn-agent');
        if (btn) btn.classList.add('agent-badge-pulse');
      }
    }

      if (!agentPanel) return;
      agentPanel.classList.add('open');
      if (agentLog && !agentLog.dataset.greeted) {
        agentLog.dataset.greeted = '1';
        agentAppend('agent', MidnightAgent.name,
          '检票口在线。我不只是查询器——会在你阳气过低、拿到关键遗物、进入高危车厢时主动护航。\n' +

          '评审可点「跑 Demo」或侧栏「审」。');
        const r = MidnightSkills.help();
        agentAppend('skill', 'Skill · help', r.text, {
          intent: 'help', skill: 'help', confidence: 1, at: currentScene || '—'
        });
      }
      if (agentInput) setTimeout(() => agentInput.focus(), 100);
      // 移除闪烁角标，并补投缓存消息
      const btn = document.getElementById('btn-agent');
      if (btn) {
        btn.classList.remove('agent-badge-pulse');
        if (btn.dataset.pendingMsg) {
          const msg = btn.dataset.pendingMsg;
          delete btn.dataset.pendingMsg;

    function agentHandle(text) {
      const q = (text || '').trim();
      if (!q) return;
      agentAppend('user', '你', q);
      const out = MidnightAgent.ask(q);
      agentAppend(
        'skill',
        'Skill · ' + (out.skillResult && out.skillResult.skill),
        (out.skillResult && out.skillResult.ok === false ? '调用失败\n' : '调用成功 · 本地 Skills\n') +
          (out.trace && out.trace.args && Object.keys(out.trace.args).length
            ? '参数：' + JSON.stringify(out.trace.args) + '\n'
            : '') +
          '（点 Trace 看意图/场景/信心）',
        out.trace
      );
      agentAppend('agent', MidnightAgent.name, out.reply, out.trace);
    }

            intent: s.id,

      const before = sanity;

          '阳气低于 45：真结局选项可能被锁/模糊。注意回阳（白烛通路、记忆残票等）。',
          'ending_check');
      }
      return r;
    };

            console.warn(e);
            agentAppend('agent', MidnightAgent.name, `⚠ 步骤 ${demoStepIndex} 异常已跳过：${e.message || e}`);
          }
        }, acc);
      });
    }

    /** 停止演示并恢复正常游玩 */
    function stopProductDemo(silent) {
      clearDemoTimers();
      demoRunning = false;
      document.body.classList.remove('guide-mode', 'demo-running');
      if (demoBanner) demoBanner.classList.remove('on');
      setDemoBanner('演示模式');
      if (!silent) {
        agentAppend('agent', MidnightAgent.name, '演示已停止。可自由游玩，或再次点 ▶ 重跑。');
      }
    }

    // 暴露给控制台 / 外部评测脚本
    window.MidnightSkills = MidnightSkills;
    window.MidnightAgent = MidnightAgent;
    window.runProductDemo = runProductDemo;
    window.stopProductDemo = stopProductDemo;
    window.setReviewMode = setReviewMode;
    window.preloadCriticalAssets = preloadCriticalAssets;

    renderSkillChips();
    const btnAgent = document.getElementById('btn-agent');
    const btnDemo = document.getElementById('btn-demo');
    const btnReview = document.getElementById('btn-review');
    if (btnAgent) btnAgent.onclick = () => {
      if (agentPanel && agentPanel.classList.contains('open')) agentClose();
      else agentOpen();
    };
    if (btnDemo) btnDemo.onclick = () => {
      agentOpen();
      runProductDemo();
    };
    if (btnReview) btnReview.onclick = () => {
      const on = !document.body.classList.contains('review-mode');
      setReviewMode(on);
    };
    const btnAgentClose = document.getElementById('agent-close');
    const btnAgentDemo = document.getElementById('agent-demo-run');
    const btnAgentSend = document.getElementById('agent-send');
    const btnTrace = document.getElementById('agent-trace-toggle');
    if (btnAgentClose) btnAgentClose.onclick = agentClose;
    if (btnAgentDemo) btnAgentDemo.onclick = runProductDemo;
    if (demoBannerStop) demoBannerStop.onclick = () => stopProductDemo(false);
    if (btnTrace) {
      btnTrace.onclick = () => {
        document.body.classList.toggle('show-agent-trace');
        btnTrace.classList.toggle('on', document.body.classList.contains('show-agent-trace'));
      };
    }
    if (btnAgentSend) btnAgentSend.onclick = () => {
      const v = agentInput ? agentInput.value : '';
      if (agentInput) agentInput.value = '';
      agentHandle(v);
    };
    if (agentInput) {
      agentInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const v = agentInput.value;
          agentInput.value = '';
          agentHandle(v);
        }
      });
    }
    // 评审四按钮
    document.querySelectorAll('.agent-review-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const id = chip.getAttribute('data-review');
        const labels = {
          status: '状态感知',
          rulebook: '规则检索',
          risk_assess: '抉择辅助',
          ending_check: '结局诊断'
        };
        agentAppend('user', '评审点选', labels[id] || id);
        const r = MidnightSkills.invoke(id);
        const trace = { intent: id, skill: r.skill, confidence: 1, at: currentScene || '—', args: {} };
        agentAppend('skill', 'Skill · ' + r.skill, '评审模式 invoke', trace);
        agentAppend('agent', MidnightAgent.name, r.text, trace);
      });
    });

    // URL ?review=1 自动进评审模式
    try {
      if (/[?&]review=1(?:&|$)/.test(location.search)) {
        setTimeout(() => setReviewMode(true), 400);
      }
    } catch (e) {}

    // 欢迎页提示
    const welcomeDesc = document.querySelector('.welcome-desc');
    if (welcomeDesc && !welcomeDesc.dataset.agentTip) {
      welcomeDesc.dataset.agentTip = '1';
      welcomeDesc.innerHTML +=
        '<br><span style="color:#c9a227;">🤖 智能体 · ▶ Demo · 审 评审模式</span>' +
        '<br><span style="color:#8a7d60;font-size:12px;">Trace 可观测 · 主动护航 · 结局诊断 Skill</span>';
    }

    if (btnEnter) {
      btnEnter.addEventListener('click', () => {
        preloadCriticalAssets();
        try { GhostBrideBGM.start(); } catch (e) {}
      });
    }

    // 初始化：从站台开始，故事有始有终
    recomputeSanityMax();
    sanity = sanityMax;
    updateSanityUI();
    resetRunRandom();
    renderInventory();
    showScene('prologue_platform');
  })();
  </script>
</div>
</body>
</html>
