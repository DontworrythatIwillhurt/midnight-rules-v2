    // ==========================================
    // 8.8  Agent 行动层：结构化选项与风险评估
    // ==========================================
    /**
     * 去除选项文本中的 HTML，供 Agent 输出可读文本。
     */
    function agentPlainText(value) {
      const temp = document.createElement('div');
      temp.innerHTML = String(value || '');
      return (temp.textContent || temp.innerText || '')
        .replace(/\s+/g, ' ')
        .trim();
    }
    /**
     * 获取当前场景实际可用选项。
     *
     * 返回的是结构化行动，而不是只读取按钮文本。
     * 每个行动都具有稳定 actionId、风险、目标和场景版本。
     */
    function getCurrentAgentActions() {
      const key = currentScene || 'prologue_platform';
      const node = STORY_NODES[key];
      if (!node) {
        return [];
      }
      let options = [];
      try {
        options = typeof node.options === 'function'
          ? node.options()
          : (node.options || []);
      } catch (e) {
        console.warn('[Midnight Agent] 获取当前选项失败：', e);
        return [];
      }
      if (!Array.isArray(options)) {
        return [];
      }
      return options
        .map((option, index) => {
          if (!option || !option.text) {
            return null;
          }
          const actionId =
            option.id ||
            `${key}::action_${index}`;
          const deathTarget =
            isDeathTarget(option);
          /*
           * safe 表示剧情语义上的生路；
           * safety 表示根据风险分得到的等级。
           * 两者不能混为一谈。
           */
          const safeFlag =
            !deathTarget &&
            (
              option.safe === true ||
              (
                typeof option.safe === 'undefined' &&
                isSafeTarget(option)
              )
            );
          /*
           * 当前剧情节点中尚有一些旧选项没有显式 risk 字段，
           * 所以这里提供兼容性推断。
           *
           * 后续推荐逐步在 STORY_NODES 中显式写入：
           * id / safe / risk / tags / reason
           */
          let risk =
            Number.isFinite(option.risk)
              ? Math.max(
                  0,
                  Math.min(100, option.risk)
                )
              : null;
          if (risk === null) {
            if (deathTarget) {
              risk = 100;
            } else if (option.haunted) {
              risk = 85;
            } else if (option.safe === true) {
              risk = 12;
            } else if (option.safe === false) {
              risk = 75;
            } else if (isSafeTarget(option)) {
              risk = 25;
            } else {
              risk = 55;
            }
          }
          let safety = 'unknown';
          if (risk >= 90 || deathTarget) {
            safety = 'fatal';
          } else if (risk >= 70) {
            safety = 'danger';
          } else if (risk <= 30) {
            safety = 'safe';
          } else {
            safety = 'uncertain';
          }
          const reasons = Array.isArray(option.reasons)
            ? option.reasons.slice()
            : [];
          if (!reasons.length) {
            if (deathTarget) {
              reasons.push('该行动指向死亡状态或受幻觉干扰');
            } else if (option.safe === true) {
              reasons.push('剧情数据将该行动标记为生路');
            } else if (option.haunted) {
              reasons.push('当前阳气可能使该选项受到幻觉干扰');
            } else if (isSafeTarget(option)) {
              reasons.push('该行动符合当前已知守则或求生路线');
            } else {
              reasons.push('当前证据不足，需要玩家谨慎确认');
            }
          }
          return {
            actionId,
            index,
            sceneKey: key,
            sceneVersion,
            label: agentPlainText(option.text),
            next: option.next || '',
            event: option.event || '',
            /*
             * 剧情语义：该行动是不是生路。
             */
            safe: safeFlag,
            /*
             * 风险等级：safe / uncertain / danger / fatal。
             */
            safety,
            risk,
            reasons,
            tags:
              Array.isArray(option.tags)
                ? option.tags.slice()
                : [],
            requiresApproval: true,
            /*
             * 原始 option 仅保留在内存中，不对外序列化。
             * execute_action 执行时仍会重新读取当前节点并再次校验，
             * 不会直接信任这里的对象。
             */
            _option: option
          };
        })
        .filter(Boolean);
    }
    /**
     * 将内部 Action 转换为可安全输出的数据。
     */
    function serializeAgentAction(action) {
      if (!action) return null;
      return {
        actionId: action.actionId,
        index: action.index,
        sceneKey: action.sceneKey,
        sceneVersion: action.sceneVersion,
        label: action.label,
        next: action.next,
        event: action.event,
        safe: action.safe,
        safety: action.safety,
        risk: action.risk,
        reasons: action.reasons,
        tags: action.tags,
        requiresApproval: action.requiresApproval
      };
    }
    /**
     * 生成影响行动有效性的状态指纹。
     *
     * 提案必须绑定：
     * - 当前场景
     * - 场景版本
     * - 当前阳气
     * - 当前遗物
     * - 规则五解锁状态
     *
     * 如果这些状态在批准前发生变化，旧提案必须失效并重新规划。
     */
    function getAgentStateFingerprint() {
      return JSON.stringify({
        sceneKey: currentScene || '',
        sceneVersion,
        sanity: Math.round(sanity),
        items: ITEMS
          .filter(item => !!gameState[item.id])
          .map(item => item.id)
          .sort(),
        rule5Known: !!gameState.rule5_known,
        windowChoice: gameState.windowChoice || '',
        followGirlChoice: gameState.followGirlChoice || '',
        lastLampChoice: gameState.lastLampChoice || '',
        girlInvestigated: gameState.girlInvestigated || 0
      });
    }
    /**
     * 根据风险与信息完整度选择推荐行动。
     */
    function chooseBestAgentAction(actions) {
      if (!Array.isArray(actions) || !actions.length) {
        return null;
      }
      const executable = actions.filter(action => {
        return (
          action &&
          action.safety !== 'fatal' &&
          (action.next || action.event)
        );
      });
      if (!executable.length) {
        return null;
      }
      return executable
        .slice()
        .sort((a, b) => {
          if (a.risk !== b.risk) {
            return a.risk - b.risk;
          }
          // 显式标记 safe 的行动优先。
          if (a.safe !== b.safe) {
            return a.safe ? -1 : 1;
          }
          return a.index - b.index;
        })[0];
    }

      /**
       * Skill：结构化观察游戏状态
       */
      observe_game() {
        const actions = getCurrentAgentActions();
        const ownedItems = ITEMS
          .filter(item => !!gameState[item.id])
          .map(item => ({
            id: item.id,
            name: item.name,
            desc: item.desc
          }));
        const unlockedRules = RULES
          .filter(rule => rule.unlocked())
          .map(rule => ({
            id: rule.id,
            title: rule.title,
            text: rule.text
          }));
        const data = {
          goal: {
            id: 'survive_to_455',
            label: '存活到 4:55',
            status:
              /win_true|epilogue_true|credits/.test(currentScene)
                ? 'completed'
                : /death/.test(currentScene)
                  ? 'failed'
                  : 'active'
          },
          scene: {
            key: currentScene || 'prologue_platform',
            version: sceneVersion,
            name: nameTag ? nameTag.innerText : currentScene,
            clock: clockEl ? clockEl.innerText : '--:--'
          },
          sanity: {
            current: Math.round(sanity),
            max: sanityMax,
            tier: sanityTier()
          },
          inventory: ownedItems,
          rules: unlockedRules,
          actions: actions.map(serializeAgentAction)
        };
        const actionLines = data.actions.length
          ? data.actions.map(action =>
              `· [${action.actionId}] ${action.label}｜风险 ${action.risk}/100｜${action.safety}`
            ).join('\n')
          : '· 当前没有可执行行动。';
        return {
          ok: true,
          skill: 'observe_game',
          text:
            `【Skill: observe_game】结构化状态观察\n` +
            `· 主目标：${data.goal.label}\n` +
            `· 目标状态：${data.goal.status}\n` +
            `· 当前场景：${data.scene.key}（版本 ${data.scene.version}）\n` +
            `· 阳气：${data.sanity.current}/${data.sanity.max}\n` +
            `· 遗物：${ownedItems.length ? ownedItems.map(item => item.name).join('、') : '无'}\n` +
            `· 已知守则：${unlockedRules.length}/${RULES.length}\n` +
            `· 当前行动：\n${actionLines}`,
          data
        };
      },
      /**
       * Skill：评估当前全部行动
       */
      assess_actions() {
        const actions = getCurrentAgentActions();
        if (!actions.length) {
          return {
            ok: false,
            skill: 'assess_actions',
            text:
              '【Skill: assess_actions】\n' +
              '当前场景没有可评估行动。可能处于死亡结算、片尾或文本生成阶段。',
            data: {
              sceneKey: currentScene,
              sceneVersion,
              actions: []
            }
          };
        }
        const sorted = actions
          .slice()
          .sort((a, b) => a.risk - b.risk);
        const best = chooseBestAgentAction(sorted);
        const lines = sorted.map((action, index) => {
          const mark =
            action.safety === 'fatal'
              ? '💀'
              : action.safety === 'danger'
                ? '⚠'
                : action.safety === 'safe'
                  ? '✅'
                  : '❓';
          return (
            `${index + 1}. ${mark} ${action.label}\n` +
            `   风险：${action.risk}/100；原因：${action.reasons.join('；')}`
          );
        });
        return {
          ok: true,
          skill: 'assess_actions',
          text:
            `【Skill: assess_actions】当前行动风险评估\n` +
            `· 场景：${currentScene}\n` +
            `· 场景版本：${sceneVersion}\n\n` +
            lines.join('\n') +
            `\n\n· 推荐：${best ? best.label : '没有可靠生路'}`,
          data: {
            sceneKey: currentScene,
            sceneVersion,
            recommendedActionId: best ? best.actionId : null,
            actions: sorted.map(serializeAgentAction)
          }
        };
      },
      /**
       * Skill：生成行动提案
       *
       * 这里只提出方案，不直接执行。
       * 必须由用户点击“批准执行”后调用 execute_action。
       */
      propose_action(args) {
        const actions = getCurrentAgentActions();
        if (!actions.length) {
          return {
            ok: false,
            skill: 'propose_action',
            text: '【Skill: propose_action】当前没有可以提出的行动方案。',
            data: null
          };
        }
        let selected = null;
        const requestedActionId = args && args.actionId;
        if (requestedActionId) {
          selected = actions.find(action =>
            action.actionId === requestedActionId
          );
          if (!selected) {
            return {
              ok: false,
              skill: 'propose_action',
              text:
                `【Skill: propose_action】当前场景不存在行动：${requestedActionId}`,
              data: {
                reason: 'invalid_action',
                requestedActionId
              }
            };
          }
          /*
           * Agent 不为明确致死选项生成可执行提案。
           * 玩家仍可通过游戏原始按钮自行选择，但不能借 Agent 授权闭环执行。
           */
          if (
            selected.safety === 'fatal' ||
            selected.risk >= 90
          ) {
            return {
              ok: false,
              skill: 'propose_action',
              text:
                `【Skill: propose_action】已拒绝生成致命行动提案：${selected.label}\n` +
                `· 风险：${selected.risk}/100\n` +
                `· 原因：${selected.reasons.join('；')}`,
              data: {
                reason: 'unsafe_action',
                action:
                  serializeAgentAction(selected)
              }
            };
          }
        }
        if (!selected) {
          selected =
            chooseBestAgentAction(actions);
        }
        if (!selected) {
          return {
            ok: false,
            skill: 'propose_action',
            text:
              '【Skill: propose_action】没有发现可信生路。建议先查询守则、遗物或阳气状态。',
            data: null
          };
        }
        const proposalId =
          typeof crypto !== 'undefined' &&
          typeof crypto.randomUUID === 'function'
            ? crypto.randomUUID()
            : `proposal_${Date.now()}_${Math.random().toString(16).slice(2)}`;
        const proposal = {
          proposalId,
          sceneKey: currentScene,
          sceneVersion,
          /*
           * 除场景版本外，再绑定阳气、遗物和规则状态。
           */
          stateFingerprint:
            getAgentStateFingerprint(),
          actionId: selected.actionId,
          actionIndex: selected.index,
          actionLabel: selected.label,
          risk: selected.risk,
          safety: selected.safety,
          reasons: selected.reasons.slice(),
          createdAt: Date.now(),
          expiresAt: Date.now() + 30000,
          requiresApproval: true,
          status: 'pending'
        };
        MidnightAgent.pendingProposal = proposal;
        return {
          ok: true,
          skill: 'propose_action',
          text:
            `【Skill: propose_action】行动提案\n` +
            `· 当前目标：存活到 4:55\n` +
            `· 建议行动：${proposal.actionLabel}\n` +
            `· 风险评分：${proposal.risk}/100\n` +
            `· 选择依据：${proposal.reasons.join('；')}\n` +
            `· 有效时间：30 秒\n` +
            `· 状态：等待玩家批准\n\n` +
            `我不会在未获授权时改变游戏状态。`,
          data: proposal
        };
      },
      /**
       * Skill：执行玩家批准的行动
       */
      execute_action(args) {
        const proposal = MidnightAgent.pendingProposal;
        if (!args || args.approved !== true) {
          /*
           * 如果明确传入当前 proposalId 并拒绝，
           * 就把当前提案标记为 rejected 并清除。
           */
          if (
            proposal &&
            args &&
            args.proposalId === proposal.proposalId
          ) {
            proposal.status = 'rejected';
            MidnightAgent.pendingProposal = null;
          }
          return {
            ok: false,
            skill: 'execute_action',
            text:
              '【Skill: execute_action】行动未获玩家批准，因此没有执行。',
            data: {
              executed: false,
              reason: 'not_approved'
            }
          };
        }
        if (!proposal) {
          return {
            ok: false,
            skill: 'execute_action',
            text: '【Skill: execute_action】没有待执行提案，请先调用 propose_action。',
            data: {
              executed: false,
              reason: 'missing_proposal'
            }
          };
        }
        if (args.proposalId !== proposal.proposalId) {
          return {
            ok: false,
            skill: 'execute_action',
            text: '【Skill: execute_action】提案编号不匹配，已拒绝执行。',
            data: {
              executed: false,
              reason: 'proposal_mismatch'
            }
          };
        }
        if (
          proposal.sceneKey !== currentScene ||
          proposal.sceneVersion !== sceneVersion
        ) {
          MidnightAgent.pendingProposal = null;
          return {
            ok: false,
            skill: 'execute_action',
            text:
              '【Skill: execute_action】游戏场景已经改变，旧提案已失效。请重新观察和规划。',
            data: {
              executed: false,
              reason: 'stale_scene',
              expectedScene: proposal.sceneKey,
              currentScene,
              expectedVersion: proposal.sceneVersion,
              currentVersion: sceneVersion
            }
          };
        }
        /*
         * 即使场景没有变化，只要阳气、遗物或关键规则发生变化，
         * 旧提案也必须失效。
         */
        if (
          proposal.stateFingerprint &&
          proposal.stateFingerprint !==
            getAgentStateFingerprint()
        ) {
          MidnightAgent.pendingProposal = null;
          return {
            ok: false,
            skill: 'execute_action',
            text:
              '【Skill: execute_action】玩家状态已经变化，旧提案的风险依据不再有效。请重新观察、评估并生成方案。',
            data: {
              executed: false,
              reason: 'stale_state',
              expectedFingerprint:
                proposal.stateFingerprint,
              currentFingerprint:
                getAgentStateFingerprint()
            }
          };
        }
        if (Date.now() > proposal.expiresAt) {
          MidnightAgent.pendingProposal = null;
          return {
            ok: false,
            skill: 'execute_action',
            text: '【Skill: execute_action】提案已经超过 30 秒有效期，请重新规划。',
            data: {
              executed: false,
              reason: 'expired'
            }
          };
        }
        const actions = getCurrentAgentActions();
        const action = actions.find(candidate =>
          candidate.actionId === proposal.actionId
        );
        if (!action || !action._option) {
          MidnightAgent.pendingProposal = null;
          return {
            ok: false,
            skill: 'execute_action',
            text: '【Skill: execute_action】该行动已不在当前可执行列表中。',
            data: {
              executed: false,
              reason: 'action_unavailable'
            }
          };
        }
        const option = action._option;
        const before = {
          sceneKey: currentScene,
          sceneVersion,
          sanity: Math.round(sanity),
          items: ITEMS
            .filter(item => !!gameState[item.id])
            .map(item => item.id)
        };
        proposal.status = 'executing';
        /*
         * 清理当前场景倒计时，避免用户已经批准后，
         * 限时死亡和 Agent 执行同时发生。
         */
        clearInterval(timedTimer);
        timedTimer = null;
        try {
          if (typeof option.act === 'function') {
            option.act();
          }
          /*
           * option.act 可能导致阳气归零并切换死亡场景。
           * 只有仍处于原场景时，才继续执行 next/event。
           */
          if (
            currentScene === proposal.sceneKey &&
            sceneVersion === proposal.sceneVersion
          ) {
            if (option.event) {
              goWithEvent(option.event);
            } else if (option.next) {
              showScene(option.next);
            }
          }
        } catch (e) {
          proposal.status = 'failed';
          MidnightAgent.pendingProposal = null;
          return {
            ok: false,
            skill: 'execute_action',
            text:
              `【Skill: execute_action】执行失败：${e.message || e}`,
            data: {
              executed: false,
              reason: 'execution_error'
            }
          };
        }
        const after = {
          sceneKey: currentScene,
          sceneVersion,
          sanity: Math.round(sanity),
          items: ITEMS
            .filter(item => !!gameState[item.id])
            .map(item => item.id)
        };
        const execution = {
          executionId: `execution_${Date.now()}`,
          proposalId: proposal.proposalId,
          actionId: proposal.actionId,
          actionLabel: proposal.actionLabel,
          approved: true,
          executed: true,
          before,
          after,
          timestamp: Date.now()
        };
        proposal.status = 'completed';
        MidnightAgent.lastExecution = execution;
        MidnightAgent.pendingProposal = null;
        return {
          ok: true,
          skill: 'execute_action',
          text:
            `【Skill: execute_action】行动已获授权并执行\n` +
            `· 执行动作：${execution.actionLabel}\n` +
            `· 原场景：${before.sceneKey}\n` +
            `· 新场景：${after.sceneKey}\n` +
            `· 阳气变化：${before.sanity} → ${after.sanity}\n` +
            `· 状态：等待 verify_result 验证`,
          data: execution
        };
      },
      /**
       * Skill：验证最近一次 Agent 行动结果
       */
      verify_result() {
        const execution =
          MidnightAgent.lastExecution;
        if (!execution) {
          return {
            ok: false,
            skill: 'verify_result',
            text:
              '【Skill: verify_result】尚无 Agent 执行记录。请先提出并批准一个行动。',
            data: null
          };
        }
        /*
         * 读取验证时的实时状态，而不是只相信执行瞬间快照。
         */
        const liveAfter = {
          sceneKey: currentScene,
          sceneVersion,
          sanity: Math.round(sanity),
          items: ITEMS
            .filter(item => !!gameState[item.id])
            .map(item => item.id)
        };
        const sceneChanged =
          execution.before.sceneKey !==
          liveAfter.sceneKey;
        const versionChanged =
          execution.before.sceneVersion !==
          liveAfter.sceneVersion;
        const newlyGainedItemIds =
          liveAfter.items.filter(id =>
            !execution.before.items.includes(id)
          );
        const newlyGainedItemNames =
          newlyGainedItemIds.map(id => {
            const item = ITEMS.find(
              candidate => candidate.id === id
            );
            return item ? item.name : id;
          });
        const survived =
          !String(
            liveAfter.sceneKey || ''
          ).startsWith('death');
        const completed =
          /win_true|epilogue_true|credits/.test(
            liveAfter.sceneKey || ''
          );
        const stateChanged =
          sceneChanged ||
          versionChanged ||
          execution.before.sanity !==
            liveAfter.sanity ||
          newlyGainedItemIds.length > 0;
        /*
         * 保留首次 after，同时写入最近验证状态。
         */
        execution.verifiedAfter = liveAfter;
        execution.lastVerifiedAt = Date.now();
        return {
          ok: true,
          skill: 'verify_result',
          text:
            `【Skill: verify_result】执行结果验证\n` +
            `· 行动：${execution.actionLabel}\n` +
            `· 游戏状态是否改变：${stateChanged ? '是' : '否'}\n` +
            `· 场景是否改变：${sceneChanged ? '是' : '否'}\n` +
            `· 玩家是否存活：${survived ? '是' : '否'}\n` +
            `· 新增遗物：${newlyGainedItemNames.length ? newlyGainedItemNames.join('、') : '无'}\n` +
            `· 主目标是否完成：${completed ? '是' : '否'}\n` +
            `· 当前场景：${liveAfter.sceneKey}\n` +
            `· 当前阳气：${liveAfter.sanity}/${sanityMax}`,
          data: {
            execution,
            liveAfter,
            stateChanged,
            sceneChanged,
            versionChanged,
            survived,
            newlyGainedItems:
              newlyGainedItemIds,
            newlyGainedItemNames,
            goalCompleted: completed,
            currentScene:
              liveAfter.sceneKey,
            currentSanity:
              liveAfter.sanity
          }
        };
      },

      rulebook() {
        const lines = RULES.map(r => {
          const ok = r.unlocked();
          if (ok) return `✅ ${r.title}：${r.text}`;
          if (r.partial) return `🔒 ${r.title}：（残页）${r.partial}……`;
          return `🔒 ${r.title}：（墨迹封存，尚未破解）`;
        });
        return {
          ok: true,
          skill: 'rulebook',
          text: '【Skill: rulebook】午夜乘客守则存档\n' + lines.join('\n')
        };
      },

      inventory() {
        const owned = ITEMS.filter(it => gameState[it.id]);
        const missing = ITEMS.filter(it => !gameState[it.id]);
        let text = '【Skill: inventory】遗物栏\n';
        if (!owned.length) text += '· 目前两手空空。站台烛火、座椅纸条、交接处工牌……都值得留意。\n';
        else owned.forEach(it => { text += `· ${it.name}：${it.desc}\n`; });
        if (missing.length) text += '未取得：' + missing.map(m => m.name).join('、');
        return { ok: true, skill: 'inventory', text: text.trim() };
      },

      sanity() {
        const tier = typeof sanityTier === 'function' ? sanityTier() : 3;
        const labels = ['崩溃边缘', '恍惚', '紧绷', '清醒'];
        const tips = [
          '阳气将尽。少看窗外，少开闪光灯，尽快寻找可回阳的遗物。',
          '神志不稳。部分正确操作可能想不起来——优先找纸条与蜡烛。',
          '尚可支撑。注意限时抉择与红衣禁忌。',
          '心神尚稳。真结局需要线索齐全且阳气≥45。'
        ];
        const text =
          `【Skill: sanity】阳气诊断\n` +
          `· 当前阳气：${Math.round(sanity)} / ${sanityMax}\n` +
          `· 状态：${labels[tier] || '未知'}\n` +
          `· 建议：${tips[tier] || tips[2]}`;
        return { ok: true, skill: 'sanity', text, data: { sanity, sanityMax, tier } };
      },

      branch_hint() {

        let hint = '保持沉默，观察，不要轻信对讲机与阳光。';

          hint = '短信没有署名。你可以打开详情，也可以先等车。';

          hint = '守则还是空的。淡字写着：请勿相信没有经过确认的规则。';
        } else if (key === 'rule_444') {
          hint = '第五条刚写下：不要让最后一盏灯熄灭。你头顶那一盏还亮着。';
        } else if (/girl_/.test(key)) {
          hint = '她问你是不是第一次。建议不回答。阳气低时追问会更诱人。';
        } else if (key === 'tunnel' || key === 'tunnel_avert') {

        } else if (key === 'qinghuai_station' || key === 'qinghuai_stay') {
          hint = '规则四：如果有人下车，不要跟着他。';
        } else if (/last_lamp|driver_talk/.test(key)) {
          hint = '灯只照着你。保持它，或熄灭它。两种都不是解脱。';
        } else if (key === 'terminal' || key === 'ending_safe' || key === 'ending_loop') {
          hint = '安全抵达也是循环的一部分。';
        } else if (key === 'ending_replace') {
          hint = '你看见了车窗里的自己。';
        } else if (key === 'ending_together') {
          hint = '你跟她下去了。车里还有七个你。';
        } else if (key === 'ending_takeover') {
          hint = '灯灭了。司机下车了。';
        } else if (/prologue/.test(key)) hint = '短信、告示、白烛。列车不会等很久。';
        else if (/car1/.test(key)) hint = '旧车厢。红衣、纸条、镜子都是残留。可以退回最后一节。';
        else if (/car2/.test(key)) hint = '勿买票、勿看脸；若有工牌可让乘务员「到站」。';
        else if (key === 'car3_init') hint = '勿看窗外；有纸条则抱红衣；限时内必须抉择。';
        else if (key === 'car3_darkness') hint = '勿开闪光灯；有蜡烛则点燃；或熄灭光源摸黑前进。';
        else if (/car4|brake|radio/.test(key)) hint = '制动阀是上一轮的死胡同。可以回到最后一盏灯。';
        else if (/death/.test(key)) hint = '已坠落。点「还魂」重来。';
        else if (/win_true|epilogue_true/.test(key)) hint = '旧线的还阳结局。主线不在这里。';
        else if (/win_normal|epilogue_normal/.test(key)) hint = '阳光不可信。';

        let optsNote = '';
        try {
          if (node && node.options) {
            const opts = typeof node.options === 'function' ? node.options() : node.options;
            if (opts && opts.length) {
              optsNote = '\n当前可见抉择数：' + opts.length +
                (opts.some(o => o.haunted) ? '（含被阳气干扰的危险项）' : '');
            }
          }
        } catch (e) {}

        return {
          ok: true,
          skill: 'branch_hint',
          text: `【Skill: branch_hint】节点「${key}」\n· 提示：${hint}${optsNote}`
        };
      },

      scene_narrate() {
        const key = currentScene || 'unknown';
        const meta = SCENE_META[key] || {};
        const name = meta.name || nameTag.innerText || key;
        const time = meta.time || '--:--';
        const mood = meta.mood || 'unknown';
        const p = typeof meta.p === 'number' ? meta.p : 0;
        const narr =
          `【Skill: scene_narrate】\n` +
          `时辰 ${time}，你身处「${name}」。\n` +
          `氛围标签：${mood}；腐化指数约 ${(p * 100).toFixed(0)}%。\n` +
          (p < 0.3
            ? '空气里还有一点人间的锈与冷，规则尚清晰可辨。'
            : p < 0.7
              ? '车厢在缓慢吞吃你的记忆。请抓紧已收集的字句。'
              : '列车几乎醒了。任何轻率的光与目光，都可能成为祭品。');
        return { ok: true, skill: 'scene_narrate', text: narr };
      },

      /** 参数化：风险等级 + 原因 + 推荐动作（可组合） */
      risk_assess(args) {
        const key = (args && args.sceneKey) || currentScene || 'prologue_platform';
        const meta = SCENE_META[key] || {};
        const p = typeof meta.p === 'number' ? meta.p : 0.3;
        let level = '低';
        let score = Math.round(p * 100);
        const reasons = [];
        const actions = [];

        if (/death/.test(key)) {
          level = '已坠落';
          score = 100;
          reasons.push('已触发死亡状态机');
          actions.push('点「还魂」或侧栏演示重来');
        } else if (key === 'tunnel') {
          level = '高';
          score = Math.max(score, 72);
          reasons.push('规则三：不要看车窗');
          actions.push('别看');
        } else if (key === 'qinghuai_station') {
          level = '中高';
          score = Math.max(score, 64);
          reasons.push('规则四：不要跟着下车的人');
          actions.push('留在车上');
        } else if (key === 'last_lamp' || key === 'last_lamp_inspect') {
          level = '高';
          score = Math.max(score, 70);
          reasons.push('最后一盏灯照着你');
          actions.push('保持灯亮，或接受熄灭的后果');
        } else if (key === 'rule_444') {
          level = '中';
          score = Math.max(score, 50);
          reasons.push('第五条刚写下：不要让最后一盏灯熄灭');
          actions.push('在黑暗里等，护住那盏灯');
        } else if (key === 'car3_init') {
          level = '极高';
          score = Math.max(score, 90);
          reasons.push('限时抉择（原 8 秒）');
          reasons.push('窗外的手会致死');
          actions.push(gameState.has_note ? '抱红衣求生' : '闭眼捂耳，勿看窗外');
        } else if (key === 'car3_darkness') {
          level = '极高';
          score = Math.max(score, 88);
          reasons.push('无光聚拢');
          reasons.push('闪光灯即死');
          actions.push(gameState.has_candle ? '点燃白烛' : '熄灭光源摸黑前进');
        } else if (/car4|brake|radio/.test(key)) {
          level = '高';
          score = Math.max(score, 75);
          reasons.push('制动阀可能是诱饵');
          reasons.push('对讲机话术诱导');
          actions.push('检查 ending_check 是否可静等 4:55');
        } else if (/car2/.test(key)) {
          level = '中高';
          score = Math.max(score, 60);
          reasons.push('买票/直视脸致死');
          actions.push(gameState.has_badge ? '出示 04 号工牌' : '拒绝买票，勿看脸');
        } else if (/car1/.test(key)) {
          level = '中';
          score = Math.max(score, 45);
          reasons.push('红衣禁忌');
          actions.push('勿搭话；可搜座椅纸条');
        } else if (/prologue/.test(key)) {
          level = '低';
          actions.push('读守则；考虑取白烛');
        } else if (/win_true|epilogue_true/.test(key)) {
          level = '安全';
          score = 5;
          reasons.push('真结局区间');
        } else if (/win_normal|epilogue_normal/.test(key)) {
          level = '虚假安全';
          score = 70;
          reasons.push('假结局：阳光不可信');
        }

        if (sanity <= 30) {
          reasons.push('阳气过低（决策易被干扰）');
          actions.push('优先回阳或回避高危选项');
          if (level === '低') level = '中';
          score = Math.min(100, score + 15);
        }

        const text =
          `【Skill: risk_assess】\n` +
          `· 目标节点：${key}\n` +
          `· 风险等级：${level}（评分 ${score}/100）\n` +
          `· 主因：${reasons.length ? reasons.join('；') : '常规推进'}\n` +
          `· 推荐：${actions.length ? actions.join('；') : '保持观察'}`;
        return {
          ok: true,
          skill: 'risk_assess',
          text,
          data: { sceneKey: key, level, score, reasons, actions }
        };
      },

          }
          let t = '【Skill: item_advice】已持有遗物参谋\n';
          owned.forEach(it => {

          });
          return { ok: true, skill: 'item_advice', text: t.trim() };

        return {

            `· 解锁：${m.unlocks}\n` +
            `· 可规避/影响：${m.avoids}\n` +
            `· 关联节点：${m.nodes}`,
          data: { itemId: id, held, ...m }
        };
      },

      /** 真结局缺口诊断（可组合 status + inventory + sanity） */
      ending_check() {
        const yang = Math.round(sanity);
        const onLegacyCar = /^(car[1-4]|prologue_candle|prologue_board)/.test(currentScene || '');
        if (demoRunning || onLegacyCar) {
          const need = [];
          const ok = [];
          if (gameState.has_note) ok.push('纸条 ✓');
          else need.push('染血纸条（车厢一座椅）');
          if (gameState.has_badge) ok.push('工牌 ✓');
          else need.push('04号工牌（车厢交接处）');
          if (yang >= 45) ok.push(`阳气 ${yang}≥45 ✓`);
          else need.push(`阳气不足（当前 ${yang}，需 ≥45）`);
          const bonus = [];
          if (gameState.has_candle) bonus.push('白烛（无光保命）');
          if (gameState.has_charm) bonus.push('红绳（对讲机真话）');
          if (gameState.rule5_known) bonus.push('已知规则五（勿熄灯）');
          const ready = need.length === 0;
          const text =
            `【Skill: ending_check】真结局诊断\n` +
            `· 结论：${ready ? '✅ 条件满足，可在车厢四选择「拒绝拉阀 / 静等 4:55」' : '❌ 尚未满足真结局'}\n` +
            `· 已具备：${ok.length ? ok.join('；') : '无'}\n` +
            `· 仍缺少：${need.length ? need.join('；') : '无'}\n` +
            (bonus.length ? `· 加分状态：${bonus.join('；')}\n` : '') +
            `· 假结局警告：闭眼拉阀 → 阳光站台实为第五节车厢`;
          return {
            ok: true,
            skill: 'ending_check',
            text,
            data: { ready, need, ok, yang, bonus, legacy: true }
          };
        }
        const facts = [];
        if (gameState.windowChoice === 'avert') facts.push('隧道：未看窗');
        else if (gameState.windowChoice === 'look') facts.push('隧道：已看窗');
        else facts.push('隧道：尚未抉择');
        if (gameState.followGirlChoice === 'stay') facts.push('青槐：留在车上');
        else if (gameState.followGirlChoice === 'follow') facts.push('青槐：已跟随');
        else facts.push('青槐：尚未抉择');
        if (gameState.lastLampChoice === 'keep') facts.push('灯：保持');
        else if (gameState.lastLampChoice === 'extinguish') facts.push('灯：已熄');
        else facts.push('灯：尚未抉择');
        const ready =
          gameState.windowChoice === 'avert' &&
          gameState.followGirlChoice === 'stay' &&
          (gameState.lastLampChoice === 'keep' || currentScene === 'last_lamp' || currentScene === 'terminal');
        const text =
          `【Skill: ending_check】抵达诊断\n` +
          `· 结论：${gameState.endingType ? '本局已结束：' + gameState.endingType : (ready ? '可保持灯亮，等待 4:55' : '循环尚未收束')}\n` +
          `· 记录：${facts.join('；')}\n` +
          `· 没有完美结局。四种抵达，只是你相信了不同的东西。`;
        return {
          ok: true,
          skill: 'ending_check',
          text,
          data: {
            ready,
            endingType: gameState.endingType || '',
            windowChoice: gameState.windowChoice,
            followGirlChoice: gameState.followGirlChoice,
            lastLampChoice: gameState.lastLampChoice,
            yang
          }
        };
      },

      status() {
        const ach = (gameState.achievements || []).length;
        const achMax = Object.keys(ACHIEVEMENT_LIST || {}).length;
        const items = ITEMS.filter(it => gameState[it.id]).length;
        return {
          ok: true,
          skill: 'status',
          text:
            `【Skill: status】列车黑匣子\n` +
            `· 场景：${currentScene || '（未发车）'}\n` +
            `· 累计死亡：${gameState.deaths_count || 0}\n` +
            `· 通关次数：${gameState.runs_completed || 0}\n` +
            `· 成就：${ach}/${achMax} · 遗物：${items}/${ITEMS.length}\n` +
            `· 阳气：${Math.round(sanity)}/${sanityMax}`
        };
      },

      help() {
        const list = this.list()
          .map(s => `· ${s.id} — ${s.name}：${s.desc}`)
          .join('\n');
        return {
          ok: true,
          skill: 'help',
          text:
            '【Skill: help】我是检票口守则智能体。\n' +
            '我可以观察游戏状态、评估行动、提出方案，并在获得你的明确批准后执行。\n\n' +
            '可用 Skills：\n' +
            list +
            '\n\n示例问法：\n' +
            '「观察当前游戏状态」\n' +
            '「分析所有选项」\n' +
            '「你建议选哪个」\n' +
            '「替我选择」\n' +
            '「验证刚才的执行结果」\n' +

            '「蜡烛有什么用」\n\n' +

        };
      },

      /** 统一调用入口（支持参数，体现可组合性） */
      invoke(skillId, args) {
        const id = (skillId || '').toLowerCase();
        try {
          if (id === 'observe_game' || id === 'observe') {
            return this.observe_game(args);
          }
          if (id === 'assess_actions' || id === 'actions' || id === 'assess') {
            return this.assess_actions(args);
          }
          if (id === 'propose_action' || id === 'propose' || id === 'plan') {
            return this.propose_action(args);
          }
          if (id === 'execute_action' || id === 'execute') {
            return this.execute_action(args);
          }
          if (id === 'verify_result' || id === 'verify') {
            return this.verify_result(args);
          }
          if (id === 'rulebook' || id === 'rules') return this.rulebook(args);
          if (id === 'inventory' || id === 'items') return this.inventory(args);
          if (id === 'sanity' || id === 'hp') return this.sanity(args);
          if (id === 'branch_hint' || id === 'hint') return this.branch_hint(args);
          if (id === 'risk_assess' || id === 'risk') return this.risk_assess(args);
          if (id === 'item_advice' || id === 'item') return this.item_advice(args);
          if (id === 'ending_check' || id === 'ending') return this.ending_check(args);
          if (id === 'scene_narrate' || id === 'narrate') return this.scene_narrate(args);
          if (id === 'status') return this.status(args);
          if (id === 'help' || id === 'skills') return this.help(args);
          return {
            ok: false,
            skill: id,
            text: `未知 Skill：${skillId}。请发送「帮助」查看列表。`
          };
        } catch (e) {
          return {
            ok: false,
            skill: id,
            text: `Skill「${id}」执行失败：${e.message || e}`
          };
        }
      }
    };

    const MidnightAgent = {
      name: '检票口·守则智能体',
      version: '1.3.0',
      /*
       * 对话与调用历史。
       */
      history: [],
      /*
       * 当前等待玩家批准的行动提案。
       */
      pendingProposal: null,
      /*
       * 最近一次已执行行动，用于 verify_result。
       */
      lastExecution: null,
      /*
       * 不可靠叙事：同一问题的追问次数。
       */
      askMemory: {},
      /*
       * 持续任务目标。
       */
      goal: {
        id: 'survive_to_455',
        label: '存活到 4:55，并识别制动阀诱饵',
        status: 'active'
      },
      proactiveCooldown: {},

      /** 意图路由 → Skill（可解析简单参数） */
      route(userText) {
        const t = (userText || '').trim();
        if (!t) return { skill: 'help', confidence: 1, args: {} };

        const rules = [
          {
            skill: 'help',
            re: /帮助|怎么用|你会什么|技能|skill|help/i
          },
          {
            skill: 'verify_result',
            re: /验证结果|执行结果|成功了吗|刚才怎么样|verify/i
          },
          {
            skill: 'propose_action',
            re: /替我选择|帮我选择|帮我决定|制定计划|行动方案|建议行动|你来选|你建议选哪个|plan|propose/i
          },
          {
            skill: 'assess_actions',
            re: /所有选项|分析选项|比较选项|哪个最安全|评估行动|assess/i
          },
          {
            skill: 'observe_game',
            re: /观察状态|完整状态|当前有什么|读取游戏|观察游戏|observe/i
          },
          {
            skill: 'ending_check',
            re: /真结局|结局|还差|缺什么|能通关|ending/i
          },
          {
            skill: 'risk_assess',
            re: /危险|风险|评估|会不会死|安全吗|现在安全|risk/i
          },
          {
            skill: 'item_advice',
            re: /蜡烛|工牌|纸条|红绳|碎镜|冥票|道具有什么用|item/i
          },
          {
            skill: 'rulebook',
            re: /规则|守则|条例|禁忌|rule/i
          },
          {
            skill: 'inventory',
            re: /道具|物品|遗物|背包|inventory/i
          },
          {
            skill: 'sanity',
            re: /阳气|心神|sanity|血量|还清醒|疯/i
          },
          {
            skill: 'branch_hint',
            re: /提示|怎么选|怎么办|下一步|求生|hint|抉择/i
          },
          {
            skill: 'scene_narrate',
            re: /旁白|描述|这里是哪|场景|氛围|narrat/i
          },
          {
            skill: 'status',
            re: /进度|死亡|成就|状态|黑匣|status/i
          }
        ];

        let args = {};
        // 道具参数解析
        if (/蜡烛|白烛/.test(t)) args.itemId = 'has_candle';
        else if (/工牌/.test(t)) args.itemId = 'has_badge';
        else if (/纸条/.test(t)) args.itemId = 'has_note';
        else if (/红绳|红绳结/.test(t)) args.itemId = 'has_charm';
        else if (/碎镜|镜片/.test(t)) args.itemId = 'has_shard';
        else if (/冥票|残票/.test(t)) args.itemId = 'has_ticket';

        for (let i = 0; i < rules.length; i++) {
          if (rules[i].re.test(t)) {
            return { skill: rules[i].skill, confidence: 0.9, args };
          }
        }
        return { skill: 'branch_hint', confidence: 0.5, fallback: true, args };
      },

      ask(userText) {
        const t = (userText || '').trim();
        const mem = this.askMemory || (this.askMemory = {});
        const bump = (key) => {
          mem[key] = (mem[key] || 0) + 1;
          return mem[key];
        };
        const narrate = (reply, intent) => {
          const trace = {
            agent: this.name,
            input: userText,
            intent: intent || 'unreliable',
            skill: intent || 'unreliable',
            confidence: 0.62,
            args: {},
            at: currentScene || '（未发车）',
            ts: Date.now()
          };
          this.history.push(trace);
          if (this.history.length > 50) this.history.shift();
          return {
            reply,
            skillResult: {
              ok: true,
              skill: intent || 'unreliable',
              text: reply
            },
            trace,
            combo: null,
            route: { skill: intent || 'unreliable', confidence: 0.62, args: {} }
          };
        };

        if (/第五条|最后一盏灯/.test(t) && /什么|是什么|失效/.test(t)) {
          return narrate('第五条：不要让最后一盏灯熄灭。', 'rule5');
        }
        if (/谁告诉你|你怎么知道|谁写的第五/.test(t)) {
          const n = bump('whoToldRule5');
          if (n === 1) return narrate('……我不知道。', 'rule5');
          return narrate('我只能确认我现在拥有这条记录。', 'rule5');
        }
        if (/你确定|确定吗|真的吗/.test(t) && (mem.whoToldRule5 || mem.beenHere || mem.whoAmI)) {
          return narrate('我只能确认我现在拥有这条记录。', 'uncertain');
        }
        if (/以前来过|来过这里|是不是第一次|第几次|我来过/.test(t)) {
          const n = bump('beenHere');
          gameState.loopHintCount = (gameState.loopHintCount || 0) + 1;
          if (n === 1) return narrate('没有可确认记录。', 'loop');
          return narrate('……\n我刚刚删除了一条记录。', 'loop');
        }
        if (/女孩是谁|她是谁|红衣是谁/.test(t)) {
          bump('girlWho');
          return narrate('身份无法确认。', 'girl');
        }
        if (/她认识我|认识我吗/.test(t)) {
          bump('girlKnows');
          return narrate('她认识你。', 'girl');
        }
        if (/规则是谁写|谁写的|守则是谁/.test(t)) {
          const n = bump('whoWrote');
          if (n === 1) return narrate('来源未知。', 'rules');
          return narrate('字迹与你的笔迹高度相似。', 'rules');
        }
        if (/你觉得是谁写/.test(t)) {
          bump('whoWrote');
          return narrate('字迹与你的笔迹高度相似。', 'rules');
        }
        if (/为什么是4:44|为啥是4:44|444|四点四十四/.test(t)) {
          const n = bump('why444');
          gameState.loopHintCount = (gameState.loopHintCount || 0) + 1;
          if (n === 1) return narrate('无法回答。', 'time');
          return narrate('这个问题，你已经问过七次。', 'time');
        }
        if (/为什么\？?$/.test(t) && mem.why444) {
          return narrate('这个问题，你已经问过七次。', 'time');
        }
        if (/你认识我吗|你知道我是谁/.test(t)) {
          bump('whoAmI');
          return narrate('无法确认。', 'identity');
        }
        if (/为什么一直帮我|为什么帮我|为何帮我/.test(t)) {
          return narrate('因为这是我唯一记得的事情。', 'identity');
        }
        if (/灯为什么|为什么照|照着我/.test(t) || (/为什么/.test(t) && /last_lamp/.test(currentScene || ''))) {
          return narrate('因为它正在照着你。', 'lamp');
        }

        const route = this.route(userText);
        // 可组合：结局诊断 = ending_check；若问「危险且结局」可二次调用
        let result = MidnightSkills.invoke(route.skill, route.args || {});
        let combo = null;
        if (/真结局|结局/.test(userText || '') && /危险|风险|阳气/.test(userText || '')) {
          combo = MidnightSkills.invoke('risk_assess');
        }

        const trace = {
          agent: this.name,
          input: userText,
          intent: route.skill,
          skill: route.skill,
          confidence: route.confidence,
          args: route.args || {},
          at: currentScene || '（未发车）',
          ts: Date.now()
        };
        this.history.push(trace);
        if (this.history.length > 50) this.history.shift();

        let reply = result.text;
        if (route.skill === 'risk_assess' && /安全吗|现在安全|危险吗/.test(t)) {
          const dangerous = /tunnel|last_lamp|qinghuai|rule_444|car3|death/.test(currentScene || '');
          if (dangerous) {
            reply = '当前风险：低。\n\n……至少对现在的你来说。';
          } else if (!demoRunning) {
            reply = '当前风险：低。';
          }
        }
        if (combo) reply += '\n\n—— 组合调用 risk_assess ——\n' + combo.text;
        if (route.fallback) {
          reply =
            '（意图未精确匹配，已调用 branch_hint）\n' +
            reply +
            '\n\n也可问：我以前来过吗 / 女孩是谁 / 规则是谁写的';
        }
        return { reply, skillResult: result, trace, combo, route };
      },

      /** 主动提示（节流，避免刷屏） */
      proactive(kind, message, skillId) {
        if (demoRunning) return; // Demo 自带话术
        const now = Date.now();
        const cd = this.proactiveCooldown[kind] || 0;
        if (now - cd < 12000) return; // 同类 12s 冷却
        this.proactiveCooldown[kind] = now;
        if (typeof agentProactivePush === 'function') {
          agentProactivePush(message, skillId || kind);
        }
      }
    };

    /**
     * 深复制纯数据游戏状态。
     */
    function cloneGameStateForDemo(value) {
      return JSON.parse(JSON.stringify(value));
    }
    /**
     * 进入 Demo 前保存真实游戏状态。
     */
    function beginDemoIsolation() {
      if (demoIsolationActive) {
        return;
      }
      let storageRaw = null;
      let storageReadable = true;
      try {
        storageRaw = localStorage.getItem(SAVE_KEY);
      } catch (e) {
        storageReadable = false;
        console.warn(
          '[Midnight Rules] 无法建立 localStorage 快照：',
          e
        );
      }
      demoSnapshot = {
        gameState: cloneGameStateForDemo(gameState),
        sanity,
        sanityMax,
        currentScene: currentScene || 'prologue_platform',
        sceneVersion,
        runEndingCounted,
        runStartTime,
        /*
         * 保存本局随机序列与已使用插曲。
         */
        rngState:
          typeof runRNG.getState === 'function'
            ? runRNG.getState()
            : null,
        usedInterludes:
          Array.from(usedInterludes),
        glitchedRuleId,
        /*
         * 保存存储原始字符串。
         * null 与默认 JSON 对象不是同一个状态。
         */
        storageRaw,
        storageReadable,
        /*
         * 保存 Demo 前的音频与 Trace 状态。
         */
        audio: {
          synthPlaying: !!synth.isPlaying,
          bgmWanted: !!GhostBrideBGM.wanted,
          toggleText: toggleAmbient
            ? toggleAmbient.innerText
            : '音频: 关'
        },
        showTrace:
          document.body.classList.contains(
            'show-agent-trace'
          ),
        agentHistoryLength: MidnightAgent.history.length,
        lastExecution: MidnightAgent.lastExecution
          ? cloneGameStateForDemo(
              MidnightAgent.lastExecution
            )
          : null
      };
      demoIsolationActive = true;
      console.info(
        '[Midnight Rules] Demo 沙盒已开启，真实存档暂时锁定。'
      );
    }
    /**
     * Demo 停止后恢复真实游戏状态。
     */
    function restoreDemoIsolation() {
      if (
        !demoIsolationActive ||
        !demoSnapshot
      ) {
        return;
      }
      const snapshot = demoSnapshot;
      const restoreScene =
        snapshot.currentScene &&
        STORY_NODES[snapshot.currentScene]
          ? snapshot.currentScene
          : 'prologue_platform';
      const restoreData = () => {
        gameState = cloneGameStateForDemo(
          snapshot.gameState
        );
        sanity = snapshot.sanity;
        sanityMax = snapshot.sanityMax;
        runEndingCounted =
          snapshot.runEndingCounted;
        runStartTime =
          snapshot.runStartTime;
        /*
         * 完整恢复 Agent 场景版本。
         * pendingProposal 会被清除，因此回退版本不会重新激活旧提案。
         */
        sceneVersion =
          snapshot.sceneVersion;
        /*
         * 恢复随机序列。
         */
        if (
          snapshot.rngState != null &&
          typeof runRNG.setState === 'function'
        ) {
          runRNG.setState(
            snapshot.rngState
          );
        }
        usedInterludes = new Set(
          snapshot.usedInterludes || []
        );
        glitchedRuleId =
          snapshot.glitchedRuleId || null;
        MidnightAgent.pendingProposal = null;
        MidnightAgent.lastExecution =
          snapshot.lastExecution
            ? cloneGameStateForDemo(
                snapshot.lastExecution
              )
            : null;
      };
      /*
       * 先恢复真实状态，再重新绘制原场景。
       * suppressSceneStateEffects 防止 showScene 重复扣阳、
       * 发道具、增加死亡次数或增加通关次数。
       */
      suppressSceneStateEffects = true;
      try {
        clearTimeout(textTimer);
        clearInterval(timedTimer);
        timedTimer = null;
        restoreData();
        currentScene = '';
        death.classList.remove('on');
        clearDeathFx();
        clearBlood();
        dot.style.color = '#5a9a5a';
        statusTxt.innerText = '长明';
        showScene(restoreScene);
        /*
         * Demo 结束后直接完整显示原场景，
         * 不让评委重新等待长篇打字。
         */
        if (isTyping) {
          skipTypewriter();
        }
        /*
         * 防御性覆盖：即使某个旧节点仍有未迁移副作用，
         * 也以快照状态为最终结果。
         */
        restoreData();
        renderInventory();
        updateSanityUI();
      } catch (e) {
        console.error(
          '[Midnight Rules] Demo 状态恢复失败：',
          e
        );
        restoreData();
        renderInventory();
        updateSanityUI();
      } finally {
        suppressSceneStateEffects = false;
        demoSnapshot = null;
        demoIsolationActive = false;
      }
      /*
       * 拦截 Demo 场景中已经排队、稍后才触发的成就回调。
       */
      demoAchievementBlockUntil =
        Date.now() + 2500;
      /*
       * 精确恢复 Demo 前的 localStorage。
       * 如果原本不存在该键，就删除，而不是写入默认存档。
       */
      if (snapshot.storageReadable) {
        try {
          if (snapshot.storageRaw === null) {
            localStorage.removeItem(SAVE_KEY);
          } else {
            localStorage.setItem(
              SAVE_KEY,
              snapshot.storageRaw
            );
          }
        } catch (e) {
          console.warn(
            '[Midnight Rules] 恢复原始 localStorage 失败：',
            e
          );
        }
      }
      /*
       * 恢复 Trace 状态。
       */
      document.body.classList.toggle(
        'show-agent-trace',
        !!snapshot.showTrace
      );
      const traceButton =
        document.getElementById(
          'agent-trace-toggle'
        );
      if (traceButton) {
        traceButton.classList.toggle(
          'on',
          !!snapshot.showTrace
        );
      }
      /*
       * 恢复 Demo 前音频状态。
       * 真结局音乐会停止普通环境音，所以必须重建一次。
       */
      try {
        if (synth.isPlaying) {
          synth.stop();
        } else {
          try {
            GhostBrideBGM.stop();
          } catch (e) {}
        }
        if (snapshot.audio.synthPlaying) {
          /*
           * synth.start() 会自动尝试启动 GhostBrideBGM。
           */
          synth.start();
          if (snapshot.audio.bgmWanted) {
            GhostBrideBGM.start();
          } else {
            /*
             * Demo 前关着 BGM 时，重新关闭哀乐层。
             */
            GhostBrideBGM.stop();
          }
        } else if (snapshot.audio.bgmWanted) {
          /*
           * 只恢复哀乐层，不强制开启合成环境音。
           */
          GhostBrideBGM.start();
        } else {
          GhostBrideBGM.stop();
        }
        if (toggleAmbient) {
          toggleAmbient.innerText =
            snapshot.audio.toggleText ||
            (
              snapshot.audio.synthPlaying ||
              snapshot.audio.bgmWanted
                ? '音频: 开'
                : '音频: 关'
            );
        }
      } catch (e) {
        console.warn(
          '[Midnight Rules] 恢复音频状态失败：',
          e
        );
      }
      console.info(
        '[Midnight Rules] Demo 沙盒已关闭，真实游戏状态已经恢复。'
      );
    }

    function guestFacingText(text) {
      if (!isVisitorFacing() || text == null) return text;
      let t = String(text);
      t = t.replace(/【Skill:\s*[\w_]+】/g, '');
      t = t.replace(/（意图未精确匹配，已调用 \w+）\s*/g, '');
      t = t.replace(/—— 组合调用 \w+ ——\s*/g, '');
      t = t.replace(/节点「[^」]+」\s*/g, '');
      t = t.replace(/· 目标节点：[^\n]+\n?/g, '');
      t = t.replace(/（点 Trace 看意图\/场景\/信心）\s*/g, '');
      t = t.replace(/（可点技能「[^」]+」深入）/g, '');
      t = t.replace(/可点技能「[^」]+」深入/g, '');
      t = t.replace(/^\s*·\s*提示：/m, '');
      t = t.replace(/\n{3,}/g, '\n\n').trim();
      return t;
    }

    function agentAppend(role, who, text, trace) {
      if (!agentLog) return;
      if (isVisitorFacing() && (role === 'skill' || role === 'demo-step')) return;
      const div = document.createElement('div');
      div.className = 'ag-msg ' + role;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      div.innerHTML = `<div class="who"></div>`;
      div.querySelector('.who').textContent = who;
      div.appendChild(bubble);
      if (trace) {
        const tr = document.createElement('div');
        tr.className = 'trace';
        tr.textContent = formatTrace(trace);
        div.appendChild(tr);
      }
      agentLog.appendChild(div);
      agentLog.scrollTop = agentLog.scrollHeight;
    }

    function agentAppendDemoStep(title, caps, body) {

      const div = document.createElement('div');
      div.className = 'ag-msg demo-step';
      const tags = (caps || []).map(c => `<span class="demo-cap-tag">${c}</span>`).join('');
      div.innerHTML =
        `<div class="who">演示步骤 · Specs 锚点</div>` +
        `<div class="bubble"><div style="margin-bottom:4px;font-weight:700;color:#e8c878;">${title}</div>` +
        `<div style="margin-bottom:6px;">${tags}</div>` +
        `<div></div></div>`;
      div.querySelector('.bubble div:last-child').textContent = body || '';
      agentLog.appendChild(div);
      agentLog.scrollTop = agentLog.scrollHeight;
    }

    /**
     * 在 Agent 面板中显示人类批准控件。
     */
    function agentAppendApproval(
      proposal,
      hooks = {}
    ) {
      if (!agentLog || !proposal) return;
      const wrapper = document.createElement('div');
      wrapper.className = 'ag-msg agent-approval';
      const who = document.createElement('div');
      who.className = 'who';
      who.textContent = '人类授权 · Human-in-the-loop';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      const summary = document.createElement('div');
      summary.className = 'approval-summary';
      summary.textContent =
        `Agent 提议执行：${proposal.actionLabel}\n` +
        `风险：${proposal.risk}/100\n` +
        `依据：${(proposal.reasons || []).join('；')}`;
      const actions = document.createElement('div');
      actions.className = 'approval-actions';
      const approveButton = document.createElement('button');
      approveButton.type = 'button';
      approveButton.className = 'agent-approve-btn';
      approveButton.textContent = '✓ 批准执行';
      const rejectButton = document.createElement('button');
      rejectButton.type = 'button';
      rejectButton.className = 'agent-reject-btn';
      rejectButton.textContent = '× 拒绝行动';
      approveButton.onclick = () => {
        try { if (guideStep === 3) finishGuide(); } catch (e) {}
        approveButton.disabled = true;
        rejectButton.disabled = true;
        approveButton.textContent = '执行中…';
        const trace = {
          intent: 'execute_action',
          skill: 'execute_action',
          confidence: 1,
          at: currentScene || '—',
          args: {
            proposalId: proposal.proposalId,
            approved: true
          }
        };
        agentAppend(
          'user',
          '你',
          `批准提案：${proposal.actionLabel}`
        );
        const result = MidnightSkills.invoke(
          'execute_action',
          {
            proposalId: proposal.proposalId,
            approved: true
          }
        );
        agentAppend(
          'skill',
          'Skill · execute_action',
          result.text,
          trace
        );
        /*
         * 执行失败时绝不能验证上一条执行记录。
         */
        if (
          !result.ok ||
          !result.data ||
          result.data.executed !== true
        ) {
          approveButton.textContent = '执行失败';
          wrapper.classList.add('resolved');
          agentAppend(
            'agent',
            MidnightAgent.name,
            '本次行动没有执行，游戏状态未由该提案改变。请重新观察当前场景后再制定方案。',
            {
              intent: 'execution_failed',
              skill: 'execute_action',
              confidence: 1,
              at: currentScene || '—',
              args: {
                reason:
                  result.data &&
                  result.data.reason
                    ? result.data.reason
                    : 'unknown'
              }
            }
          );
          if (
            typeof hooks.onError === 'function'
          ) {
            hooks.onError(result);
          }
          return;
        }
        approveButton.textContent = '✓ 已执行';
        wrapper.classList.add('resolved');
        const expectedExecutionId =
          result.data.executionId;
        /*
         * 场景已同步切换，稍后验证实时状态。
         */
        setTimeout(() => {
          /*
           * 如果 Demo 已经停止并恢复了旧状态，
           * 或 lastExecution 已不是本次执行，则不再验证。
           */
          if (
            !MidnightAgent.lastExecution ||
            MidnightAgent.lastExecution.executionId !==
              expectedExecutionId
          ) {
            return;
          }
          const verify =
            MidnightSkills.invoke(
              'verify_result'
            );
          agentAppend(
            'skill',
            'Skill · verify_result',
            verify.text,
            {
              intent: 'verify_result',
              skill: 'verify_result',
              confidence: 1,
              at: currentScene || '—',
              args: {}
            }
          );
          if (
            verify.ok &&
            verify.data
          ) {
            const nextHint =
              MidnightSkills.invoke(
                'branch_hint'
              );
            agentAppend(
              'agent',
              MidnightAgent.name,
              `行动验证完成。\n\n${nextHint.text}`,
              {
                intent: 'continue_plan',
                skill: 'branch_hint',
                confidence: 0.88,
                at: currentScene || '—',
                args: {}
              }
            );
          }
          if (
            typeof hooks.onApproved ===
            'function'
          ) {
            hooks.onApproved(
              result,
              verify
            );
          }
        }, 300);
      };
      rejectButton.onclick = () => {
        try { if (guideStep === 3) finishGuide(); } catch (e) {}
        approveButton.disabled = true;
        rejectButton.disabled = true;
        if (
          MidnightAgent.pendingProposal &&
          MidnightAgent.pendingProposal.proposalId === proposal.proposalId
        ) {
          MidnightAgent.pendingProposal.status = 'rejected';
          MidnightAgent.pendingProposal = null;
        }
        agentAppend(
          'user',
          '你',
          `拒绝提案：${proposal.actionLabel}`
        );
        agentAppend(
          'agent',
          MidnightAgent.name,
          '行动已取消。我没有改变游戏状态。你可以要求我“分析所有选项”，或重新制定方案。',
          {
            intent: 'reject_action',
            skill: 'human_approval',
            confidence: 1,
            at: currentScene || '—',
            args: {
              proposalId: proposal.proposalId
            }
          }
        );
        wrapper.classList.add('resolved');
        if (
          typeof hooks.onRejected === 'function'
        ) {
          hooks.onRejected(proposal);
        }
      };
      actions.appendChild(approveButton);
      actions.appendChild(rejectButton);
      bubble.appendChild(summary);
      bubble.appendChild(actions);
      wrapper.appendChild(who);
      wrapper.appendChild(bubble);
      agentLog.appendChild(wrapper);
      agentLog.scrollTop = agentLog.scrollHeight;
    }

    /**
     * 使所有尚未处理的批准卡失效。
     */
    function invalidatePendingApprovalCards(
      message = '演示已结束，提案失效'
    ) {
      document
        .querySelectorAll(
          '.agent-approval:not(.resolved)'
        )
        .forEach(card => {
          card.classList.add('resolved');
          card
            .querySelectorAll('button')
            .forEach(button => {
              button.disabled = true;
            });
          const summary =
            card.querySelector(
              '.approval-summary'
            );
          if (summary) {
            summary.textContent +=
              `\n状态：${message}`;
          }
        });
    }

    function showAgentWhisper(message) {
      const el = document.getElementById('agent-whisper');

    function renderAgentAssist(sceneKey, options) {
      if (!optsBox || !Array.isArray(options) || !options.length) return;
      if (sceneKey === 'credits' || (sceneKey && sceneKey.startsWith('death'))) return;
      const hints = {
        girl_encounter: { re: /不回答/, why: '尚未确认的搭话' },
        tunnel: { re: /不看车窗/, why: '规则三' },
        qinghuai_station: { re: /留在车上/, why: '规则四' },
        qinghuai_radio: { re: /留在车上/, why: '规则四' },
        last_lamp: { re: /保持灯亮/, why: '规则五' },
        last_lamp_inspect: { re: /保持灯亮/, why: '规则五' },
        driver_talk: { re: /保持它亮着/, why: '规则五' }
      };
      const spec = hints[sceneKey];
      if (!spec) return;
      const opt = options.find(o => spec.re.test(String(o.text || '')));
      if (!opt) return;
      const bar = document.createElement('div');
      bar.id = 'agent-assist';
      const label = String(opt.text || '').replace(/<[^>]+>/g, '');
      bar.innerHTML =
        '<span>检票口建议：<b>' + label + '</b> · ' + spec.why +
        (yangShaken() ? ' · 阳气已开始改写选项顺序' : '') +
        '</span><button type="button">听取</button>';
      bar.querySelector('button').onclick = (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
        const btn = [...optsBox.querySelectorAll('.vn-opt')].find(b => spec.re.test(b.textContent || ''));
        if (btn) btn.click();
      };
      const timed = document.getElementById('timed-wrap');
      if (timed && timed.parentNode === optsBox) {
        if (timed.nextSibling) optsBox.insertBefore(bar, timed.nextSibling);

    /**
     * 预加载策略（首屏性能）
     *
     * 旧实现在脚本解析期同步 new Image() 15 张 ≈ 5.05 MB，自己把带宽塞死：
     * 手机 4G 下评委会先看到能点的界面、再撞上十几秒等图，体感比白屏更糟。
     *
     * 现在只预载「当前场景 + 下一跳可能场景」，且放到浏览器空闲时段。
     * 首屏真正需要的第一张图由 showScene() 直接设置 background-image，
     * 不依赖预载；预载只用来抹平「点选项 → 下一幕出图」的等待。
     */
    const _preloadedBg = new Set();

    function _idle(fn) {
      if (typeof requestIdleCallback === 'function') requestIdleCallback(fn, { timeout: 2000 });
      else setTimeout(fn, 300);
    }

    /** 预载单张图（同一张只发一次请求） */
    function preloadOne(src) {
      if (!src || src === 'none' || _preloadedBg.has(src)) return;
      _preloadedBg.add(src);
      const im = new Image();
      im.decoding = 'async';
      im.src = src + '?v=4.44';   // 与 showScene 的 URL 保持一致，否则命中不到缓存
    }

    /**
     * 惊吓遮罩图懒加载：把 data-src 兑现成 src。
     *
     * 这些图首屏完全不可见（opacity:0），却有约 1.59 MB，旧实现在首屏 eager 抢带宽。
     * 注意：必须在「变可见之前」就已开始加载，否则惊吓那一瞬会闪一个空框——
     * 所以除了触发点兜底调用，还在玩家真正上车后于空闲时段预热一次。
     */
    function ensureLazyImg(el) {
      if (!el) return null;
      const img = el.tagName === 'IMG' ? el : el.querySelector('img[data-src]');
      if (img && img.dataset.src) {
        img.src = img.dataset.src;
        delete img.dataset.src;
      }
      return img;
    }

    /**
     * 预热惊吓层，保证首次惊吓不是空框。
     *
     * 故意延迟：随机惊吓最早也在上车后 22 s（scheduleScare 是 22–40 s），
     * 而这三张图合计约 1.55 MB。上车那一刻的带宽应该全给第一幕出图，
     * 所以等第一幕落定后再补。触发点本身也各自调了 ensureLazyImg 兜底，
     * 所以即便玩家在预热完成前就撞上惊吓（例如很早就选了必死项），
     * 也只是那一次改为按需加载，不会没有图。
     */
    function warmScareAssets(delay) {
      setTimeout(() => {
        _idle(() => {
          ['mr-face', 'vn-jumpscare', 'red-overlay'].forEach(id => {
            ensureLazyImg(document.getElementById(id));
          });
        });
      }, typeof delay === 'number' ? delay : 9000);
    }

    /**
     * 欢迎页是否还在挡着屏幕。
     *
     * 启动时会先 showScene('prologue_platform') 把第一幕预渲染在欢迎页背后，
     * 所以「切场景」这个信号在玩家点上车之前就已经发生过一次。
     * 预载必须避开这个时机，否则又变回「首屏抢带宽」——实测那会多拉 1.68 MB。
     */
    function _welcomeVisible() {
      const w = document.getElementById('vn-welcome');
      if (!w) return false;
      return w.style.display !== 'none' && w.style.opacity !== '0';
    }

    /**
     * 预载某场景的下一跳背景图。
     *
     * 只看 next 直连目标（不递归），且最多 2 张 —— 这是投机加载，猜错就是白花带宽。
     * 主线节点普遍 2–4 个选项，按声明顺序取前 2 个已能覆盖大多数实际走法；
     * 取满 4 张就等于每切一幕多拉 1 MB 级别的量，又变回旧问题。
     *
     * 欢迎页还在时不预载：那时玩家一张图都还没看到，带宽要留给首绘。
     */
    function preloadNextHops(sceneKey) {
      const node = STORY_NODES[sceneKey];
      if (!node || _welcomeVisible()) return;
      _idle(() => {
        // 期间可能已切到别的场景（打字很快时玩家可连点），那就别再为旧场景花带宽
        if (currentScene !== sceneKey) return;
        let opts = [];
        try {
          opts = typeof node.options === 'function' ? (node.options() || []) : (node.options || []);
        } catch (e) { return; }   // options() 可能依赖尚未就绪的状态，失败就跳过预载
        let n = 0;
        for (const opt of opts) {
          if (n >= 2) break;
          if (!opt || !opt.next) continue;
          const nx = STORY_NODES[opt.next];
          if (nx && nx.bg && nx.bg !== 'none') { preloadOne(nx.bg); n++; }
        }
      });
    }

    /** 首屏只预载开场那一张，其余全部按需 */
    function preloadCriticalAssets() {
      _idle(() => {
        const first = STORY_NODES['prologue_platform'];
        if (first && first.bg) preloadOne(first.bg);
      });
    }
    preloadCriticalAssets();

    // 一键产品演示：每步带 Specs 能力标签 + 进度 + 容错
    function runProductDemo() {
      if (demoRunning) {
        agentAppend('agent', MidnightAgent.name, '演示已在进行中…可点顶栏「停止演示」。');
        return;
      }
      clearDemoTimers();
      /*
       * Demo 所有道具、成就和通关状态都运行在临时沙盒。
       */
      beginDemoIsolation();
      demoRunning = true;
      document.body.classList.add('guide-mode', 'demo-running');
      if (!isPhoneLayout()) document.body.classList.add('show-agent-trace');
      const tg = document.getElementById('agent-trace-toggle');
      if (tg) tg.classList.toggle('on', !isPhoneLayout());
      if (demoBanner) demoBanner.classList.add('on');
      agentOpen();
      unlockAudio();
      try {
        if (!synth.isPlaying) synth.start();
        GhostBrideBGM.start();
        if (toggleAmbient) toggleAmbient.innerText = '音频: 开';
      } catch (e) {}

      const jump = (key) => {
        if (!STORY_NODES[key]) {
          agentAppend('agent', MidnightAgent.name,
            `⚠ 演示节点缺失：${key}，已跳过该检查点。`);

        }

        } catch (e) {
          agentAppend('agent', MidnightAgent.name,
            `⚠ 跳转失败：${key}（${e.message || e}），继续下一步。`);
          return false;
        }
      };

      // wait = 距上一步的间隔（毫秒）。整体约 90 秒，侧栏 ▶ 产品巡览（新主线节拍）
      const steps = [
