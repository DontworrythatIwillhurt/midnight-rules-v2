  <script>
  (function(){
    // ==========================================
    // 1. Web Audio API 轨道环境音合成器
    // ==========================================
    class MidnightSynth {
        constructor() {
            this.ctx = null;
            this.baseHum = [];
            this.baseHumGain = null;
            this.isPlaying = false;
            this.screechTimer = null;
            this.clickTimer = null;
            this.bellTimer = null;
            this.heartbeatTimer = null;
            this.heartbeatRate = 1500; // 动态心跳率 (单位: 毫秒)
            this.activeOscillators = [];
            this.windNode = null;
            this.windLfo = null;
            // 中式丧乐层
            this.funeralNodes = [];
            this.funeralMaster = null;
            this.atmosphere = 0.4; // 0~1 紧张度
            this.woodfishTimer = null;
            this.suonaTimer = null;
            this.gongTimer = null;
            this.wailTimer = null;
            this.brideDrumTimer = null;
            this.ghostBrideMode = false;
            // 中国五声音阶（偏低沉的羽调式，偏哀）——「鬼新娘」迎亲哀调
            // A2 羽 · C3 宫 · D3 商 · E3 角 · G3 徵 · A3 羽
            this.pentatonic = [110.00, 130.81, 146.83, 164.81, 196.00, 220.00, 261.63, 293.66];
        }

        init() {
            if (this.ctx) return;
            try {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {
                console.warn("当前浏览器不支持 Web Audio API", e);
            }
        }

        start() {
            this.init();
            if (!this.ctx) return;
            if (this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
            if (this.isPlaying) return;

            // 1. 基准电机低鸣声（列车）
            const osc1 = this.ctx.createOscillator();
            const osc2 = this.ctx.createOscillator();
            const osc3 = this.ctx.createOscillator();
            const humGain = this.ctx.createGain();

            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(55, this.ctx.currentTime);
            osc2.type = 'sawtooth';
            osc2.frequency.setValueAtTime(77.78, this.ctx.currentTime);
            osc3.type = 'sine';
            osc3.frequency.setValueAtTime(38.89, this.ctx.currentTime);

            const filter = this.ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(65, this.ctx.currentTime);
            humGain.gain.setValueAtTime(0.04, this.ctx.currentTime);

            osc1.connect(filter);
            osc2.connect(filter);
            osc3.connect(filter);
            filter.connect(humGain);
            humGain.connect(this.ctx.destination);

            osc1.start();
            osc2.start();
            osc3.start();

            const lfo = this.ctx.createOscillator();
            const lfoGain = this.ctx.createGain();
            lfo.frequency.setValueAtTime(0.4, this.ctx.currentTime);
            lfoGain.gain.setValueAtTime(0.008, this.ctx.currentTime);
            lfo.connect(lfoGain);
            lfoGain.connect(humGain.gain);
            lfo.start();

            this.baseHum = [osc1, osc2, osc3, lfo];
            this.baseHumGain = humGain;

            // 2. 恐怖幽灵冷风合成
            try {
                const bufferSize = this.ctx.sampleRate * 2;
                const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = noiseBuffer;
                noise.loop = true;

                const windFilter = this.ctx.createBiquadFilter();
                windFilter.type = 'bandpass';
                windFilter.Q.setValueAtTime(3.5, this.ctx.currentTime);

                const windLfo = this.ctx.createOscillator();
                windLfo.frequency.setValueAtTime(0.06, this.ctx.currentTime);
                const windLfoGain = this.ctx.createGain();
                windLfoGain.gain.setValueAtTime(200, this.ctx.currentTime);

                windFilter.frequency.setValueAtTime(380, this.ctx.currentTime);

                windLfo.connect(windLfoGain);
                windLfoGain.connect(windFilter.frequency);

                const windGain = this.ctx.createGain();
                windGain.gain.setValueAtTime(0.006, this.ctx.currentTime);

                noise.connect(windFilter);
                windFilter.connect(windGain);
                windGain.connect(this.ctx.destination);

                noise.start();
                windLfo.start();

                this.windNode = noise;
                this.windLfo = windLfo;
            } catch(e) {
                console.warn("Wind synth failed", e);
            }

            // 3. 中式丧乐持续层：低沉宫商羽 drone + 木鱼/唢呐/锣
            this.startFuneralLayer();

            this.isPlaying = true;

            this.scheduleClickClack();
            this.scheduleScreech();
            this.scheduleBell();
            this.scheduleHeartbeat();
            this.scheduleWoodfish();
            this.scheduleSuonaPhrase();
            this.scheduleGong();
            this.scheduleWail();
            // 同步启动《鬼新娘》BGM（成曲优先，否则红白喜事合成）
            try { if (typeof GhostBrideBGM !== 'undefined') GhostBrideBGM.start(); } catch (e) {}
        }

        // —— 中式丧乐：持续低吟 drone ——
        startFuneralLayer() {
            if (!this.ctx) return;
            const master = this.ctx.createGain();
            master.gain.setValueAtTime(0.0, this.ctx.currentTime);
            master.gain.linearRampToValueAtTime(0.045, this.ctx.currentTime + 2.5);
            master.connect(this.ctx.destination);
            this.funeralMaster = master;

            // 羽调式三音持续：A2 / E3 / C3（空灵哀沉）
            const drones = [
                { f: 55.00, type: 'sine', g: 0.55 },     // 低八度
                { f: 110.00, type: 'triangle', g: 0.35 }, // 羽
                { f: 164.81, type: 'sine', g: 0.18 },     // 角
                { f: 130.81, type: 'sine', g: 0.12 }      // 宫（微弱）
            ];
            drones.forEach(d => {
                const osc = this.ctx.createOscillator();
                const g = this.ctx.createGain();
                const f = this.ctx.createBiquadFilter();
                osc.type = d.type;
                osc.frequency.setValueAtTime(d.f, this.ctx.currentTime);
                // 轻微失准，像老旧唢呐/唢呐伴奏走音
                const detune = this.ctx.createOscillator();
                const dg = this.ctx.createGain();
                detune.frequency.setValueAtTime(0.05 + Math.random() * 0.08, this.ctx.currentTime);
                dg.gain.setValueAtTime(d.f * 0.004, this.ctx.currentTime);
                detune.connect(dg);
                dg.connect(osc.frequency);
                f.type = 'lowpass';
                f.frequency.setValueAtTime(420, this.ctx.currentTime);
                g.gain.setValueAtTime(d.g, this.ctx.currentTime);
                osc.connect(f);
                f.connect(g);
                g.connect(master);
                osc.start();
                detune.start();
                this.funeralNodes.push(osc, detune, g, f);
            });
        }

        // 紧张度：抬高丧乐音量、加快木鱼、唢呐更密
        setAtmosphere(level) {
            this.atmosphere = Math.max(0, Math.min(1, level));
            if (typeof GhostBrideBGM !== 'undefined') {
                try { GhostBrideBGM.setVolumeByAtmosphere(this.atmosphere); } catch (e) {}
            }
            if (!this.funeralMaster || !this.ctx) return;
            const now = this.ctx.currentTime;
            // 有成曲《鬼新娘》时压低合成层；否则随紧张度升高
            const fileMute = (typeof GhostBrideBGM !== 'undefined' && GhostBrideBGM.usingFile) ? 0.35 : 1;
            const gbBoost = this.ghostBrideMode ? 1.25 : 1;
            const vol = (0.028 + this.atmosphere * 0.07) * fileMute * gbBoost;
            try {
                this.funeralMaster.gain.cancelScheduledValues(now);
                this.funeralMaster.gain.linearRampToValueAtTime(vol, now + 0.8);
            } catch (e) {}
            if (this.baseHumGain) {
                try {
                    this.baseHumGain.gain.cancelScheduledValues(now);
                    this.baseHumGain.gain.linearRampToValueAtTime(0.03 + this.atmosphere * 0.04, now + 0.6);
                } catch (e) {}
            }
        }

        // 「鬼新娘」模式：红喜事鼓点 + 白喜事哀调（无外部音频时的兜底 BGM 风格）
        setGhostBrideMode(on) {
            this.ghostBrideMode = !!on;
            if (!this.isPlaying) return;
            clearTimeout(this.brideDrumTimer);
            if (on) {
                this.scheduleBrideDrum();
                // 立刻来一句「迎亲」式唢呐哀句
                setTimeout(() => { try { this.playSuonaPhrase(); } catch (e) {} }, 400);
            }
        }

        scheduleBrideDrum() {
            if (!this.isPlaying || !this.ghostBrideMode) return;
            // 喜堂鼓点却节奏发虚、越来越慢——像一场走错的婚礼
            const gap = 520 + (1 - this.atmosphere) * 280 + Math.random() * 120;
            this.brideDrumTimer = setTimeout(() => {
                this.playBrideDrum();
                this.scheduleBrideDrum();
            }, gap);
        }

        playBrideDrum() {
            if (!this.ctx || this.ctx.state === 'suspended') return;
            const now = this.ctx.currentTime;
            // 两下鼓：咚 · 咚（喜事），但混进闷锣
            [0, 0.18].forEach((off, i) => {
                try {
                    const osc = this.ctx.createOscillator();
                    const g = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(i === 0 ? 95 : 72, now + off);
                    osc.frequency.exponentialRampToValueAtTime(28, now + off + 0.18);
                    g.gain.setValueAtTime(0.0001, now + off);
                    g.gain.linearRampToValueAtTime(0.04 + this.atmosphere * 0.03, now + off + 0.01);
                    g.gain.exponentialRampToValueAtTime(0.0001, now + off + 0.22);
                    osc.connect(g);
                    g.connect(this.ctx.destination);
                    this.activeOscillators.push(osc);
                    osc.start(now + off);
                    osc.stop(now + off + 0.25);
                } catch (e) {}
            });
            if (Math.random() < 0.35 + this.atmosphere * 0.3) {
                // 偶尔一声「喜铃」走音
                try {
                    const bell = this.ctx.createOscillator();
                    const bg = this.ctx.createGain();
                    bell.type = 'sine';
                    bell.frequency.setValueAtTime(880 + Math.random() * 40, now + 0.35);
                    bell.frequency.linearRampToValueAtTime(620, now + 1.2);
                    bg.gain.setValueAtTime(0.0001, now + 0.35);
                    bg.gain.linearRampToValueAtTime(0.018, now + 0.4);
                    bg.gain.exponentialRampToValueAtTime(0.0001, now + 1.4);
                    bell.connect(bg);
                    bg.connect(this.ctx.destination);
                    this.activeOscillators.push(bell);
                    bell.start(now + 0.35);
                    bell.stop(now + 1.45);
                } catch (e) {}
            }
        }

        // 木鱼：丧仪里不规则叩击
        scheduleWoodfish() {
            if (!this.isPlaying) return;
            const gap = (1400 - this.atmosphere * 700) + Math.random() * (900 - this.atmosphere * 400);
            this.woodfishTimer = setTimeout(() => {
                this.playWoodfish();
                this.scheduleWoodfish();
            }, Math.max(420, gap));
        }

        playWoodfish() {
            if (!this.ctx || this.ctx.state === 'suspended') return;
            const now = this.ctx.currentTime;
            try {
                const osc = this.ctx.createOscillator();
                const g = this.ctx.createGain();
                const f = this.ctx.createBiquadFilter();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(780 + Math.random() * 120, now);
                osc.frequency.exponentialRampToValueAtTime(180, now + 0.08);
                f.type = 'bandpass';
                f.frequency.setValueAtTime(900, now);
                f.Q.setValueAtTime(6, now);
                const vol = 0.012 + this.atmosphere * 0.018;
                g.gain.setValueAtTime(vol, now);
                g.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
                osc.connect(f);
                f.connect(g);
                g.connect(this.ctx.destination);
                this.activeOscillators.push(osc);
                osc.start(now);
                osc.stop(now + 0.14);
                // 偶发双击（更像仪式节奏）
                if (Math.random() < 0.35 + this.atmosphere * 0.2) {
                    const osc2 = this.ctx.createOscillator();
                    const g2 = this.ctx.createGain();
                    osc2.type = 'triangle';
                    osc2.frequency.setValueAtTime(720, now + 0.14);
                    osc2.frequency.exponentialRampToValueAtTime(160, now + 0.22);
                    g2.gain.setValueAtTime(vol * 0.75, now + 0.14);
                    g2.gain.exponentialRampToValueAtTime(0.0001, now + 0.26);
                    osc2.connect(g2);
                    g2.connect(this.ctx.destination);
                    this.activeOscillators.push(osc2);
                    osc2.start(now + 0.14);
                    osc2.stop(now + 0.28);
                }
            } catch (e) {}
        }

        // 唢呐式哀句：鼻音锯齿 + 滑音，走五声
        scheduleSuonaPhrase() {
            if (!this.isPlaying) return;
            const gap = (9000 - this.atmosphere * 4500) + Math.random() * 6000;
            this.suonaTimer = setTimeout(() => {
                this.playSuonaPhrase();
                this.scheduleSuonaPhrase();
            }, Math.max(3500, gap));
        }

        playSuonaPhrase() {
            if (!this.ctx || this.ctx.state === 'suspended') return;
            const now = this.ctx.currentTime;
            // 丧乐短句：下行哀音
            const scale = this.pentatonic;
            const startIdx = 3 + Math.floor(Math.random() * 3);
            const notes = [
                scale[startIdx],
                scale[Math.max(0, startIdx - 1)],
                scale[Math.max(0, startIdx - 2)],
                scale[Math.max(0, startIdx - 3)],
                scale[Math.max(0, startIdx - 2)] * 0.98
            ];
            const baseVol = 0.008 + this.atmosphere * 0.016;
            notes.forEach((freq, i) => {
                const t = now + i * (0.42 + Math.random() * 0.12);
                try {
                    const osc = this.ctx.createOscillator();
                    const osc2 = this.ctx.createOscillator();
                    const g = this.ctx.createGain();
                    const bp = this.ctx.createBiquadFilter();
                    // 唢呐：锯齿 + 五度泛音，带共振
                    osc.type = 'sawtooth';
                    osc2.type = 'square';
                    osc.frequency.setValueAtTime(freq, t);
                    osc2.frequency.setValueAtTime(freq * 2.01, t);
                    // 哭腔滑音
                    osc.frequency.linearRampToValueAtTime(freq * (0.96 + Math.random() * 0.03), t + 0.38);
                    bp.type = 'bandpass';
                    bp.frequency.setValueAtTime(freq * 2.2, t);
                    bp.Q.setValueAtTime(8 + this.atmosphere * 6, t);
                    g.gain.setValueAtTime(0.0001, t);
                    g.gain.linearRampToValueAtTime(baseVol, t + 0.08);
                    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
                    osc.connect(bp);
                    osc2.connect(bp);
                    bp.connect(g);
                    g.connect(this.ctx.destination);
                    this.activeOscillators.push(osc, osc2);
                    osc.start(t);
                    osc2.start(t);
                    osc.stop(t + 0.6);
                    osc2.stop(t + 0.6);
                } catch (e) {}
            });
        }

        // 铜锣：远处一声闷响
        scheduleGong() {
            if (!this.isPlaying) return;
            const gap = 14000 + Math.random() * 12000 - this.atmosphere * 4000;
            this.gongTimer = setTimeout(() => {
                this.playGong();
                this.scheduleGong();
            }, Math.max(7000, gap));
        }

        playGong() {
            if (!this.ctx || this.ctx.state === 'suspended') return;
            const now = this.ctx.currentTime;
            const fundamentals = [98, 147, 196, 246];
            const vol = 0.03 + this.atmosphere * 0.04;
            fundamentals.forEach((f, i) => {
                try {
                    const osc = this.ctx.createOscillator();
                    const g = this.ctx.createGain();
                    osc.type = i % 2 === 0 ? 'sine' : 'triangle';
                    osc.frequency.setValueAtTime(f * (1 + Math.random() * 0.01), now);
                    osc.frequency.linearRampToValueAtTime(f * 0.97, now + 3.5);
                    g.gain.setValueAtTime(0.0001, now);
                    g.gain.linearRampToValueAtTime(vol / (i + 1.5), now + 0.02);
                    g.gain.exponentialRampToValueAtTime(0.0001, now + 4.2);
                    osc.connect(g);
                    g.connect(this.ctx.destination);
                    this.activeOscillators.push(osc);
                    osc.start(now);
                    osc.stop(now + 4.3);
                } catch (e) {}
            });
        }

        // 远处哭腔 / 呜咽（噪声成形）
        scheduleWail() {
            if (!this.isPlaying) return;
            const gap = 16000 + Math.random() * 14000 - this.atmosphere * 5000;
            this.wailTimer = setTimeout(() => {
                if (this.atmosphere > 0.35) this.playWail();
                this.scheduleWail();
            }, Math.max(8000, gap));
        }

        playWail() {
            if (!this.ctx || this.ctx.state === 'suspended') return;
            const now = this.ctx.currentTime;
            const dur = 2.2 + Math.random() * 1.8;
            try {
                const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * dur, this.ctx.sampleRate);
                const d = buf.getChannelData(0);
                for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
                const src = this.ctx.createBufferSource();
                src.buffer = buf;
                const bp = this.ctx.createBiquadFilter();
                bp.type = 'bandpass';
                bp.Q.setValueAtTime(10, now);
                const f0 = 480 + Math.random() * 220;
                bp.frequency.setValueAtTime(f0, now);
                bp.frequency.linearRampToValueAtTime(f0 * 1.35, now + dur * 0.5);
                bp.frequency.linearRampToValueAtTime(f0 * 0.85, now + dur);
                const g = this.ctx.createGain();
                const vol = 0.01 + this.atmosphere * 0.02;
                g.gain.setValueAtTime(0.0001, now);
                g.gain.linearRampToValueAtTime(vol, now + 0.4);
                g.gain.linearRampToValueAtTime(vol * 0.6, now + dur * 0.7);
                g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
                src.connect(bp);
                bp.connect(g);
                g.connect(this.ctx.destination);
                src.start(now);
                src.stop(now + dur);
            } catch (e) {}
        }

        stop() {
            if (!this.isPlaying) return;
            if (this.baseHum.length) {
                this.baseHum.forEach(osc => { try { osc.stop(); } catch(e){} });
                this.baseHum = [];
            }
            if (this.windNode) {
                try { this.windNode.stop(); } catch(e){}
                this.windNode = null;
            }
            if (this.windLfo) {
                try { this.windLfo.stop(); } catch(e){}
                this.windLfo = null;
            }
            if (this.funeralNodes.length) {
                this.funeralNodes.forEach(n => { try { if (n.stop) n.stop(); } catch(e){} });
                this.funeralNodes = [];
            }
            if (this.funeralMaster) {
                try { this.funeralMaster.disconnect(); } catch(e){}
                this.funeralMaster = null;
            }
            if (this.activeOscillators.length) {
                this.activeOscillators.forEach(osc => { try { osc.stop(); } catch(e){} });
                this.activeOscillators = [];
            }
            clearTimeout(this.screechTimer);
            clearTimeout(this.clickTimer);
            clearTimeout(this.bellTimer);
            clearTimeout(this.heartbeatTimer);
            clearTimeout(this.woodfishTimer);
            clearTimeout(this.suonaTimer);
            clearTimeout(this.gongTimer);
            clearTimeout(this.wailTimer);
            clearTimeout(this.brideDrumTimer);
            this.ghostBrideMode = false;
            this.isPlaying = false;
            try { if (typeof GhostBrideBGM !== 'undefined') GhostBrideBGM.stop(); } catch (e) {}
        }

        scheduleClickClack() {
            if (!this.isPlaying) return;
            this.clickTimer = setTimeout(() => {
                this.playClickClackSound();
                this.scheduleClickClack();
            }, 2500 + Math.random() * 2000);
        }

        playClickClackSound() {
            if (!this.ctx || this.ctx.state === 'suspended') return;
            const now = this.ctx.currentTime;
            this.triggerClick(now, 0.03);
            this.triggerClick(now + 0.12, 0.02);
            this.triggerClick(now + 0.35, 0.02);
        }

        triggerClick(time, volume) {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(60, time);
            osc.frequency.exponentialRampToValueAtTime(10, time + 0.06);
            gain.gain.setValueAtTime(volume, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.06);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            this.activeOscillators.push(osc);
            osc.start(time);
            osc.stop(time + 0.07);
        }

        scheduleScreech() {
            if (!this.isPlaying) return;
            this.screechTimer = setTimeout(() => {
                this.playScreechSound();
                this.scheduleScreech();
            }, 16000 + Math.random() * 12000);
        }

        playScreechSound() {
            if (!this.ctx || this.ctx.state === 'suspended') return;
            const now = this.ctx.currentTime;
            const duration = 1.2 + Math.random() * 1.0;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const filter = this.ctx.createBiquadFilter();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(880, now);
            osc.frequency.linearRampToValueAtTime(520, now + duration);
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(700, now);
            filter.Q.setValueAtTime(5, now);

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(this.ctx.destination);
            this.activeOscillators.push(osc);
            osc.start(now);
            osc.stop(now + duration);
        }

        scheduleBell() {
            if (!this.isPlaying) return;
            this.bellTimer = setTimeout(() => {
                this.playHauntingBell();
                this.scheduleBell();
            }, 8000 + Math.random() * 8000);
        }

        playHauntingBell() {
            if (!this.ctx || this.ctx.state === 'suspended') return;
            const now = this.ctx.currentTime;
            const freq = 110 + Math.random() * 60;

            const osc1 = this.ctx.createOscillator();
            const osc2 = this.ctx.createOscillator();
            const gain = this.ctx.createGain();

            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(freq, now);
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(freq * 1.618, now);

            gain.gain.setValueAtTime(0.0, now);
            gain.gain.linearRampToValueAtTime(0.015, now + 0.15);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 6.0);

            const filter = this.ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(350, now);

            osc1.connect(filter);
            osc2.connect(filter);
            filter.connect(gain);
            gain.connect(this.ctx.destination);

            this.activeOscillators.push(osc1, osc2);
            osc1.start(now);
            osc2.start(now);
            osc1.stop(now + 6.1);
            osc2.stop(now + 6.1);
        }

        scheduleHeartbeat() {
            if (!this.isPlaying) return;
            this.heartbeatTimer = setTimeout(() => {
                this.playHeartbeat();
                this.scheduleHeartbeat();
            }, this.heartbeatRate);
        }

        playHeartbeat() {
            if (!this.ctx || this.ctx.state === 'suspended') return;
            const now = this.ctx.currentTime;

            const playPulse = (delay, volume) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(45, now + delay);
                osc.frequency.exponentialRampToValueAtTime(25, now + delay + 0.25);

                gain.gain.setValueAtTime(0.0, now + delay);
                gain.gain.linearRampToValueAtTime(volume, now + delay + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + delay + 0.25);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                this.activeOscillators.push(osc);
                osc.start(now + delay);
                osc.stop(now + delay + 0.26);
            };

            playPulse(0, 0.07);
            playPulse(0.24, 0.05);
        }

        // 贴耳低语合成
        playWhisper() {
            if (!this.ctx || this.ctx.state === 'suspended') return;
            const now = this.ctx.currentTime;
            try {
                const dur = 1.4;
                const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * dur, this.ctx.sampleRate);
                const d = buf.getChannelData(0);
                for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
                const src = this.ctx.createBufferSource();
                src.buffer = buf;

                const bp = this.ctx.createBiquadFilter();
                bp.type = 'bandpass';
                bp.Q.setValueAtTime(8, now);
                bp.frequency.setValueAtTime(600 + Math.random() * 600, now);
                bp.frequency.linearRampToValueAtTime(1400 + Math.random() * 800, now + dur);

                const g = this.ctx.createGain();
                g.gain.setValueAtTime(0, now);
                [0, 0.35, 0.8].forEach((t) => {
                    g.gain.linearRampToValueAtTime(0.02 + Math.random() * 0.015, now + t + 0.1);
                    g.gain.exponentialRampToValueAtTime(0.001, now + t + 0.3);
                });

                let pan = null;
                if (this.ctx.createStereoPanner) {
                    pan = this.ctx.createStereoPanner();
                    pan.pan.setValueAtTime(Math.random() * 1.6 - 0.8, now);
                }

                src.connect(bp);
                bp.connect(g);
                if (pan) {
                    g.connect(pan);
                    pan.connect(this.ctx.destination);
                } else {
                    g.connect(this.ctx.destination);
                }
                src.start(now);
                src.stop(now + dur);
            } catch (e) {}
        }

        // 📻 对讲机雪花噪声 (新增)
        playStatic(dur) {
            if (!this.ctx || this.ctx.state === 'suspended') return;
            dur = dur || 1.6;
            const now = this.ctx.currentTime;
            try {
                const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * dur, this.ctx.sampleRate);
                const d = buf.getChannelData(0);
                for (let i = 0; i < d.length; i++) {
                    d[i] = (Math.random() * 2 - 1) * (Math.random() < 0.08 ? 1 : 0.25);
                }
                const src = this.ctx.createBufferSource();
                src.buffer = buf;
                const bp = this.ctx.createBiquadFilter();
                bp.type = 'bandpass';
                bp.Q.setValueAtTime(1.2, now);
                bp.frequency.setValueAtTime(900, now);
                bp.frequency.linearRampToValueAtTime(1800, now + dur);
                const g = this.ctx.createGain();
                g.gain.setValueAtTime(0.045, now);
                g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
                src.connect(bp);
                bp.connect(g);
                g.connect(this.ctx.destination);
                src.start(now);
                src.stop(now + dur);
            } catch (e) {}
        }

        // 🆕 打字机笔画音（极轻，毛笔沙沙感）
        playTick() {
            if (!this.ctx || this.ctx.state === 'suspended') return;
            const now = this.ctx.currentTime;
            try {
                const osc = this.ctx.createOscillator();
                const g = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(1800 + Math.random() * 600, now);
                g.gain.setValueAtTime(0.004, now);
                g.gain.exponentialRampToValueAtTime(0.0001, now + 0.03);
                osc.connect(g);
                g.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.035);
            } catch (e) {}
        }

        playScream(now) {
            const freqs = [780, 810, 850, 920, 1150, 1200, 1310];
            const vibratoFreq = 22;

            freqs.forEach((f) => {
                const osc = this.ctx.createOscillator();
                const oscGain = this.ctx.createGain();
                const vib = this.ctx.createOscillator();
                const vibGain = this.ctx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(f, now);
                osc.frequency.exponentialRampToValueAtTime(f * 0.65, now + 1.5);

                vib.type = 'sine';
                vib.frequency.setValueAtTime(vibratoFreq, now);
                vibGain.gain.setValueAtTime(f * 0.08, now);

                vib.connect(vibGain);
                vibGain.connect(osc.frequency);

                oscGain.gain.setValueAtTime(0, now);
                oscGain.gain.linearRampToValueAtTime(0.04, now + 0.05);
                oscGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.8);

                osc.connect(oscGain);
                oscGain.connect(this.ctx.destination);

                this.activeOscillators.push(osc, vib);
                osc.start(now);
                vib.start(now);
                osc.stop(now + 1.9);
                vib.stop(now + 1.9);
            });

            try {
                const bufferSize = this.ctx.sampleRate * 1.5;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noiseNode = this.ctx.createBufferSource();
                noiseNode.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(1200, now);
                filter.frequency.exponentialRampToValueAtTime(600, now + 1.5);
                filter.Q.setValueAtTime(2.0, now);

                const noiseGain = this.ctx.createGain();
                noiseGain.gain.setValueAtTime(0, now);
                noiseGain.gain.linearRampToValueAtTime(0.06, now + 0.05);
                noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.5);

                noiseNode.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(this.ctx.destination);

                noiseNode.start(now);
                noiseNode.stop(now + 1.6);
            } catch (e) {}
        }

        playDeathSound(deathType) {
            this.stop();
            this.init();
            if (!this.ctx) return;
            if (this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
            this.isPlaying = true;
            const now = this.ctx.currentTime;

            this.playScream(now);

            if (deathType === 'death_red') {
                const freqs = [1500, 1800, 2200, 2600];
                freqs.forEach((f) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(f, now);

                    const lfo = this.ctx.createOscillator();
                    const lfoGain = this.ctx.createGain();
                    lfo.frequency.setValueAtTime(15, now);
                    lfoGain.gain.setValueAtTime(0.005, now);

                    gain.gain.setValueAtTime(0.0, now);
                    gain.gain.linearRampToValueAtTime(0.02, now + 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 4.0);

                    lfo.connect(lfoGain);
                    lfoGain.connect(gain.gain);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    this.activeOscillators.push(osc, lfo);
                    osc.start(now);
                    lfo.start(now);
                    osc.stop(now + 4.1);
                    lfo.stop(now + 4.1);
                });
            } else if (deathType === 'death_seller' || deathType === 'death_seller_face') {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(30, now + 3.0);

                const bufferSize = this.ctx.sampleRate * 3;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() > 0.985 ? (Math.random() * 2 - 1) * 0.4 : 0;
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const noiseGain = this.ctx.createGain();
                noiseGain.gain.setValueAtTime(0.03, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 3.0);

                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 3.0);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                noise.connect(noiseGain);
                noiseGain.connect(this.ctx.destination);

                this.activeOscillators.push(osc);
                osc.start(now);
                osc.stop(now + 3.1);
                noise.start(now);
                noise.stop(now + 3.1);
            } else if (deathType === 'death_window') {
                const bufferSize = this.ctx.sampleRate * 0.5;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.setValueAtTime(3200, now);

                const noiseGain = this.ctx.createGain();
                noiseGain.gain.setValueAtTime(0.12, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);

                noise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(this.ctx.destination);

                const rumble = this.ctx.createOscillator();
                const rumbleGain = this.ctx.createGain();
                rumble.type = 'triangle';
                rumble.frequency.setValueAtTime(80, now);
                rumble.frequency.linearRampToValueAtTime(35, now + 2.5);

                rumbleGain.gain.setValueAtTime(0.15, now);
                rumbleGain.gain.exponentialRampToValueAtTime(0.0001, now + 2.5);

                rumble.connect(rumbleGain);
                rumbleGain.connect(this.ctx.destination);

                this.activeOscillators.push(rumble);
                noise.start(now);
                noise.stop(now + 0.6);
                rumble.start(now);
                rumble.stop(now + 2.6);
            } else if (deathType === 'death_insanity') {
                const freqs = [220, 233, 311, 466];
                freqs.forEach((f) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(f, now);
                    osc.frequency.linearRampToValueAtTime(f * 0.5, now + 4.5);

                    gain.gain.setValueAtTime(0.0, now);
                    gain.gain.linearRampToValueAtTime(0.03, now + 0.8);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 5.0);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    this.activeOscillators.push(osc);
                    osc.start(now);
                    osc.stop(now + 5.1);
                });
            } else if (deathType === 'death_dark') {
                // 🆕 引火烧身：密集爬行声 + 低音压迫
                try {
                    const dur2 = 3.0;
                    const buf2 = this.ctx.createBuffer(1, this.ctx.sampleRate * dur2, this.ctx.sampleRate);
                    const dd = buf2.getChannelData(0);
                    for (let i = 0; i < dd.length; i++) {
                        dd[i] = (Math.random() * 2 - 1) * (Math.random() < 0.3 ? 0.7 : 0.08);
                    }
                    const src2 = this.ctx.createBufferSource();
                    src2.buffer = buf2;
                    const bp2 = this.ctx.createBiquadFilter();
                    bp2.type = 'highpass';
                    bp2.frequency.setValueAtTime(2000, now);
                    const g2 = this.ctx.createGain();
                    g2.gain.setValueAtTime(0.05, now);
                    g2.gain.exponentialRampToValueAtTime(0.0001, now + dur2);
                    src2.connect(bp2);
                    bp2.connect(g2);
                    g2.connect(this.ctx.destination);
                    src2.start(now);
                    src2.stop(now + dur2);
                } catch (e) {}
                const osc5 = this.ctx.createOscillator();
                const gain5 = this.ctx.createGain();
                osc5.type = 'sine';
                osc5.frequency.setValueAtTime(50, now);
                osc5.frequency.linearRampToValueAtTime(28, now + 3.0);
                gain5.gain.setValueAtTime(0.14, now);
                gain5.gain.exponentialRampToValueAtTime(0.0001, now + 3.0);
                osc5.connect(gain5);
                gain5.connect(this.ctx.destination);
                this.activeOscillators.push(osc5);
                osc5.start(now);
                osc5.stop(now + 3.1);
            } else {
                const freqs = [650, 780, 910, 1050];
                freqs.forEach((f) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';

                    const lfo = this.ctx.createOscillator();
                    const lfoGain = this.ctx.createGain();
                    lfo.frequency.setValueAtTime(30, now);
                    lfoGain.gain.setValueAtTime(50, now);

                    osc.frequency.setValueAtTime(f, now);
                    osc.frequency.exponentialRampToValueAtTime(f * 1.4, now + 0.35);

                    gain.gain.setValueAtTime(0.0, now);
                    gain.gain.linearRampToValueAtTime(0.05, now + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.5);

                    lfo.connect(lfoGain);
                    lfoGain.connect(osc.frequency);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    this.activeOscillators.push(osc, lfo);
                    osc.start(now);
                    lfo.start(now);
                    osc.stop(now + 2.6);
                    lfo.stop(now + 2.6);
                });
            }
        }

        playNormalWinBGM() {

    const synth = new MidnightSynth();

    // ==========================================
    // 1.5 🎵 《鬼新娘》BGM 播放器
    // - 手机优先 mp3/m4a（iOS 不支持 ogg）
    // - 本地 file:// 打开时禁止用 fetch（会被浏览器拦截导致「没 BGM」）
    // - 直接用 <audio> 的 error/canplay 切换候选文件
    // ==========================================
    const GhostBrideBGM = {
      el: null,
      candidates: [
        { url: 'bgm_ghost_bride.mp3', mime: 'audio/mpeg' },
        { url: 'bgm_ghost_bride.m4a', mime: 'audio/mp4' },
        { url: 'ghost_bride.mp3', mime: 'audio/mpeg' },
        { url: 'bgm_ghost_bride.ogg', mime: 'audio/ogg' },
        { url: 'ghost_bride.ogg', mime: 'audio/ogg' },
        { url: 'bgm.mp3', mime: 'audio/mpeg' }
      ],
      fileReady: false,
      wanted: false,
      usingFile: false,
      baseVolume: 0.48,
      currentUrl: '',
      _queue: [],
      _idx: 0,
      _probing: false,
      _bound: false,

      _setStatus(txt) {
        const el = document.getElementById('bgm-status');
        if (el) el.textContent = txt;
      },

      init() {
        this.el = document.getElementById('bgm-ghost-bride');
        if (!this.el) return;
        this.el.loop = true;
        this.el.playsInline = true;
        this.el.setAttribute('playsinline', '');
        this.el.setAttribute('webkit-playsinline', '');
        this.el.preload = 'auto';
        this.el.volume = this.baseVolume;
        if (!this._bound) {
          this._bound = true;
          // 加载/解码失败 → 换下一个格式（不依赖 fetch）
          this.el.addEventListener('error', () => {
            if (!this._probing) return;
            console.warn('[午夜规则] BGM 加载失败，换下一格式:', this.currentUrl);
            this.fileReady = false;
            this.usingFile = false;
            this._setStatus('♪ 哀乐探测中…');
            this._tryNext();
          });
          this.el.addEventListener('canplay', () => {
            if (!this.currentUrl) return;
            this.fileReady = true;
            this.usingFile = true;
            this._probing = false;
            this._setStatus('🎵 鬼新娘·成曲已载');
            console.info('[午夜规则] BGM 就绪:', this.currentUrl);
            if (this.wanted) this._playEl();
          });
          this.el.addEventListener('loadeddata', () => {
            if (!this.currentUrl || this.fileReady) return;
            this.fileReady = true;
            this.usingFile = true;
            this._probing = false;
            this._setStatus('🎵 鬼新娘·成曲已载');
            if (this.wanted) this._playEl();
          });
        }
        this._queue = this._buildQueue();
        this._idx = 0;
        this._tryNext();
      },

      _scoreMime(mime) {
        try {
          const a = document.createElement('audio');
          const r = (a.canPlayType(mime) || '').toLowerCase();
          if (r === 'probably') return 3;
          if (r === 'maybe') return 2;
          if (mime.indexOf('mpeg') >= 0) return 1; // 部分 WebView 返回空但仍可播 mp3
          if (mime.indexOf('ogg') >= 0) return 1;  // 桌面 Chrome 常可播
          return 0;
        } catch (e) {
          return 1;
        }
      },

      _buildQueue() {
        const q = this.candidates
          .map(c => ({ ...c, score: this._scoreMime(c.mime) }))
          .filter(c => c.score > 0)
          .sort((a, b) => b.score - a.score);
        // 保证至少尝试 mp3/ogg（file 协议下 canPlayType 偶发异常）
        if (!q.length) {
          return [
            { url: 'bgm_ghost_bride.mp3', mime: 'audio/mpeg', score: 1 },
            { url: 'bgm_ghost_bride.ogg', mime: 'audio/ogg', score: 1 }
          ];
        }
        return q;
      },

      _tryNext() {
        if (!this.el) return;
        if (this._idx >= this._queue.length) {
          this.fileReady = false;
          this.usingFile = false;
          this.currentUrl = '';
          this._probing = false;
          this._setStatus('♪ 合成哀乐（未载到成曲）');
          console.info('[午夜规则] 无可用《鬼新娘》文件，改用合成 BGM（请确认 mp3/ogg 与 index.html 同目录）');
          if (this.wanted) {
            try { synth.setGhostBrideMode(true); } catch (e) {}
          }
          return;
        }
        const item = this._queue[this._idx++];
        this.currentUrl = item.url;
        this.fileReady = false;
        this.usingFile = false;
        this._probing = true;
        try {
          // 直接挂到 audio，不使用 fetch（file:// 下 fetch 必失败）
          this.el.removeAttribute('src');
          this.el.src = item.url;
          this.el.load();
          // 超时保护：部分浏览器不触发 error 也不 canplay
          const urlSnap = item.url;
          setTimeout(() => {
            if (this.currentUrl !== urlSnap) return;
            if (this.fileReady) return;
            // readyState: 0=无 1=metadata 2=current 3=future 4=enough
            if (this.el.readyState >= 2) {
              this.fileReady = true;
              this.usingFile = true;
              this._probing = false;
              this._setStatus('🎵 鬼新娘·成曲已载');
              if (this.wanted) this._playEl();
            } else {
              console.warn('[午夜规则] BGM 超时无响应，换下一格式:', urlSnap);
              this._tryNext();
            }
          }, 1800);
        } catch (e) {
          this._tryNext();
        }
      },

      _playEl() {
        if (!this.el) return;
        // 只要已指定 src 就尝试播；fileReady 可能略滞后
        if (!this.currentUrl && !this.el.src) return;
        try {
          this.el.muted = false;
          this.el.volume = this.baseVolume;
          const p = this.el.play();
          if (p && p.catch) {
            p.catch((err) => {
              console.warn('[午夜规则] BGM play 被拦截，请再点「音频: 开」', err && err.message);
            });
          } else {
            this.fileReady = true;
            this.usingFile = true;
          }
          // 成功播放时压低合成层
          if (synth.funeralMaster && synth.ctx) {
            try {
              synth.funeralMaster.gain.setTargetAtTime(0.006, synth.ctx.currentTime, 0.5);
            } catch (e) {}
          }
          try { synth.setGhostBrideMode(false); } catch (e) {}
        } catch (e) {
          console.warn(e);
        }
      },

      start() {
        this.wanted = true;
        if (!this.el) this.init();
        // 用户点击瞬间立刻 play（满足自动播放策略）
        if (this.currentUrl || (this.el && this.el.src)) {
          this._playEl();
        } else if (!this._probing) {
          this._idx = 0;
          this._tryNext();
          // 下一帧再试（src 刚挂上）
          setTimeout(() => this._playEl(), 50);
          setTimeout(() => this._playEl(), 400);
        } else {
          setTimeout(() => this._playEl(), 50);
          setTimeout(() => this._playEl(), 400);
        }
        // 探测未完成前用合成垫底，避免完全静音
        if (!this.usingFile) {
          this._setStatus('♪ 合成哀乐（探测中）');
          try { synth.setGhostBrideMode(true); } catch (e) {}
        }
      },

      stop() {
        this.wanted = false;
        if (this.el) {
          try { this.el.pause(); this.el.currentTime = 0; } catch (e) {}
        }
        try { synth.setGhostBrideMode(false); } catch (e) {}
      },

      setVolumeByAtmosphere(atm) {
        if (this.el && this.usingFile) {
          this.el.volume = Math.min(0.68, this.baseVolume - 0.06 + atm * 0.2);
        }
      }
    };
    GhostBrideBGM.init();

    // ==========================================
    // 3. 🧠 心神值 & 🌀 侵蚀度 & 🎲 每局随机系统
    // ==========================================
    let sanity = 100;
    let sanityMax = 100;
    let currentScene = '';
    let runStartTime = Date.now();
    let demoRunning = false; // C/F：演示模式（关闭乱码、跳过随机插曲、加速打字）
    let runEndingCounted = false; // 本局是否已计入通关次数（防重复 +1）

    // 每局独立随机种子 (mulberry32)
    function mulberry32(a) {
      return function() {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        var t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    let runRNG = mulberry32(Date.now() % 2147483647);
    let usedInterludes = new Set();
    let glitchedRuleId = null;

    function resetRunRandom() {
      runRNG = mulberry32((Date.now() ^ (Math.random() * 0xffffffff)) % 2147483647);
      usedInterludes = new Set();
      const ids = RULES.map(r => r.id);
      glitchedRuleId = ids[Math.floor(runRNG() * ids.length)];
    }

    // 侵蚀度：死亡次数越多，列车对你"侵蚀"越深 (0~3级)
    function erosionLevel() {
      const d = gameState.deaths_count;
      return d >= 5 ? 3 : (d >= 3 ? 2 : (d >= 1 ? 1 : 0));
    }

    function recomputeSanityMax() {
      sanityMax = Math.max(60, 100 - Math.min(gameState.deaths_count * 4, 40));
    }

    function updateSanityUI() {
      const pct = Math.max(0, Math.round(sanity / sanityMax * 100));
      document.getElementById('sanity-fill').style.width = pct + '%';
      document.getElementById('sanity-num').innerText = Math.round(sanity);
      // 心神状态档：正常 / 低 / 危急
      document.body.classList.toggle('low-sanity', sanity <= 40);
      document.body.classList.toggle('critical-sanity', sanity <= 20);
      // 危急时丧乐/BGM 更贴耳
      if (synth.isPlaying) {
        const extra = sanity <= 20 ? 0.15 : (sanity <= 40 ? 0.08 : 0);
        // 不直接覆盖场景 atm，只微调心跳
        if (sanity <= 30) {
          synth.heartbeatRate = Math.max(340, Math.round((synth.heartbeatRate || 900) * 0.92));
        }
      }
    }

    function showSanityToast(delta) {
      const el = document.getElementById('sanity-toast');
      if (!el || !delta) return;
      const sign = delta > 0 ? '+' : '';
      el.textContent = delta > 0
        ? `阳气 ${sign}${delta} · 神志略清`
        : `阳气 ${delta} · 心神受挫`;
      el.classList.remove('show', 'good', 'bad');
      void el.offsetWidth;
      el.classList.add('show', delta > 0 ? 'good' : 'bad');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 1600);
    }

    function applySanity(delta, opts) {
      // 已在死亡/结局结算中，不再改心神
      if (!currentScene && !(opts && opts.force)) return;
      if (currentScene && (currentScene.startsWith('death') || currentScene.startsWith('win') || currentScene === 'credits')) return;
      if (!delta) return;
      // 持有红绳时，负面心神损耗减轻
      let d = delta;
      if (d < 0 && gameState.has_charm) d = Math.ceil(d * 0.7);
      // 持有白烛时，烛光场景外的微弱庇护
      if (d < 0 && gameState.has_candle && currentScene && currentScene.includes('dark')) d = Math.ceil(d * 0.85);

      const before = sanity;
      sanity = Math.max(0, Math.min(sanityMax, sanity + d));
      updateSanityUI();
      if (!(opts && opts.silent) && Math.round(sanity) !== Math.round(before)) {
        showSanityToast(Math.round(sanity - before));
      }
      if (sanity <= 0) {
        setTimeout(() => {
          if (!currentScene || !currentScene.startsWith('death')) showScene('death_insanity');
        }, 60);
      }
      return d;
    }

    function sanityTier() {
      if (sanity <= 15) return 0; // 崩溃边缘

      if (t === 1) return '\n\n<span class="r">（视线边缘有什么在动。你不敢确认那是影子，还是“乘客”。）</span>';
      if (t === 2) return '\n\n<span class="g">（你还能稳住呼吸。阳气尚存，规则就还听得见。）</span>';
      return '';
    }

    // F：默认关闭正文污染（避免像字体乱码）；仅显式关闭评审洁净时才启用极轻污染
    let reviewCleanMode = true;
    function glitchify(text, intensity) {
      if (reviewCleanMode || demoRunning || document.body.classList.contains('review-mode')) return text;
      const maxI = Math.min(intensity || 0, 0.02);
      if (maxI <= 0) return text;
      const chars = '囗乂厶彡';
      let out = '';
      let inTag = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '<') { inTag = true; out += c; continue; }
        if (c === '>') { inTag = false; out += c; continue; }
        if (inTag || c === '\n' || c === ' ' || c === '　') { out += c; continue; }
        const code = c.charCodeAt(0);
        if (code >= 0x4e00 && code <= 0x9fff && Math.random() < maxI) {
          out += chars[Math.floor(Math.random() * chars.length)];
          continue;
        }
        out += c;
      }
      return out;
    }

      if (!opt) return false;

      return n.startsWith('death') || e.startsWith('death');
    }

    function isSafeTarget(opt) {
      if (!opt || isDeathTarget(opt)) return false;
      if (opt.safe === false) return false;
      if (opt.safe === true) return true;
      const n = opt.next || '';
      const txt = opt.text || '';
      // 假结局 / 诱饵不算「生路」
      if (n === 'win_normal' || n === 'death_final') return false;
      if (/拉下.*阀|立刻拉|买票|闪光灯|看窗外|直视|拍拍红衣|朝窗外|也许真该买/.test(txt)) return false;
      // 明确求生/推进线索
      if (/拒绝拉|静坐|等待|白烛|工牌|纸条|闭眼|捂住|抱紧|抱住|冷淡地拒绝|记下守则|收好|护着烛|熄灭所有|摸黑|屏住|出示|取下|登上列车|拒绝买票|静等/.test(txt)) return true;
      if (/win_true|candle|badge|search|notice|red_survive|candlelight|heaven_glow|prologue_board|car4_brake/.test(n)) {

    function typeWriter(element, text, speed, callback) {
      clearTimeout(textTimer);
      element.innerHTML = "";
      let i = 0;
      isTyping = true;
      currentFullText = text;
      currentCallback = callback;
      currentElement = element;
      // Demo：略快于正常，但仍可读（勿跳字）
      if (demoRunning) speed = Math.max(10, Math.min(speed || 15, 12));

      const panel = document.getElementById('vn-panel');
      if (panel) panel.style.cursor = 'pointer';
      if (typeHint) typeHint.style.display = 'block';

      function type() {
        if (i < text.length) {
          // Demo：小段吐出，兼顾节奏与可读
          const chunk = demoRunning ? Math.min(4, text.length - i) : 1;
          if (text.charAt(i) === '<' || chunk === 1) {
            if (text.charAt(i) === '<') {
              let tagEnd = text.indexOf('>', i);
              if (tagEnd !== -1) {
                element.innerHTML += text.substring(i, tagEnd + 1);
                i = tagEnd + 1;
              } else {
                element.innerHTML += text.charAt(i);
                i++;
              }
            } else {
              element.innerHTML += text.charAt(i);
              i++;
              if (synth.isPlaying && i % 3 === 0) synth.playTick();
            }
          } else {
            let end = i + chunk;
            // 不把标签切断
            const lt = text.indexOf('<', i);
            if (lt !== -1 && lt < end) end = lt;
            element.innerHTML += text.substring(i, end);
            i = end;
          }
          textTimer = setTimeout(type, speed);
        } else {
          isTyping = false;
          if (panel) panel.style.cursor = 'default';
          if (typeHint) typeHint.style.display = 'none';
          const cb = currentCallback;
          currentCallback = null;
          if (cb) cb();
        }
      }
      type();
    }

    function skipTypewriter() {
      if (!isTyping || !currentElement) return;
      clearTimeout(textTimer);
      isTyping = false;

      const panel = document.getElementById('vn-panel');
      if (panel) panel.style.cursor = 'default';
      if (typeHint) typeHint.style.display = 'none';

      currentElement.innerHTML = currentFullText;
      const cb = currentCallback;
      currentCallback = null;
      if (cb) cb();
    }

      if (e.target.closest('.vn-opt') || e.target.closest('.vn-mini') || e.target.closest('.tree-btn')) {

      }
      if (isTyping) {

      for (let i = 0; i < particleCount; i++) {
        const p = document.createElement('div');
        p.className = 'ash-particle';
        const size = Math.random() * 5 + 2;
        p.style.width = `${size}px`;
        p.style.height = `${size}px`;
        p.style.left = `${Math.random() * 100}vw`;

        const duration = Math.random() * 4 + 3.5;
        const delay = Math.random() * 3.5;
        p.style.animationDuration = `${duration}s`;
        p.style.animationDelay = `${delay}s`;

        if (Math.random() > 0.5) {
          p.style.borderRadius = '50%';
        }
        container.appendChild(p);
      }

      setTimeout(() => {
        container.style.transition = 'opacity 2.5s ease-out';
        container.style.opacity = '0';
        setTimeout(() => {
          container.innerHTML = '';
          container.style.transition = 'none';
          container.style.opacity = '1';
        }, 2500);
      }, 7500);
    }

    // ==========================================
    // 8. ✨ 画面微粒/血滴/惊吓/侵蚀 视觉系统
    // ==========================================
    function setFx(type) {
      clearInterval(fxTimer);
      fxTimer = null;
      const layer = document.getElementById('vn-particles');
      layer.innerHTML = '';
      if (!type || type === 'none') return;
      fxTimer = setInterval(() => { spawnParticle(layer, type); }, type === 'rain' ? 170 : (type === 'ember' ? 700 : 900));
    }

    function spawnParticle(layer, type) {
      if (layer.childElementCount > 30) return;
      const p = document.createElement('div');
      p.className = 'vn-p ' + type;
      if (type === 'rain') {
        p.style.width = '2px';
        p.style.height = (10 + Math.random() * 16) + 'px';
        p.style.left = (Math.random() * 100) + '%';
        p.style.animationDuration = (1.1 + Math.random() * 0.9) + 's';
        layer.appendChild(p);
        setTimeout(() => p.remove(), 2400);
        return;
      }
      const size = (type === 'ember' || type === 'hellfire') ? 2 + Math.random() * 3 : 1 + Math.random() * 2.5;
      p.style.width = p.style.height = size + 'px';
      p.style.left = (Math.random() * 100) + '%';
      p.style.animationDuration = (6 + Math.random() * 6) + 's';
      p.style.animationDelay = (Math.random() * 2) + 's';
      layer.appendChild(p);
      setTimeout(() => p.remove(), 14000);
    }

    function spawnBlood() {
      const layer = document.getElementById('vn-blood');
      layer.innerHTML = '';
      for (let i = 0; i < 9; i++) {
        const d = document.createElement('div');
        d.className = 'vn-drip';
        d.style.left = (5 + Math.random() * 90) + '%';
        d.style.height = (60 + Math.random() * 180) + 'px';
        d.style.animationDuration = (2.2 + Math.random() * 2.5) + 's';
        d.style.animationDelay = (Math.random() * 1.5) + 's';
        layer.appendChild(d);
      }
    }

    function clearBlood() {
      document.getElementById('vn-blood').innerHTML = '';
    }

    // 随机惊吓事件调度器
    function scheduleScare() {
      clearTimeout(scareTimer);
      scareTimer = setTimeout(() => {
        maybeScare();
        scheduleScare();
      }, 22000 + Math.random() * 18000);
    }

    function maybeScare() {
      if (!currentScene || currentScene.startsWith('death') || currentScene.startsWith('win')
          || currentScene.startsWith('epilogue') || currentScene === 'credits') return;
      if (document.getElementById('rulebook').classList.contains('open')) return;
      if (welcomeScreen.style.display !== 'none' && welcomeScreen.style.opacity !== '0') return;

      const lvl = erosionLevel();
      const pool = ['whisper'];
      if (lvl >= 1) pool.push('face');
      if (lvl >= 2) pool.push('blackout', 'face');
      if (lvl >= 3) pool.push('blackout', 'whisper');

      const pick = pool[Math.floor(Math.random() * pool.length)];
      if (pick === 'face') faceFlash();
      else if (pick === 'blackout') blackoutPulse();
      else whisperScare();
    }

    function faceFlash() {
      const f = document.getElementById('mr-face');
      f.style.left = (8 + Math.random() * 70) + '%';
      f.style.top = (12 + Math.random() * 35) + '%';
      f.classList.add('show');
      if (synth.isPlaying) synth.playWhisper();
      setTimeout(() => f.classList.remove('show'), 700 + Math.random() * 500);
    }

    function blackoutPulse() {
      const b = document.getElementById('vn-blackout');
      b.classList.add('on');
      setTimeout(() => b.classList.remove('on'), 160 + Math.random() * 240);
    }

    function whisperScare() {
      if (synth.isPlaying) synth.playWhisper();
      applySanity(-3);
      if (erosionLevel() >= 2) {
        const oldColor = dot.style.color;
        const oldText = statusTxt.innerText;
        dot.style.color = '#e02626';
        statusTxt.innerText = '长明'; // 红灯却显示"安全"，它在骗你
        setTimeout(() => {
          if (!currentScene.startsWith('death')) {
            dot.style.color = oldColor;
            statusTxt.innerText = oldText;
          }
        }, 2200);
      }
    }

    function flashJumpscare() {
      const j = document.getElementById('vn-jumpscare');
      j.classList.add('on');
      setTimeout(() => j.classList.remove('on'), 650);
    }

    // 红衣人浮现层：侵蚀度越高越清晰；满级时露出双眼
    function updateRedOverlay(sceneKey) {
      const wrap = document.getElementById('red-wrap');
      const eyes = document.getElementById('red-eyes');
      const lvl = erosionLevel();
      const inCars = /^(car1|car2|car3_init|car3_red_survive|car3_heaven_glow)/.test(sceneKey);
      if (lvl >= 2 && inCars) {
        wrap.style.opacity = lvl >= 3 ? 0.42 : 0.25;
        eyes.classList.toggle('on', lvl >= 3);
      } else {
        wrap.style.opacity = 0;
        eyes.classList.remove('on');
      }
    }

    // ⏱️ 限时抉择
    function startTimed(t) {
      clearInterval(timedTimer);
      timedTimer = null;
      const wrap = document.createElement('div');
      wrap.id = 'timed-wrap';
      wrap.innerHTML = `<div id="timed-label">⚠️ 阴风刺骨——速做决断！<span id="timed-num">${t.seconds}</span></div><div id="timed-bar"><div id="timed-fill"></div></div>`;
      optsBox.prepend(wrap);
      const fill = wrap.querySelector('#timed-fill');
      const num = wrap.querySelector('#timed-num');
      const total = t.seconds * 1000;
      const startT = Date.now();
      const boundScene = currentScene;
      timedTimer = setInterval(() => {
        // 已离开该节点则停表
        if (currentScene !== boundScene) {
          clearInterval(timedTimer);
          timedTimer = null;
          return;
        }
        const left = total - (Date.now() - startT);
        if (left <= 0) {
          clearInterval(timedTimer);
          timedTimer = null;
          showScene(t.to);
          return;
        }
        fill.style.width = (left / total * 100) + '%';
        num.innerText = Math.ceil(left / 1000);
        if (left < 3000) fill.classList.add('critical');
      }, 100);
    }

    // 应用场景元数据：腐化滤镜 / 运镜 / 雾 / 镜像 / 微粒 / 时钟 / 氛围罩 / 丧乐
    function applyMeta(sceneKey) {
      const meta = SCENE_META[sceneKey] || { name: '车厢连接 · 异响', p: 0.3, hb: 900, fx: 'dust', mood: 'car', atm: 0.5 };

      nameTag.innerText = meta.name;

      // 剧情时钟
      if (meta.time) {
        clockEl.innerText = '🕰 ' + meta.time;
        clockEl.classList.remove('tick');
        void clockEl.offsetWidth;
        clockEl.classList.add('tick');
      }

      // 画面腐化滤镜（随剧情推进变暗、去饱和、偏色）+ 场景专属 filter
      const p = meta.p || 0;
      const dim = meta.dim || 0;
      let baseFilter;
      if (meta.warm) {
        baseFilter = 'sepia(.32) brightness(1.05) contrast(1.03)';
      } else {
        baseFilter =
          `brightness(${(1 - p * 0.3 - dim).toFixed(2)}) ` +
          `contrast(${(1 + p * 0.18).toFixed(2)}) ` +
          `saturate(${(1 - p * 0.35).toFixed(2)}) ` +
          `hue-rotate(${(-10 * p).toFixed(1)}deg)`;
      }
      if (meta.filter) baseFilter += ' ' + meta.filter;
      sceneWrap.style.filter = baseFilter;

      // 背景焦点差异：同一素材也通过取景制造不同构图
      scene.style.backgroundPosition = meta.pos || 'center center';
      scene.style.backgroundSize = meta.bgs || 'cover';

      // 中式恐怖氛围罩层
      const moodEl = document.getElementById('vn-mood');
      if (moodEl) {
        moodEl.className = '';
        if (meta.mood) {
          moodEl.classList.add('on', 'mood-' + meta.mood);
        }
      }

      // 运镜随机换向
      sceneWrap.classList.remove('kb-a', 'kb-b');
      void sceneWrap.offsetWidth;
      sceneWrap.classList.add(Math.random() < 0.5 ? 'kb-a' : 'kb-b');

      // 镜像 / 雾 / 无光之眼 / 微粒 / 隧道 / 顶灯
      mirrorWrap.classList.toggle('mirrored', !!meta.mirror);
      fogEl.classList.toggle('on', !!meta.fog);
      darkEyes.classList.toggle('on', !!meta.dark);
      document.getElementById('vn-tunnel').classList.toggle('on', !!meta.tunnel);
      document.getElementById('vn-light').classList.toggle('on', !!meta.light);
      setFx(meta.fx);

      // 心跳 + 中式丧乐紧张度
      if (synth.isPlaying) {
        if (meta.hb) {
          let base = Math.max(380, meta.hb - erosionLevel() * 120);
          if (sanity <= 30) base = Math.max(350, Math.round(base * 0.8));
          synth.heartbeatRate = base;
        }
        const atm = typeof meta.atm === 'number' ? meta.atm : p;
        synth.setAtmosphere(Math.min(1, atm + erosionLevel() * 0.08 + (sanity <= 30 ? 0.12 : 0)));
      }

      return meta;
    }

    // 剧情回溯树（终局/假结局共用）
    function renderTreeRestart(btnText) {
      optsBox.innerHTML = `
        <button class="vn-opt ultimate-restart" id="btn-loop-restart">${btnText}</button>
        <div class="tree-title">🌀 量子纠缠 · 剧情节点回溯</div>
        <div class="tree-grid">
          <button class="tree-btn" onclick="window.jumpToScene('prologue_platform')">📍 序章 · 站台 (4:41)</button>
          <button class="tree-btn" onclick="window.jumpToScene('car1_init')">📍 车厢一 (4:44)</button>
          <button class="tree-btn" onclick="window.jumpToScene('car2_transition')">📍 车门交接 (工牌)</button>
          <button class="tree-btn" onclick="window.jumpToScene('car2_init')">📍 车厢二 (买票)</button>
          <button class="tree-btn" onclick="window.jumpToScene('car3_init')">📍 车厢三 (鬼手)</button>
          <button class="tree-btn" onclick="window.jumpToScene('car4_brake')">📍 车厢四 (制动)</button>
        </div>
      `;
      document.getElementById('btn-loop-restart').onclick = triggerReset;
    }

    function showScene(sceneKey) {
      // 已在死亡结算时，忽略重复死亡触发（限时+点击竞态会双计死亡次数）
      if (currentScene && currentScene.startsWith('death') && sceneKey && sceneKey.startsWith('death')) {
        return;
      }
      unlockAudio();
      clearTimeout(textTimer);
      clearInterval(timedTimer);
      timedTimer = null;
      isTyping = false;
      currentCallback = null;
      currentElement = null;
      currentScene = sceneKey;
      scene.classList.remove('jumpscare-zoom');
      clearDeathFx();
      // 立刻清空选项，避免死亡/切场时仍可点击上一幕按钮
      optsBox.innerHTML = '';
      if (typeHint) typeHint.style.display = 'none';

      // 主动护航：高危场景进入播报（非 Demo）
      try {
        if (!demoRunning && typeof MidnightAgent !== 'undefined' && MidnightAgent.proactive) {
          if (sceneKey === 'car3_init') {
            MidnightAgent.proactive('enter_car3',
              '进入车厢三：限时抉择。勿看窗外。有纸条可抱红衣；否则闭眼捂耳。',
              'risk_assess');
          } else if (sceneKey === 'car3_darkness') {
            MidnightAgent.proactive('enter_dark',
              '无光车厢：闪光灯即死。' + (gameState.has_candle ? '点燃白烛护行。' : '熄灭所有光源，摸黑前进。'),
              'risk_assess');
          } else if (sceneKey === 'car4_brake' || sceneKey === 'car4_radio') {
            MidnightAgent.proactive('enter_car4',
              '驾驶室前：阀门可能是诱饵。可问我「离真结局还差什么」。',
              'ending_check');
          } else if (sceneKey === 'car2_init') {
            MidnightAgent.proactive('enter_car2',
              '乘务员推车接近。勿买票、勿看脸。' + (gameState.has_badge ? '你可出示 04 号工牌。' : ''),
              'item_advice');
          }
        }
      } catch (e) {}

      // 灯光干扰
      const flickerEl = document.getElementById('vn-flick');
      if (flickerEl) {
        if (sceneKey.startsWith('car3') || sceneKey.startsWith('death')) {
          flickerEl.classList.add('spooky-flicker');
        } else {
          flickerEl.classList.remove('spooky-flicker');
        }
      }

      updateRedOverlay(sceneKey);

      // BGM / 特效触发
      if (sceneKey === 'win_true') {
        if (synth.isPlaying) {
          synth.setAtmosphere(0.12);
          synth.playTrueWinBGM();
        }
      } else if (sceneKey === 'win_normal') {
        if (synth.isPlaying) {
          synth.setAtmosphere(0.28);
          synth.playNormalWinBGM();
        }
      } else if (sceneKey === 'car2_badge_ash') {
        triggerAshEffect();
        if (synth.isPlaying) synth.playGong();
      } else if (sceneKey === 'car3_init' && synth.isPlaying) {
        synth.playSuonaPhrase();
      } else if (sceneKey === 'prologue_board' && synth.isPlaying) {
        synth.playGong();
      }

      const node = STORY_NODES[sceneKey];
      if (!node) {
        console.warn('[Midnight Rules] 缺失剧情节点:', sceneKey);
        line.innerHTML = `剧情节点丢失：<span class="r">${sceneKey}</span><br>请点「再入轮回」重开。`;
        optsBox.innerHTML = `<button class="vn-opt ultimate-restart" id="btn-missing-restart">↻ 再入轮回</button>`;
        const br = document.getElementById('btn-missing-restart');
        if (br) br.onclick = triggerReset;
        return;
      }

      // 场景视觉元数据（死亡场景单独处理）
      if (!sceneKey.startsWith('death')) {
        scene.classList.remove('death-strobe');
        clearBlood();
        applyMeta(sceneKey);
      }

      const currentBg = typeof node.bg === 'function' ? node.bg() : node.bg;
      if (currentBg === 'none') {
        scene.style.backgroundImage = 'none';
        scene.style.backgroundColor = '#000';
      } else if (currentBg) {
        scene.style.backgroundColor = '';
        scene.style.backgroundImage = `url('${currentBg}?v=4.44')`;
      }

      let parsedText = typeof node.text === 'function' ? node.text() : node.text;
      // 若 text() 内因心神归零跳转到死亡，避免继续渲染本节点
      if (currentScene !== sceneKey) return;

      // 🌀 侵蚀度：仅死亡多次后对正文做极轻污染（避免被当成字体乱码）
      const lvl = erosionLevel();
      if (sceneKey.startsWith('death') && lvl >= 3) {
        parsedText = glitchify(parsedText, 0.02);
      } else if (!sceneKey.startsWith('death') && !sceneKey.startsWith('win') && !sceneKey.startsWith('epilogue') && !sceneKey.startsWith('credits') && lvl >= 3) {
        parsedText = glitchify(parsedText, 0.008);
      }

      // ===== 死亡场景分支：每种死法，都有属于自己的画面 =====
      if (sceneKey.startsWith('death')) {
        nameTag.innerText = '?? · ??:??';
        clockEl.innerText = '🕰 --:--';
        scene.classList.add('jumpscare-zoom');

        const dfx = DEATH_FX[sceneKey] || {
          tint: 'radial-gradient(circle at 50% 45%, rgba(120,12,16,.3), rgba(60,0,5,.78))',
          filter: 'brightness(.55) contrast(1.2) saturate(.8) hue-rotate(-15deg)',
          strobe: 'death-strobe', fx: 'none', mood: 'false'
        };
        sceneWrap.style.filter = dfx.filter;
        scene.style.backgroundPosition = dfx.pos || 'center center';
        if (dfx.strobe) scene.classList.add(dfx.strobe);
        if (dfx.mirror) mirrorWrap.classList.add('mirrored');
        else mirrorWrap.classList.remove('mirrored');
        if (dfx.tilt) sceneWrap.classList.add('death-tilt');
        const tintEl = document.getElementById('death-tint');
        tintEl.style.background = dfx.tint;
        tintEl.classList.add('on');
        if (dfx.crack) document.getElementById('vn-crack').classList.add('on');
        if (dfx.flashlight) document.getElementById('vn-flashlight').classList.add('on');
        if (dfx.swarm) spawnEyeSwarm();
        setFx(dfx.fx || 'none');
        // 死亡氛围罩
        const moodEl = document.getElementById('vn-mood');
        if (moodEl) {
          moodEl.className = '';
          moodEl.classList.add('on', 'mood-' + (dfx.mood || 'false'));
        }
        fogEl.classList.remove('on');
        darkEyes.classList.remove('on');
        document.getElementById('vn-tunnel').classList.remove('on');
        document.getElementById('vn-light').classList.remove('on');
        spawnBlood();
        flashJumpscare();
        if (dfx.shake) {
          document.getElementById('vn').animate([
            { transform: 'translate(2px, 2px)' }, { transform: 'translate(-4px, -3px)' },
            { transform: 'translate(4px, 3px)' }, { transform: 'translate(-2px, 2px)' },
            { transform: 'translate(0px, 0px)' }
          ], { duration: 420, iterations: 2 });
        }
        gameState.deaths_count++;
        saveGame();
        setTimeout(() => { unlockAchievement('FIRST_DEATH'); }, 1500);

        death.classList.add('on');
        dot.style.color = '#e02626';
        statusTxt.innerText = '灯 灭';

        // 死亡前先把丧乐推到极致，再切死亡尖叫
        if (synth.isPlaying) {
            synth.setAtmosphere(1);
            synth.playDeathSound(sceneKey);
        }

        typeWriter(line, parsedText.replace(/\n/g, '<br>'), 10, () => {
          // 若已切到其他场景，不再写入死亡按钮
          if (currentScene !== sceneKey) return;
          optsBox.innerHTML = `<button class="vn-opt danger ultimate-restart" id="btn-restart">⚠️ 第 ${gameState.deaths_count} 次坠落……点击还魂 ⚠️</button>`;
          document.getElementById('btn-restart').onclick = triggerReset;
        });
        return;
      }

      const safeText = parsedText.replace(/\n/g, '<br>');

      typeWriter(line, safeText, 15, () => {
        if (currentScene !== sceneKey) return;

        // ===== 假结局尾声：揭穿"阳光"的谎言 =====
        if (sceneKey === 'epilogue_normal') {
          scene.style.backgroundImage = "url('entity_glitch.gif?v=4.44')";
          scene.classList.add('death-strobe');
          dot.style.color = '#e02626';
          statusTxt.innerText = '困于阴间';
          setFx('none');
          document.getElementById('vn').animate([
            { transform: 'translate(1px, 1px) rotate(0deg)' },
            { transform: 'translate(-2px, -3px) rotate(-1deg)' },
            { transform: 'translate(2px, 2px) rotate(1deg)' },
            { transform: 'translate(0px, 0px) rotate(0deg)' }
          ], { duration: 300 });
          renderTreeRestart('⚠️ 轮回未断……点击还魂 ⚠️');
          return;
        }

        // ===== 真假结局状态灯 =====
        if (sceneKey === 'win_normal') {
          dot.style.color = '#c9a227';
          statusTxt.innerText = '未 卜';
        } else if (sceneKey === 'win_true') {
          dot.style.color = '#5a9a5a';
          statusTxt.innerText = '还 阳';
        }

        // ===== 片尾字幕：本局统计结算 =====
        if (sceneKey === 'credits') {
          dot.style.color = '#d4af37';
          statusTxt.innerText = '剧 终';
          const unlockedRules = RULES.filter(r => r.unlocked()).length;
          const elapsed = Math.max(1, Math.round((Date.now() - runStartTime) / 1000));
          const mm = String(Math.floor(elapsed / 60)).padStart(2, '0');
          const ss = String(elapsed % 60).padStart(2, '0');
          optsBox.innerHTML = `
            <div class="credits-title">午 夜 规 则 · 终</div>
            <div class="credits-stats">
              <div class="credit-item"><b>${gameState.deaths_count}</b>累计死亡</div>
              <div class="credit-item"><b>${Math.round(sanity)}</b>剩余心神</div>
              <div class="credit-item"><b>${gameState.achievements.length} / ${Object.keys(ACHIEVEMENT_LIST).length}</b>成就收集</div>
              <div class="credit-item"><b>${unlockedRules} / ${RULES.length}</b>守则破解</div>
              <div class="credit-item"><b>${mm}:${ss}</b>本局用时</div>
              <div class="credit-item"><b>${gameState.runs_completed}</b>通关次数</div>
            </div>
            <button class="vn-opt ultimate-restart" style="border-color:#5a9a5a !important; box-shadow: 0 0 20px rgba(100,223,223,0.6) !important; background: linear-gradient(180deg, #0a3a3a, #051a1a) !important;" id="btn-credits-restart">✨ 再 入 轮 回 ✨</button>
          `;
          document.getElementById('btn-credits-restart').onclick = triggerReset;
          return;
        }

        // ===== 常规选项渲染（带 event 的选项会先经过随机怪谈事件） =====
        const options = typeof node.options === 'function' ? node.options() : (node.options || []);
        // C：导览/演示时高亮「非死亡」生路，帮助评委看见机制
        const guideHighlight = demoRunning || document.body.classList.contains('guide-mode');
        options.forEach(opt => {
          if (!opt || !opt.text) return;
          const deathish = isDeathTarget(opt);
          const btn = document.createElement('button');
          btn.className = 'vn-opt'
            + (opt.danger ? ' danger' : '')
            + (opt.haunted ? ' haunted' : '')
            + (guideHighlight && !deathish && isSafeTarget(opt) ? ' opt-safe' : '');
          btn.innerHTML = opt.text;
          btn.onclick = () => {
            if (isTyping) return;
            // 点击反馈
            btn.classList.remove('opt-flash', 'opt-danger-flash');
            void btn.offsetWidth;
            if (deathish) {
              btn.classList.add('opt-danger-flash');
              showChoiceToast('⚠ 此路大凶——规则在尖叫', 'risk');
            } else {
              btn.classList.add('opt-flash');
              showChoiceToast('✓ 抉择已落子', 'safe');
            }
            if (opt.act) opt.act();
            // act 可能导致心神归零切场景，避免再跳一次
            if (currentScene !== sceneKey && !sceneKey.startsWith('death')) return;
            if (opt.event) goWithEvent(opt.event);
            else if (opt.next) showScene(opt.next);
          };
          optsBox.appendChild(btn);
        });

        // ⏱️ 限时抉择节点（Demo 中延长/取消，避免误杀演示）
        if (node.timed && !demoRunning) {
          startTimed(node.timed);
        } else if (node.timed && demoRunning) {
          // 演示：不倒计时死亡，仅提示机制存在
          showChoiceToast('⏱ 此处原有限时抉择（演示中已暂停倒计时）', 'safe');
        }
      });

      document.getElementById('vn-panel').scrollTop = 0;
    }

      /** 参数化：风险等级 + 原因 + 推荐动作（可组合） */
      risk_assess(args) {
        const key = (args && args.sceneKey) || currentScene || 'prologue_platform';

        const p = typeof meta.p === 'number' ? meta.p : 0.3;
        let level = '低';

          `· 已具备：${ok.length ? ok.join('；') : '无'}\n` +
          `· 仍缺少：${need.length ? need.join('；') : '无'}\n` +
